      :root {
        color-scheme: light;
        font-family: "Aptos", Calibri, "Segoe UI", Roboto, Arial, sans-serif;
        color: #3d1f38;
        background: #fff8fc;

        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        place-items: center;

        overflow: hidden;

        font-size: 18px;

        font-weight: 700;
