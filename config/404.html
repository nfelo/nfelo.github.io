<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b103b" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#100714" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="5; url=https://nfelo.github.io/">
    <link rel="icon" href="/favicon-2026.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/favicon-2026.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-2026.png">
    <title>Page not found · Network Football Elo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Calibri, "Segoe UI", Roboto, Arial, sans-serif;
        color: #2d1838;
        background: #fbf5ff;
        --ink-soft: #6d5875;
        --surface: #fffaff;
        --navy: #2b103b;
        --on-dark: #fff7ff;
        --border: rgba(57, 26, 71, .16);
        --shadow: rgba(48, 17, 63, .12);
        --ring: rgba(255, 157, 221, .48);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          color: #fff7ff;
          background: #160d1c;
          --ink-soft: #d7c3de;
          --surface: #24152c;
          --navy: #855596;
          --on-dark: #fff7ff;
          --border: rgba(236, 210, 244, .2);
          --shadow: rgba(4, 1, 6, .42);
          --ring: rgba(255, 139, 214, .56);
        }
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        place-items: center;
      }
      main {
        width: min(620px, 100%);
        padding: clamp(28px, 7vw, 42px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 50px var(--shadow);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(38px, 8vw, 64px);
        letter-spacing: -.04em;
        line-height: .98;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-soft);
        font-size: 18px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        color: var(--on-dark);
        background: var(--navy);
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        body { padding: 16px; }
        p { font-size: 17px; }
        a { width: 100%; text-align: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The address does not match a page on Network Football Elo. You will be returned to the homepage in five seconds.</p>
      <a href="https://nfelo.github.io/">Return to the homepage</a>
    </main>
  </body>
</html>
