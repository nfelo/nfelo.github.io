      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          color: #fff9fd;
          background: #170b14;
          --ink-soft: #e4ccdc;
          --surface: #27111f;
          --navy: #6f3466;
          --on-dark: #fff9fd;
          --border: rgba(244, 212, 237, .21);
          --shadow: rgba(4, 1, 6, .42);

          --mermaid-pearl: rgba(111, 177, 178, .055);

          --stationery-line: rgba(239, 177, 214, .18);
        }
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        place-items: center;
        background:
          radial-gradient(ellipse 34rem 23rem at -5% 0, rgba(255, 198, 227, .32), transparent 69%),

          radial-gradient(ellipse 24rem 18rem at 88% 96%, var(--mermaid-pearl), transparent 74%),
          #fff8fc;
      }
      main {
        position: relative;
        isolation: isolate;
        width: min(620px, 100%);
        overflow: hidden;
        padding: clamp(28px, 7vw, 42px);
        background:
          linear-gradient(118deg, transparent 0 54%, rgba(255, 255, 255, .16) 64%, transparent 75%),

        border-radius: 28px 40px 28px 40px;
        box-shadow:
          inset 0 1px 0 var(--pearl),
          0 20px 50px var(--shadow);

      main::before {
        position: absolute;
        z-index: 0;
        inset: 8px;
        pointer-events: none;
        border: 1px solid rgba(190, 75, 144, .14);

        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3);
        content: "";

      main::after {
        position: absolute;
        z-index: 0;
        top: -70px;
        right: -54px;
        width: 220px;
        aspect-ratio: 1.16;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 38% 27%,
            rgba(255, 255, 255, .42),
            rgba(248, 184, 218, .12) 49%,
            transparent 68%
          );
        border: 1px solid rgba(190, 75, 144, .12);
        border-radius: 50%;
        box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .15);
        content: "";
        transform: rotate(-9deg);

      main > * {
        position: relative;
        z-index: 1;
      }
      h1 {

        font-family: "Fraunces Variable", Candara, Corbel, serif;
        font-size: clamp(38px, 8vw, 64px);

        font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 96;
        letter-spacing: -.043em;
        line-height: .98;
        text-wrap: balance;
      }
      p {
        margin: 0 0 20px;
        padding-bottom: 20px;
        color: var(--ink-soft);
        background:
          radial-gradient(
            circle,
            var(--embroidery-stitch) 0 1px,
            transparent 1.35px
          )
          left bottom / 8px 4px repeat-x;
        font-size: 18px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        color: #35102e;
        background:
          linear-gradient(35deg, transparent 0 41%, rgba(255, 255, 255, .43) 42% 47%, transparent 48%),

            #ee9fc9 52%,
            #e0c7ef 76%,
            #d5e7e5
          );
        border: 1px solid rgba(126, 36, 96, .15);
        border-radius: 999px;
        font-weight: 665;
        letter-spacing: .008em;
        text-decoration: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .68),
          0 8px 22px var(--shadow);
        transition: transform .18s ease, box-shadow .18s ease;
      }
      a:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .76),
          0 12px 27px var(--shadow);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(ellipse 32rem 22rem at -5% 0, rgba(132, 49, 103, .17), transparent 70%),
            radial-gradient(ellipse 29rem 24rem at 105% 18%, rgba(101, 72, 130, .15), transparent 73%),

      }

        body {

        main {

        main::before { inset: 6px; }
        main::after {
          top: -58px;
          right: -68px;
          width: 178px;
          opacity: .72;
        }
        p { font-size: 17px; }
        a { width: 100%; text-align: center; }

      @media print {
        main::after { display: none; }
        main { border: 1px solid #999; box-shadow: none; }

      @media (prefers-reduced-motion: reduce) {
