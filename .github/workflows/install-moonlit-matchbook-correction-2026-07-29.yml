name: Install moonlit matchbook correction

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-moonlit-matchbook-correction
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the audited baseline and lock the identity
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "1eac4bad1b9f5af6af03a2ce6c3dd60ddef6eae30d4b03feaf43b11d7c07c8e0"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "a794d697aa56974775cd1acc9b31bd0ce930540e9799d7abe119979d2466439b"
          grep -Fq \
            "Unified pearl atelier finishing system." \
            public/assets/styles.css
          test \
            "$(grep -Fc "Moonlit matchbook visibility correction." \
              public/assets/styles.css || true)" \
            -eq 0

          route_count="$(find public -type f -name index.html | wc -l)"
          test "$route_count" -eq 260

          sha256sum --check <<'SHA256'
