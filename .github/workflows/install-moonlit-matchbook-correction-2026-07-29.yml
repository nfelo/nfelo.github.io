          expected="$RUNNER_TEMP/expected-change-scope.txt"

          git status --porcelain=v1 --untracked-files=all \
            | cut -c4- \
            | LC_ALL=C sort \
            > "$actual"

          {
            printf '%s\n' \
              public/assets/styles.css \
              tests/test_moonlit_matchbook.py
            find public -type f -name index.html
          } | LC_ALL=C sort > "$expected"

          test "$(wc -l < "$actual")" -eq 262
          diff -u "$expected" "$actual"

      - name: Commit the repair and remove this installer
        shell: bash
        env:
          WORKFLOW_FILE: .github/workflows/install-moonlit-matchbook-correction-2026-07-29.yml
        run: |
          set -euo pipefail

          test -f "$WORKFLOW_FILE"
          rm -- "$WORKFLOW_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            public/assets/styles.css \
            public \
            tests/test_moonlit_matchbook.py \
            "$WORKFLOW_FILE"
          git commit -m "style: repair moonlit visibility and matchbook [skip ci]"
          git push origin HEAD:main

      - name: Start the normal Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
