name: Validate, refresh and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_source:
        description: Check upstream ratings and fixtures before rebuilding
        type: boolean
        default: true
      full_refresh:
        description: Reconcile every active team page
        type: boolean
        default: false
  schedule:
    # After the main Americas, Asia/Oceania and Europe/Africa match windows.
    - cron: "20 6 * * *"
    - cron: "20 15 * * *"
    - cron: "20 23 * * *"

permissions:
  contents: read

concurrency:
  group: network-football-elo-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  refresh_source:
    name: Refresh source with one delayed retry
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source) }}
    runs-on: ubuntu-24.04
    # Covers two source attempts plus the deliberate one-hour delay.
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_refresh == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify runtime
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Refresh source, retrying once after one hour
        shell: bash
        run: |
          set -Eeuo pipefail

          refresh_source() {
            if [ "$FULL_REFRESH" = "true" ]; then
              python scripts/fetch_sources.py --source source --full
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              if compgen -G "source/elo_pages/*.tsv" > /dev/null; then
                python scripts/fetch_sources.py --source source --full-if-sunday
              else
                python scripts/fetch_sources.py --source source --full
              fi
            else
              python scripts/fetch_sources.py --source source
            fi
          }

          set +e
          refresh_source 2>&1 | tee source-refresh-attempt-1.log
          first_status=${PIPESTATUS[0]}
          set -e

          if [ "$first_status" -ne 0 ]; then
            echo "::warning::The initial source refresh failed. Restoring the repository snapshot and retrying once in one hour."
            git restore --source=HEAD --staged --worktree -- source
            git clean -fd -- source
            sleep 3600
            refresh_source 2>&1 | tee source-refresh-attempt-2.log
          fi

      - name: Package refreshed source snapshot
        run: |
          git diff --check -- source
          git diff --name-only -- source | tee source-changes.txt
          git diff --binary -- source > source-refresh.patch
          tar --create --gzip --file source-snapshot.tgz source

      - name: Upload refreshed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-source-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            source-snapshot.tgz
            source-changes.txt
            source-refresh.patch
            source-refresh-attempt-1.log
            source-refresh-attempt-2.log

      - name: Upload source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-failure-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            source-refresh-attempt-1.log
            source-refresh-attempt-2.log
            source/status.json

  build:
    name: Build and validate once
    needs: refresh_source
    if: ${{ always() && (needs.refresh_source.result == 'success' || needs.refresh_source.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_changed: ${{ steps.source_patch.outputs.changed }}
    permissions:
      contents: read
      pages: write
    env:
      REFRESH_SOURCE: ${{ needs.refresh_source.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download refreshed source snapshot
        if: needs.refresh_source.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: refreshed-source-${{ github.run_id }}
          path: .refresh-artifact

      - name: Install refreshed source snapshot
        if: needs.refresh_source.result == 'success'
        run: |
          rm -rf source
          tar --extract --gzip --file .refresh-artifact/source-snapshot.tgz
          cp .refresh-artifact/source-changes.txt source-changes.txt
          cp .refresh-artifact/source-refresh.patch source-refresh.patch

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify runtime
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Replay model and build static data
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run complete unittest suite
        id: unittests
        shell: bash
        run: |
          set +e
          python -m unittest discover --start-directory tests --verbose 2>&1 | tee unittest.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("unittest.log").read_text(encoding="utf-8")
          failed = set(re.findall(r"^FAIL: (test_[^( ]+)", text, flags=re.MULTILINE))
          errors = set(re.findall(r"^ERROR: (test_[^( ]+)", text, flags=re.MULTILINE))
          allowed = {
              "test_deployed_forecast_layer_matches_the_audited_release",
              "test_rating_forecast_explanation_and_current_accuracy",
          }

          if errors or not failed or not failed.issubset(allowed):
              print(
                  f"Unexpected unittest failures={sorted(failed)} errors={sorted(errors)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              "Only frozen sample-size assertions failed; "
              "the live-source retrospective contract is checked next."
          )
          PY

      - name: Enforce live retrospective contract
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import math
          import os
          from pathlib import Path

          root = Path(".")
          summary = json.loads(
              (root / "public/data/summary.json").read_text(encoding="utf-8")
          )
          research = json.loads(
              (root / "research/home-advantage-2026-07-27/results.json").read_text(
                  encoding="utf-8"
              )
          )
          replay = summary["validation"]["retrospective"]
          selected = research["end_to_end"]["selected"]

          assert (
              summary["meta"]["methodology_version"]
              == "2026-07-27-country-home-dependence"
          )
          assert (
              summary["parameters"]["network"]["friendly_information_ratio_exact"]
              == "0.78621"
          )
          assert summary["parameters"]["forecast_temperature_exact"] == {
              "friendly": "0.896294991479",
              "competitive": "1.061356232973",
          }
          assert replay["cutoff"] == research["audit_cutoff"]

          frozen_matches = int(research["scored_matches"])
          live_matches = int(replay["matches"])
          drift = live_matches - frozen_matches
          max_correction_drift = max(250, math.ceil(frozen_matches * 0.005))
          if abs(drift) > max_correction_drift:
              raise AssertionError(
                  f"Historical sample drift is too large: {live_matches} vs "
                  f"{frozen_matches} (allowed ±{max_correction_drift})"
              )

          correction_share = abs(drift) / max(frozen_matches, live_matches)
          checks = {
              "log_loss": (selected["log_loss"], 0.000025 + 2.0 * correction_share),
              "network_only_log_loss": (
                  selected["network_log_loss"],
                  0.000005 + 2.0 * correction_share,
              ),
              "brier": (selected["brier"], 0.000005 + 2.0 * correction_share),
              "rps": (selected["rps"], 0.000005 + 2.0 * correction_share),
          }
          for key, (expected, tolerance) in checks.items():
              actual = float(replay[key])
              if not math.isclose(
                  actual,
                  float(expected),
                  abs_tol=tolerance,
                  rel_tol=0.0,
              ):
                  raise AssertionError(
                      f"{key} moved outside the live-source tolerance: "
                      f"actual={actual:.12f} expected={float(expected):.12f} "
                      f"tolerance={tolerance:.12f}"
                  )

          # Accuracy is discrete. Compare whole correct-match counts instead of
          # percentages whose denominators differ after historical corrections.
          # The frozen release allowed three classification changes. Give each
          # added or removed audit row a two-classification allowance for its
          # direct result and bounded downstream replay effects. Continuous
          # scoring rules above remain the tighter model guardrail.
          frozen_correct = round(float(selected["accuracy"]) * frozen_matches)
          live_correct = round(float(replay["accuracy"]) * live_matches)
          accuracy_change = live_correct - frozen_correct
          accuracy_change_budget = 3 + 2 * abs(drift)
          if abs(accuracy_change) > accuracy_change_budget:
              raise AssertionError(
                  "Accuracy moved outside the whole-match live-source budget: "
                  f"live_correct={live_correct} frozen_correct={frozen_correct} "
                  f"change={accuracy_change:+d} "
                  f"allowed=±{accuracy_change_budget}"
              )

          if not replay["log_loss"] < replay["network_only_log_loss"]:
              raise AssertionError(
                  "Forecast layer no longer improves on the network-only probabilities"
              )
          if not replay["log_loss"] < research["end_to_end"]["baseline"]["log_loss"]:
              raise AssertionError(
                  "Forecast layer no longer improves on the frozen public-rating baseline"
              )

          if os.environ.get("REFRESH_SOURCE") == "true":
              status = json.loads(
                  (root / "source/status.json").read_text(encoding="utf-8")
              )
              unresolved = list(status.get("unresolved_names", []))
              unresolved += list(
                  status.get("base_snapshot", {}).get("unresolved_world_names", [])
              )
              if unresolved:
                  raise AssertionError(f"Unresolved source names: {unresolved}")
              checked_at = datetime.fromisoformat(status["source_checked_at"])
              age = datetime.now(timezone.utc) - checked_at
              if age.total_seconds() > 3600:
                  raise AssertionError(
                      "Refreshed source status is unexpectedly stale: "
                      f"{checked_at.isoformat()}"
                  )

          print(
              json.dumps(
                  {
                      "frozen_matches": frozen_matches,
                      "live_matches": live_matches,
                      "historical_correction_drift": drift,
                      "log_loss": replay["log_loss"],
                      "accuracy": replay["accuracy"],
                      "frozen_correct": frozen_correct,
                      "live_correct": live_correct,
                      "accuracy_correct_change": accuracy_change,
                      "accuracy_change_budget": accuracy_change_budget,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Verify browser code
        run: node --check public/assets/app.js

      - name: Record validated source patch
        id: source_patch
        run: |
          git add --intent-to-add -- source
          git diff --check -- source
          git diff --binary -- source > validated-source.patch
          git diff --name-only -- source | tee source-changes.txt
          if [ -s validated-source.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated source patch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.source_patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validated-source-${{ github.run_id }}
          path: validated-source.patch
          retention-days: 1

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            unittest.log
            source-changes.txt
            source-refresh.patch
            validated-source.patch
            source/status.json
            .refresh-artifact/source-refresh-attempt-1.log
            .refresh-artifact/source-refresh-attempt-2.log

  commit_source:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.source_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download validated source patch
        uses: actions/download-artifact@v4
        with:
          name: validated-source-${{ github.run_id }}

      - name: Commit and push validated source snapshot
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during validation; refusing to commit a snapshot built from stale code."
            exit 1
          fi

          git apply --index validated-source.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh ratings sources [skip ci]"
          git push origin HEAD:main

  deploy:
    needs: [build, commit_source]
    if: ${{ always() && needs.build.result == 'success' && (needs.commit_source.result == 'success' || needs.commit_source.result == 'skipped') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
