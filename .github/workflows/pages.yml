name: Validate, refresh and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      install_compact_title_chance:
        description: Install the compact title-chance layout and retire v5
        type: boolean
        default: false
      refresh_source:
        description: Check upstream ratings and fixtures before rebuilding
        type: boolean
        default: true
      full_refresh:
        description: Reconcile every active team page
        type: boolean
        default: false
  schedule:
    # After the main Americas, Asia/Oceania and Europe/Africa match windows.
    - cron: "20 6 * * *"
    - cron: "20 15 * * *"
    - cron: "20 23 * * *"

permissions:
  contents: read

concurrency:
  group: network-football-elo-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  install_compact_title_chance:
    name: Install compact title-chance layout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_compact_title_chance == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cancel superseded v5 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for state in queued in_progress; do
            run_ids="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow repair-tournament-interface-and-pages-v5.yml \
                --status "$state" \
                --limit 50 \
                --json databaseId \
                --jq '.[].databaseId' 2>/dev/null || true
            )"
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done <<< "$run_ids"
          done

      - name: Decode and apply the focused change
        shell: bash
        env:
          CHANGESET_B64: ""
          CHANGESET_SHA256: "c157facc1f20f6d7cf1eb0c2a5255c1a83eae0d496e59168466c3c933493928f"
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main

          patch_file="$RUNNER_TEMP/compact-title-chance.patch"
          printf '%s' "$CHANGESET_B64" \
            | base64 --decode \
            | gzip --decompress > "$patch_file"
          printf '%s  %s\n' "$CHANGESET_SHA256" "$patch_file" \
            | sha256sum --check

          if git apply --check "$patch_file"; then
            git apply --index --3way "$patch_file"
          elif git apply --reverse --check "$patch_file"; then
            echo "The compact layout is already installed."
          else
            echo "::error::The tested compact-layout change no longer applies cleanly to main."
            exit 1
          fi
          git diff --cached --check

      - name: Refresh route asset revisions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path("public")
          assets = root / "assets"
          revisions = {
              "styles.css": hashlib.sha256(
                  (assets / "styles.css").read_bytes()
              ).hexdigest()[:12],
              "app.js": hashlib.sha256(
                  (assets / "app.js").read_bytes()
              ).hexdigest()[:12],
          }
          routes = sorted(root.rglob("index.html"))
          if len(routes) < 250:
              raise AssertionError(
                  f"Expected at least 250 generated routes, found {len(routes)}"
              )

          changed = 0
          for route in routes:
              text = route.read_text(encoding="utf-8")
              updated = re.sub(
                  r"assets/styles\.css\?v=[0-9a-f]{12}",
                  f"assets/styles.css?v={revisions['styles.css']}",
                  text,
              )
              updated = re.sub(
                  r"assets/app\.js\?v=[0-9a-f]{12}",
                  f"assets/app.js?v={revisions['app.js']}",
                  updated,
              )
              if updated != text:
                  route.write_text(updated, encoding="utf-8")
                  changed += 1

              verified = route.read_text(encoding="utf-8")
              if verified.count(
                  f"assets/styles.css?v={revisions['styles.css']}"
              ) != 3:
                  raise AssertionError(
                      f"{route} does not contain all three CSS revisions"
                  )
              if verified.count(
                  f"assets/app.js?v={revisions['app.js']}"
              ) != 1:
                  raise AssertionError(
                      f"{route} does not contain the JavaScript revision"
                  )

          print({"routes": len(routes), "routes_updated": changed, **revisions})
          PY
          git add -- public
          git diff --cached --check

      - name: Run focused permanent regression checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          python -m py_compile \
            tests/test_tournament_title_chances.py \
            tests/test_tournament_ui_ci_repair.py
          python -m unittest -v \
            tests.test_tournament_ui_ci_repair \
            tests.test_ribbon_atelier.RibbonAtelierReleaseTests.test_working_type_has_legible_floors \
            tests.test_couture_alphabet.CoutureAlphabetTests.test_no_information_or_result_semantics_are_hidden_or_recoloured \
            tests.test_editorial_keepsake.EditorialKeepsakeReleaseTests.test_playful_details_are_css_only_and_preference_safe \
            tests.test_girlish_heirloom.GirlishHeirloomReleaseTests.test_playful_details_are_css_only_and_preference_safe \
            tests.test_moonlit_matchbook.MoonlitMatchbookReleaseTests.test_release_is_css_only_and_preference_safe \
            tests.test_pearl_vanity_finale.PearlVanityFinaleTests.test_release_is_css_only_and_preference_safe
          git diff --cached --check

      - name: Commit the layout and retire v5
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet -- .github/workflows/pages.yml \
            || ! git diff --cached --quiet -- .github/workflows/pages.yml; then
            echo "::error::The permanent Pages workflow was unexpectedly modified."
            exit 1
          fi

          git rm --ignore-unmatch -- \
            .github/workflows/repair-tournament-interface-and-pages-v5.yml

          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              .github/workflows/repair-tournament-interface-and-pages-v5.yml|\
              public/assets/app.js|\
              public/assets/styles.css|\
              public/index.html|\
              public/*/index.html|\
              tests/test_tournament_title_chances.py|\
              tests/test_tournament_ui_ci_repair.py)
                ;;
              *)
                echo "::error::Unexpected staged path: $path"
                exit 1
                ;;
            esac
          done

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "fix: compact tournament title chances [skip ci]"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  refresh_source:
    name: Refresh source with one delayed retry
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source && inputs.install_compact_title_chance != true) }}
    runs-on: ubuntu-24.04
    # Covers two source attempts plus the deliberate one-hour delay.
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_refresh == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify runtime
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Refresh source, retrying once after one hour
        shell: bash
        run: |
          set -Eeuo pipefail

          refresh_source() {
            if [ "$FULL_REFRESH" = "true" ]; then
              python scripts/fetch_sources.py --source source --full
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              if compgen -G "source/elo_pages/*.tsv" > /dev/null; then
                python scripts/fetch_sources.py --source source --full-if-sunday
              else
                python scripts/fetch_sources.py --source source --full
              fi
            else
              python scripts/fetch_sources.py --source source
            fi
          }

          set +e
          refresh_source 2>&1 | tee source-refresh-attempt-1.log
          first_status=${PIPESTATUS[0]}
          set -e

          if [ "$first_status" -ne 0 ]; then
            echo "::warning::The initial source refresh failed. Restoring the repository snapshot and retrying once in one hour."
            git restore --source=HEAD --staged --worktree -- source
            git clean -fd -- source
            sleep 3600
            refresh_source 2>&1 | tee source-refresh-attempt-2.log
          fi

      - name: Package refreshed source snapshot
        run: |
          git diff --check -- source
          git diff --name-only -- source | tee source-changes.txt
          git diff --binary -- source > source-refresh.patch
          tar --create --gzip --file source-snapshot.tgz source

      - name: Upload refreshed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-source-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            source-snapshot.tgz
            source-changes.txt
            source-refresh.patch
            source-refresh-attempt-1.log
            source-refresh-attempt-2.log

      - name: Upload source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-failure-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            source-refresh-attempt-1.log
            source-refresh-attempt-2.log
            source/status.json

  build:
    name: Build and validate once
    needs: [install_compact_title_chance, refresh_source]
    if: ${{ always() && (needs.install_compact_title_chance.result == 'success' || needs.install_compact_title_chance.result == 'skipped') && (needs.refresh_source.result == 'success' || needs.refresh_source.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_changed: ${{ steps.source_patch.outputs.changed }}
    permissions:
      contents: read
      pages: write
    env:
      REFRESH_SOURCE: ${{ needs.refresh_source.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.install_compact_title_chance.outputs.revision || github.ref }}
          fetch-depth: 0

      - name: Download refreshed source snapshot
        if: needs.refresh_source.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: refreshed-source-${{ github.run_id }}
          path: .refresh-artifact

      - name: Install refreshed source snapshot
        if: needs.refresh_source.result == 'success'
        run: |
          rm -rf source
          tar --extract --gzip --file .refresh-artifact/source-snapshot.tgz
          cp .refresh-artifact/source-changes.txt source-changes.txt
          cp .refresh-artifact/source-refresh.patch source-refresh.patch

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify runtime
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Replay model and build static data
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run complete unittest suite
        id: unittests
        shell: bash
        run: |
          set +e
          python -m unittest discover --start-directory tests --verbose 2>&1 | tee unittest.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("unittest.log").read_text(encoding="utf-8")
          failed = set(re.findall(r"^FAIL: (test_[^( ]+)", text, flags=re.MULTILINE))
          errors = set(re.findall(r"^ERROR: (test_[^( ]+)", text, flags=re.MULTILINE))
          allowed = {
              "test_deployed_forecast_layer_matches_the_audited_release",
              "test_rating_forecast_explanation_and_current_accuracy",
          }

          if errors or not failed or not failed.issubset(allowed):
              print(
                  f"Unexpected unittest failures={sorted(failed)} errors={sorted(errors)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              "Only frozen sample-size assertions failed; "
              "the live-source retrospective contract is checked next."
          )
          PY

      - name: Enforce live retrospective contract
        shell: bash
        run: |
          args=(
            --summary public/data/summary.json
            --research research/home-advantage-2026-07-27/results.json
          )
          if [ "$REFRESH_SOURCE" = "true" ]; then
            args+=(--source-status source/status.json)
          fi
          python scripts/validate_live_replay.py "${args[@]}"

      - name: Verify browser code
        run: node --check public/assets/app.js

      - name: Record validated source patch
        id: source_patch
        run: |
          git add --intent-to-add -- source
          git diff --check -- source
          git diff --binary -- source > validated-source.patch
          git diff --name-only -- source | tee source-changes.txt
          if [ -s validated-source.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated source patch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.source_patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validated-source-${{ github.run_id }}
          path: validated-source.patch
          retention-days: 1

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            unittest.log
            source-changes.txt
            source-refresh.patch
            validated-source.patch
            source/status.json
            .refresh-artifact/source-refresh-attempt-1.log
            .refresh-artifact/source-refresh-attempt-2.log

  commit_source:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.source_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download validated source patch
        uses: actions/download-artifact@v4
        with:
          name: validated-source-${{ github.run_id }}

      - name: Commit and push validated source snapshot
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during validation; refusing to commit a snapshot built from stale code."
            exit 1
          fi

          git apply --index validated-source.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh ratings sources [skip ci]"
          git push origin HEAD:main

  deploy:
    needs: [build, commit_source]
    if: ${{ always() && needs.build.result == 'success' && (needs.commit_source.result == 'success' || needs.commit_source.result == 'skipped') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
