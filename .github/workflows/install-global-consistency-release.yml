name: Install global consistency release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-global-consistency-release
  cancel-in-progress: false

jobs:
  install:
    name: Verify, install, test and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Confirm compatible source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "README.md": "5e71d91a7a7c07dd701fb4271af9c081a3c092dee4a7ccb87c9051e236a56fe8",
              "docs/model-validation.md": "6945b9076e72d23cca6880e199e6e506d66b2b1f59db27813e376da91f74b399",
              "public/assets/app.js": "5f90f136e78163c25493dd52f4a5a0be639c181c4f5a02d4f687fbae2c0fed4a",
              "scripts/audit_site_consistency.py": "fca52031a21fa5596c292a661d7fa6f32d9907569814b2aa1a6fdfbdb702bebf",
              "scripts/build_site.py": "dd4119e0d8b90a61efd1f93e9594675ca125dba5413eb843bc41f00fef96aa77",
              "scripts/model.py": "0fc0c977871243fb836d269104531a3ef27f82cc664cfdc96c6fd802d0bc0bed",
              "source/en.teams.tsv": "ff4b8c9c7bcdad56e81a007726c1a655c6dabdf77bca151b1d619f24125dbc90",
              "tests/test_build.py": "1b6a6e0584706699416b7b7359e978dbdb36e517cd73001c2ebb65119125bf3e",
              "tests/test_tournament_classification.py": "56d50682b19c24b58ebcf76be4f7931f2376c80ecf64c9d49a897daa791b874b",
          }
          mismatches = []
          for name, wanted in expected.items():
              path = Path(name)
              actual = sha256(path.read_bytes()).hexdigest() if path.exists() else "missing"
              if actual != wanted:
                  mismatches.append(f"{name}: expected {wanted}, found {actual}")
          if mismatches:
              raise SystemExit(
                  "This installer was built for the audited current main source. "
                  "These files have changed, so it stopped rather than overwrite them:\n"
                  + "\n".join(mismatches)
              )
          print("Compatible audited source confirmed.")
          PY

      - name: Install audited source release
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/nfelo-global-consistency-release.tar.xz
          base64 --decode > "$archive" <<'NFELO_RELEASE_ARCHIVE'
