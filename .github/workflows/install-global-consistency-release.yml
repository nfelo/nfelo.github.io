      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild the complete site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public

      - name: Run the complete verification suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js
          python -m py_compile \
            scripts/model.py \
            scripts/build_site.py \
            scripts/audit_site_consistency.py
          python scripts/audit_site_consistency.py \
            --public public
          git diff --check -- \
            README.md \
            docs/model-validation.md \
            public/assets/app.js \
            scripts/audit_site_consistency.py \
            scripts/build_site.py \
            scripts/model.py \
            source/en.teams.tsv \
            tests/test_build.py \
            tests/test_tournament_classification.py

          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          data = Path("public/data")
          summary = json.loads((data / "summary.json").read_text(encoding="utf-8"))
          history_index = json.loads(
              (data / "rankings-history/index.json").read_text(encoding="utf-8")
          )
          assert summary["meta"]["methodology_version"] == (
              "2026-07-26-global-as-of-consistency"
          )
          assert history_index["last"] == summary["meta"]["rankings_as_of"]
          assert history_index["last_matchday"] == summary["meta"]["results_through"]
          assert len(history_index["codes"]) == summary["meta"]["teams"]
          assert json.loads((data / "state.json").read_text(encoding="utf-8"))[
              "margin_environment"
          ] > 0
          largest = max(
              (
                  len(path.read_bytes()),
                  len(gzip.compress(path.read_bytes(), compresslevel=6)),
                  path,
              )
              for path in (data / "rankings-history").glob("*.json")
          )
          assert largest[0] < 5_000_000, largest
          print(
              "Largest History file:",
              largest[2].name,
              f"{largest[0] / 1_000_000:.2f} MB raw,",
              f"{largest[1] / 1_000_000:.2f} MB compressed",
          )
          PY

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            README.md \
            docs/model-validation.md \
            public/assets/app.js \
            scripts/audit_site_consistency.py \
            scripts/build_site.py \
            scripts/model.py \
            source/en.teams.tsv \
            tests/test_build.py \
            tests/test_tournament_classification.py
          if ! git diff --quiet -- source/prospective_forecasts.jsonl; then
            git add -- source/prospective_forecasts.jsonl
          fi

          if git diff --cached --quiet; then
            echo "The audited release is already installed."
            exit 0
          fi

          git commit -m "fix: unify global rankings and prediction tools"
          git push origin HEAD:main

      - name: Write completion summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Global consistency release installed"
            echo
            echo "The audited source, documentation and regression tests were committed to main."
            echo "Delete this temporary installer workflow in GitHub after this run succeeds."
            echo "That normal GitHub commit will start the regular Pages build and deployment."
          } >> "$GITHUB_STEP_SUMMARY"
