name: Repair balanced interface deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-balanced-interface-deploy-repair-2026-07-30
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm the failed release baseline
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          expected = {
              Path("public/assets/styles.css"):
                  "028b963d956dc75107f5efda73b876c8ddd7a305",
              Path("tests/test_balanced_interface_unification.py"):
                  "b51afbb39d093ab1eeb9c70bf5026f66f6100eb4",
          }
          for path, wanted in expected.items():
              if not path.is_file():
                  raise SystemExit(f"Required file is missing: {path}")
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)],
                  text=True,
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"{path} has changed since the failed deploy was "
                      f"diagnosed ({actual} != {wanted}). Refusing to "
                      "overwrite newer work."
                  )
          PY

      - name: Repair the empty error-slot rule
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          public = Path("public")
          css_path = public / "assets" / "styles.css"
          test_path = Path(
              "tests/test_balanced_interface_unification.py"
          )

          css = css_path.read_text(encoding="utf-8")
          old_rule = """\
          .field-error:empty {
            display: none;
          }
          """
          new_rule = """\
          .field-error:empty {
            position: absolute;
            inline-size: 0;
            block-size: 0;
            margin: 0;
            padding: 0;
          }
          """
          if css.count(old_rule) != 1:
              raise SystemExit(
                  "Expected one empty error-slot rule in styles.css."
              )
          css = css.replace(old_rule, new_rule, 1)
          css_path.write_text(css, encoding="utf-8")

          test_source = test_path.read_text(encoding="utf-8")
          old_expectation = """\
                      ".field-error:empty {",
                      "display: none;",
                      "@media (min-width: 1025px)",
          """
          new_expectation = """\
                      ".field-error:empty {",
                      "position: absolute;",
                      "inline-size: 0;",
                      "block-size: 0;",
                      "@media (min-width: 1025px)",
          """
          if test_source.count(old_expectation) != 1:
              raise SystemExit(
                  "Expected one stale alignment assertion in the "
                  "balanced-interface test."
              )
          test_source = test_source.replace(
              old_expectation,
              new_expectation,
              1,
          )
          test_path.write_text(test_source, encoding="utf-8")

          css_revision = hashlib.sha256(
              css_path.read_bytes()
          ).hexdigest()[:12]
          html_paths = sorted(public.rglob("*.html"))
          routes = sorted(public.rglob("index.html"))
          if len(routes) != 260:
              raise SystemExit(
                  f"Unexpected route count: {len(routes)} (expected 260)."
              )

          changed_html = 0
          for html_path in html_paths:
              html = html_path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'assets/styles\.css(?:\?v=[^"\']*)?',
                  f"assets/styles.css?v={css_revision}",
                  html,
              )
              if updated != html:
                  html_path.write_text(updated, encoding="utf-8")
                  changed_html += 1
          if changed_html == 0:
              raise SystemExit("No HTML stylesheet revisions were updated.")
          PY

      - name: Verify the repaired presentation contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )
          changed = set()
          for line in status.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          required = {
              "public/assets/styles.css",
              "tests/test_balanced_interface_unification.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(
                  "Expected change is missing: " + ", ".join(missing)
              )
          unexpected = sorted(
              path
              for path in changed
              if path not in required
              and not (
                  path.startswith("public/")
                  and path.endswith(".html")
              )
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: " + ", ".join(unexpected)
              )
          PY

          for test_file in \
            test_balanced_interface_unification.py \
            test_couture_alphabet.py \
            test_editorial_keepsake.py \
            test_girlish_heirloom.py \
            test_moonlit_matchbook.py \
            test_pearl_vanity_finale.py \
            test_unified_pearl_atelier.py
          do
            python -m unittest discover \
              --start-directory tests \
              --pattern "$test_file" \
              --verbose
          done

      - name: Commit and trigger Pages again
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public \
            tests/test_balanced_interface_unification.py
          if git diff --cached --quiet; then
            echo "The deploy repair is already installed."
            exit 0
          fi
          git commit -m "fix: preserve alignment without hiding fields"
          git push
