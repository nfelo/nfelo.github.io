    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the repository and installed presentation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test -f scripts/build_site.py
          test -f public/assets/styles.css
          test -f tests/test_presentation.py
          grep -Fq "Floral couture refinement"             public/assets/styles.css
          grep -Fq "Fraunces Variable" public/assets/styles.css

      - name: Decode and inspect the refinement
        shell: bash
        run: |
          set -euo pipefail
          release=/tmp/nfelo-botanical-wash-refinement.tar.xz

          {
            printf '%s' "$UPDATE_ARCHIVE_01"
            printf '%s' "$UPDATE_ARCHIVE_02"
          } | tr -d '[:space:]' | base64 --decode > "$release"

          echo "$UPDATE_ARCHIVE_SHA256  $release" | sha256sum --check

          RELEASE="$release" python - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_presentation.py",
          }
          with tarfile.open(os.environ["RELEASE"], "r:xz") as archive:
              members = archive.getmembers()
          names = [member.name for member in members]
          if len(names) != len(set(names)):
              raise AssertionError("The release contains duplicate paths")
          if set(names) != expected:
              raise AssertionError(
                  "Unexpected release contents: "
                  f"missing={sorted(expected - set(names))}, "
                  f"extra={sorted(set(names) - expected)}"
              )
          for member in members:
              path = PurePosixPath(member.name)
              if path.is_absolute() or ".." in path.parts:
                  raise AssertionError(
                      f"Unsafe archive path: {member.name}"
                  )
              if not member.isfile():
                  raise AssertionError(
                      f"Release entry is not a regular file: {member.name}"
                  )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild every static route
        run: python scripts/build_site.py --source source --config config --output public

      - name: Apply and version the botanical wash
        shell: bash
        run: |
          set -euo pipefail
          release=/tmp/nfelo-botanical-wash-refinement.tar.xz
          tar --touch -xJf "$release" -C .

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import shutil
          from pathlib import Path

          public = Path("public")
          stylesheet = public / "assets" / "styles.css"
          revision = hashlib.sha256(
              stylesheet.read_bytes()
          ).hexdigest()[:12]
          marker = f"assets/styles.css?v={revision}"
          pattern = re.compile(
              r'assets/styles\.css(?:\?v=[^"\']*)?'
          )
          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise AssertionError(
                  f"Only {len(routes)} generated routes were found"
              )
          for route in routes:
              html = route.read_text(encoding="utf-8")
              updated = pattern.sub(marker, html)
              if updated == html and marker not in html:
                  raise AssertionError(
                      f"Could not version the stylesheet in {route}"
                  )
              route.write_text(updated, encoding="utf-8")
          shutil.copyfile("config/404.html", "public/404.html")
          print(f"Applied {marker} to {len(routes)} routes.")
          PY

          git diff --check

      - name: Run the complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          node scripts/smoke_browser_boot.js public

      - name: Audit responsive presentation and change boundary
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          public = Path("public")
          stylesheet_path = public / "assets" / "styles.css"
          stylesheet = stylesheet_path.read_text(encoding="utf-8")
          css_version = hashlib.sha256(
              stylesheet_path.read_bytes()
          ).hexdigest()[:12]
          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise AssertionError(
                  f"Only {len(routes)} generated routes were found"
              )

          marker = f"assets/styles.css?v={css_version}"
          for route in routes:
              html = route.read_text(encoding="utf-8")
              if marker not in html:
                  raise AssertionError(
                      f"{route} does not use {marker}"
                  )

          required_css = (
              "Dainty botanical wash",
              "atmosphere rather than applied ornament",
              "Repeated information should read as data",
              "--botanical-blush:",
              "--botanical-lilac:",
              "--botanical-edge:",
              "@media (prefers-color-scheme: dark)",
              "@media (min-width: 721px) and (max-width: 1024px)",
              "@media (max-width: 720px)",
              "--result-win: #2f7657;",
              "--result-loss: #a93b55;",
              'font-feature-settings: "lnum" 1, "tnum" 1;',
          )
          for required in required_css:
              if required not in stylesheet:
                  raise AssertionError(
                      f"Missing presentation marker: {required}"
                  )

          final_layer = stylesheet.split(
              "Dainty botanical wash",
              1,
          )[1]
          for applied_art in (
              "botanical-sprig-2026.svg",
              "floral-divider-2026.svg",
              "floral-corner-rose-2026.svg",
              "floral-corner-blossom-2026.svg",
              "floral-ribbon-2026.svg",
              "--bow-mask",
              "--blossom-mask",
          ):
              if applied_art in final_layer:
                  raise AssertionError(
                      f"Applied vector ornament remains: {applied_art}"
                  )

          config_404 = Path("config/404.html").read_text(
              encoding="utf-8"
          )
          for applied_art in (
              "floral-corner-",
              "floral-ribbon",
              "floral-divider",
              "-webkit-mask:",
              "mask:",
          ):
              if applied_art in config_404:
                  raise AssertionError(
                      f"404 still contains applied art: {applied_art}"
                  )

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          changed.update(
              subprocess.check_output(
                  [
                      "git",
                      "ls-files",
                      "--others",
                      "--exclude-standard",
                  ],
                  text=True,
              ).splitlines()
          )
          expected_changes = {
              route.as_posix() for route in routes
          } | {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_presentation.py",
          }
          if changed != expected_changes:
              raise AssertionError(
                  "Unexpected change boundary: "
                  f"missing={sorted(expected_changes - changed)}, "
                  f"extra={sorted(changed - expected_changes)}"
              )

          protected_prefixes = (
              "source/",
              "docs/",
              "research/",
              "scripts/",
          )
          protected_files = {
              "README.md",
              "config/elo_matches.json",
              "config/forecast_layer.json",
              "config/tournament_classification.json",
              "config/venue_effects.json",
              "public/assets/app.js",
          }
          protected_changes = sorted(
              filename
              for filename in changed
              if (
                  filename in protected_files
                  or filename.startswith(protected_prefixes)
              )
          )
          if protected_changes:
              raise AssertionError(
                  "Model, data, content or application logic changed: "
                  f"{protected_changes}"
              )

          print(f"Routes checked: {len(routes)}")
          print(f"Files changed: {len(changed)}")
          print(f"Stylesheet version: {css_version}")
          print(
              "Light, dark, desktop, tablet and mobile guards passed."
          )
          PY

          git diff --check

      - name: Commit and publish the refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- config public tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No presentation changes were available to commit."
            exit 1
          fi
          git commit -m "Replace applied floral art with botanical wash"
          git push origin HEAD:main

      - name: Installation summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Botanical wash installed"
            echo
            echo "- Removed bow and flower badges from interface controls."
            echo "- Replaced applied vectors with integrated colour washes."
            echo "- Added dedicated light, dark, desktop, tablet and mobile treatments."
            echo "- Preserved content, ratings, data and application logic."
          } >> "$GITHUB_STEP_SUMMARY"
