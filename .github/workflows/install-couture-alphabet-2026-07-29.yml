          from __future__ import annotations

          import hashlib
          import os
          import re
          from pathlib import Path


          root = Path.cwd()
          payload = Path(os.environ["RUNNER_TEMP"]) / "couture-alphabet"
          styles_path = root / "public" / "assets" / "styles.css"
          not_found_path = root / "config" / "404.html"
          test_path = root / "tests" / "test_couture_alphabet.py"

          styles_marker = (
              "Couture alphabet: twenty-six new feminine, "
              "functional refinements."
          )
          styles = styles_path.read_text(encoding="utf-8")
          if styles_marker not in styles:
              addition = (
                  payload / "couture-alphabet.css"
              ).read_text(encoding="utf-8").strip()
              styles_path.write_text(
                  styles.rstrip() + "\n\n" + addition + "\n",
                  encoding="utf-8",
              )

          not_found_marker = (
              "Couture alphabet echo for the standalone route."
          )
          not_found = not_found_path.read_text(encoding="utf-8")
          if not_found_marker not in not_found:
              addition = (
                  payload / "not-found-alphabet.css"
              ).read_text(encoding="utf-8").rstrip()
              closing = "    </style>"
              if not_found.count(closing) != 1:
                  raise SystemExit(
                      "The standalone stylesheet boundary changed."
                  )
              not_found_path.write_text(
                  not_found.replace(
                      closing,
                      addition + "\n" + closing,
                  ),
                  encoding="utf-8",
              )

          test_path.write_text(
              (
                  payload / "test_couture_alphabet.py"
              ).read_text(encoding="utf-8"),
              encoding="utf-8",
          )

          styles_hash = hashlib.sha256(
              styles_path.read_bytes()
          ).hexdigest()[:12]
          expected_hash = "b6b6a4ba2ca2"
          if styles_hash != expected_hash:
              raise SystemExit(
                  "Installed stylesheet has an unexpected hash: "
                  f"{styles_hash}"
              )

          pattern = re.compile(
              r"assets/styles\.css\?v=[0-9a-f]{12}"
          )
          routes = sorted((root / "public").rglob("index.html"))
          if len(routes) < 250:
              raise SystemExit(
                  f"Only {len(routes)} clean routes were found."
              )
          for route in routes:
              html = route.read_text(encoding="utf-8")
              replacement = (
                  f"assets/styles.css?v={styles_hash}"
              )
              updated, count = pattern.subn(replacement, html)
              if count != 1:
                  raise SystemExit(
                      f"{route} has {count} stylesheet references."
                  )
              route.write_text(updated, encoding="utf-8")
          PY

          test \
            "$(git hash-object public/assets/styles.css)" = \
            "4d702a6e3b48100c067367f9a915e9a494fff62c"
          test \
            "$(git hash-object config/404.html)" = \
            "02f49b5cdca01e9e1b238083ae6a0f2c4abea30f"
          test \
            "$(git hash-object tests/test_couture_alphabet.py)" = \
            "d3cd826f4ad5da609c2014f67481c9bfaba2ed62"

      - name: Verify presentation, accessibility and browser boot
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest \
            tests.test_presentation \
            tests.test_actual_final_presentation \
            tests.test_couture_alphabet \
            --verbose
          node --check public/assets/app.js
          node scripts/smoke_browser_boot.js public
          git diff --check
          sha256sum --check \
            "$RUNNER_TEMP/couture-protected.before"

      - name: Enforce presentation-only scope
        shell: bash
        run: |
          set -euo pipefail

          installer_path=".github/workflows/install-couture-alphabet-2026-07-29.yml"
          rm -- "$installer_path"

          python - <<'PY'
          from __future__ import annotations

          import subprocess


          installer = (
              ".github/workflows/"
              "install-couture-alphabet-2026-07-29.yml"
          )
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          changed.update(
              subprocess.check_output(
                  [
                      "git",
                      "ls-files",
                      "--others",
                      "--exclude-standard",
                  ],
                  text=True,
              ).splitlines()
          )

          exact = {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_couture_alphabet.py",
              installer,
          }

          def allowed(path: str) -> bool:
              return (
                  path in exact
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
                  or path == "public/index.html"
              )

          unexpected = sorted(
              path for path in changed if not allowed(path)
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: "
                  + ", ".join(unexpected)
              )
          if len(
              [
                  path
                  for path in changed
                  if path == "public/index.html"
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
              ]
          ) < 250:
              raise SystemExit(
                  "Not every clean route received the new asset hash."
              )
          PY

          git diff --check

      - name: Commit and publish the installer result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            .github/workflows/install-couture-alphabet-2026-07-29.yml \
            config/404.html \
            public \
            tests/test_couture_alphabet.py

          git commit -m \
            "style: add accessible couture alphabet presentation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start the normal Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatched=false
          for attempt in 1 2 3; do
            if gh workflow run pages.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field refresh_source=false \
              --field full_refresh=false; then
              dispatched=true
              break
            fi
            sleep 5
          done

          if [ "$dispatched" != "true" ]; then
            echo "::error::The release was committed, but Pages could not be started."
            echo "::error::Run 'Refresh ratings and deploy Pages' manually with source refresh off."
            exit 1
          fi

          {
            echo "### Couture alphabet installed"
            echo
            echo "- Presentation-only files changed."
            echo "- The installer removed itself."
            echo "- The normal Pages workflow has been started."
          } >> "$GITHUB_STEP_SUMMARY"
