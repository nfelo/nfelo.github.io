name: Install couture alphabet A-Z

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nfelo-couture-alphabet-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the exact release base
        shell: bash
        run: |
          set -euo pipefail

          installer_path=".github/workflows/install-couture-alphabet-2026-07-29.yml"
          test -f "$installer_path" || {
            echo "::error::Save this workflow at $installer_path before running it."
            exit 1
          }

          test "$(git branch --show-current)" = "main" || {
            echo "::error::This installer must run on main."
            exit 1
          }

          current_styles="$(git hash-object public/assets/styles.css)"
          current_not_found="$(git hash-object config/404.html)"
          old_styles="ae957092a0311aad42eb43469100107e8f746baf"
          old_not_found="11331d6011725a042049622a55bba14261fa55e6"
          new_styles="4d702a6e3b48100c067367f9a915e9a494fff62c"
          new_not_found="02f49b5cdca01e9e1b238083ae6a0f2c4abea30f"

          if [ "$current_styles" = "$new_styles" ] &&
             [ "$current_not_found" = "$new_not_found" ]; then
            echo "The couture alphabet is already installed."
          elif [ "$current_styles" = "$old_styles" ] &&
               [ "$current_not_found" = "$old_not_found" ]; then
            echo "The verified release base is present."
          else
            echo "::error::The presentation files have changed since this release was prepared."
            echo "::error::Current styles blob: $current_styles"
            echo "::error::Current 404 blob: $current_not_found"
            exit 1
          fi

          sha256sum \
            public/assets/app.js \
            scripts/model.py \
            scripts/build_site.py \
            config/elo_matches.json \
            config/forecast_layer.json \
            config/venue_effects.json \
            > "$RUNNER_TEMP/couture-protected.before"

