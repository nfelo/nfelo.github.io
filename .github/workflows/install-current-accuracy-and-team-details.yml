      - name: Build and test the complete site
        shell: bash
        run: |
          set -euo pipefail

          node --check public/assets/app.js
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          from pathlib import Path
          import re

          root = Path(".")
          app = (root / "public/assets/app.js").read_text(encoding="utf-8")
          css = (root / "public/assets/styles.css").read_text(encoding="utf-8")
          readme = (root / "README.md").read_text(encoding="utf-8")
          validation_doc = (
              root / "docs/model-validation.md"
          ).read_text(encoding="utf-8")
          summary = json.loads(
              (root / "public/data/summary.json").read_text(encoding="utf-8")
          )
          replay = summary["validation"]["retrospective"]

          if replay["matches"] != 46_801:
              raise SystemExit(
                  f"Unexpected validation match count: {replay['matches']}"
              )
          if abs(replay["log_loss"] - 0.87833346) > 0.000005:
              raise SystemExit(
                  f"Current log loss moved materially: {replay['log_loss']}"
              )
          if abs(replay["accuracy"] - 0.59169676) > 2.5 / replay["matches"]:
              raise SystemExit(
                  f"Current accuracy moved materially: {replay['accuracy']}"
              )

          required_app = (
              "Current-model accuracy",
              "precisePercent(summary.validation.retrospective.accuracy)",
              "number(summary.validation.retrospective.log_loss, 6)",
              "Current deployed NFELO formula",
              "updated after every non-neutral matchday",
              "Attack and defence forecast details",
              "projectScoreProfile",
              "score-profile-details",
              "after every completed matchday",
              'href="#/methodology?section=venue"',
              'href="#/methodology?section=forecast"',
          )
          for phrase in required_app:
              if phrase not in app:
                  raise SystemExit(f"Missing deployed UI contract: {phrase}")
          forbidden_app = (
              "Historical holdout accuracy",
              "summary.validation.nested",
              "NFELO network benchmark",
              "Published World Football Elo forecast",
              "two different historical log-loss figures",
          )
          for phrase in forbidden_app:
              if phrase in app:
                  raise SystemExit(f"Stale public metric remains: {phrase}")

          methodology = app.split(
              "function renderMethodology(query", 1
          )[1].split("function renderAbout", 1)[0]
          if methodology.count("Current deployed NFELO formula") != 1:
              raise SystemExit(
                  "Methodology must show exactly one current-formula result."
              )
          section_ids = set(re.findall(r'id="method-([a-z]+)"', methodology))
          section_links = set(re.findall(
              r'href="#/methodology\?section=([a-z]+)"',
              app,
          ))
          if section_ids != section_links:
              raise SystemExit(
                  f"Methodology deep links do not match sections: "
                  f"{section_links ^ section_ids}"
              )

          faq = app.split(
              "function buildFAQItems()", 1
          )[1].split("function faqSearchTokens", 1)[0]
          if faq.count('question: "') != 33:
              raise SystemExit("The FAQ must still contain 33 questions.")
          if "summary.validation.nested" in faq:
              raise SystemExit("FAQ still uses the superseded benchmark.")
          for phrase in (
              "When does a team’s home-and-away estimate change?",
              "How accurate is the current NFELO formula?",
              "Team pages show these tendencies in an expandable section.",
          ):
              if phrase not in faq:
                  raise SystemExit(f"FAQ clarification missing: {phrase}")

          for phrase in ("0.878333", "59.170%"):
              if phrase not in readme or phrase not in validation_doc:
                  raise SystemExit(
                      f"Current metric missing from public documentation: {phrase}"
                  )
          if "0.884219" in readme:
              raise SystemExit("README still presents the old headline.")

          for marker in (
              ".team-model-details",
              ".venue-detail-grid",
              "@media (max-width: 720px)",
          ):
              if marker not in css:
                  raise SystemExit(f"Responsive team detail style missing: {marker}")

          for code in ("ES", "DE", "BO"):
              page = json.loads(
                  (
                      root / "public/data/teams" / f"{code}.json"
                  ).read_text(encoding="utf-8")
              )
              states = [
                  point["score_state"]
                  for point in page["history"]
                  if point.get("score_state")
              ]
              if not states:
                  raise SystemExit(f"{code} has no attack/defence state.")
              for field in (
                  "attack",
                  "defence",
                  "last_day",
                  "annual_decay",
                  "learning_rate",
              ):
                  if field not in states[-1]:
                      raise SystemExit(
                          f"{code} score state is missing {field}."
                      )

          if summary["current"][0]["nation"] != "Spain":
              raise SystemExit("Current No. 1 guardrail failed.")
          england_rank = next(
              index
              for index, team in enumerate(summary["current"], start=1)
              if team["nation"] == "England"
          )
          if england_rank != 6:
              raise SystemExit(
                  f"England ranking guardrail moved to {england_rank}."
              )

          early_british = {
              "England",
              "Scotland",
              "Wales",
              "Northern Ireland",
          }
          count = sum(
              peak["nation"] in early_british
              and peak["date"] < "1914-01-01"
              for peak in summary["peaks"][:10]
          )
          if count > 1:
              raise SystemExit(
                  "Early British peak guardrail failed."
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Prove a second build is identical
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (root / "public/data/summary.json").read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          hashes = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(root / "public/data/fixtures.json"),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          Path(
              Path(__import__("os").environ["RUNNER_TEMP"])
              / "first-build-hashes.json"
          ).write_text(
              json.dumps(hashes, sort_keys=True),
              encoding="utf-8",
          )
          PY

          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          node --check public/assets/app.js
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (root / "public/data/summary.json").read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          actual = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(root / "public/data/fixtures.json"),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          expected = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "first-build-hashes.json"
              ).read_text(encoding="utf-8")
          )
          if actual != expected:
              raise SystemExit(
                  f"The second build was not deterministic.\n"
                  f"Expected: {expected}\nActual: {actual}"
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Commit and publish the verified release
        shell: bash
        run: |
          set -euo pipefail

          git add \
            README.md \
            docs/model-validation.md \
            public \
            scripts/forecast_layer.py \
            scripts/smoke_browser_boot.js \
            source/prospective_forecasts.jsonl \
            tests/test_build.py

          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "::error::The installer produced no staged changes."
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "$path" in
              README.md|docs/model-validation.md|public/*|scripts/forecast_layer.py|scripts/smoke_browser_boot.js|source/prospective_forecasts.jsonl|tests/test_build.py)
                ;;
              *)
                echo "::error file=$path::Unexpected staged path."
                exit 1
                ;;
            esac
          done

          if git diff --cached --name-only \
            | grep -q '^\.github/workflows/pages\.yml$'; then
            echo "::error::.github/workflows/pages.yml must not be changed."
            exit 1
          fi
          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"
          git diff --cached --check

          git fetch origin main
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$start_sha" ]; then
            echo "::error::main changed while the installer was validating. Nothing was pushed; rerun the installer on the new main branch."
            echo "Started at: $start_sha"
            echo "Current:    $remote_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "docs(ui): align current accuracy and expose team forecast details"
          git push origin HEAD:main

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Current accuracy and team details"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Installed and pushed the verified release."
              echo
              echo "- Landing, Methodology, FAQ, About and README now use the current 0.878333 log loss and 59.170% accuracy."
              echo "- Methodology shows one current-formula result."
              echo "- Country venue timing is explained explicitly."
              echo "- Team pages include collapsed attack and defence forecast details."
              echo "- Contextual Methodology links open the relevant section."
              echo "- The normal Pages workflow will deploy this commit."
              echo
              echo "Delete this one-use installer workflow after the Pages deployment succeeds."
            else
              echo "Installation stopped before publication. Read the failed step; the existing site remains unchanged unless the commit-and-push step succeeded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
