name: Install current accuracy and team details

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-current-accuracy-team-details-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Verify the expected starting release
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            local path="$1"
            local expected="$2"
            local actual
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Expected file is missing."
              exit 1
            fi
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::This file changed after the installer was prepared. Nothing has been modified; request a refreshed installer."
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          }

          check_file README.md \
            0d41c0649524b941066abacde7a625cab736e102416ffffa74392b7600ad8d76
          check_file docs/model-validation.md \
            427e21b3584b1cf879d57454a6a43faa0203c797cb91d59a9479c1be2b53f0a6
          check_file public/assets/app.js \
            f192126643cd7ea507e803afed3ee9128fa9f5edc16a234d2b8682daf1c323f1
          check_file public/assets/styles.css \
            d66e099c9f2c7213d13ca4d81174ea26cd5f2e9e6652027538d53fd0b3dff7cf
          check_file scripts/forecast_layer.py \
            66883bd5584b45bd8930c92b6af48b75c6f43a2b40ec120aef64b35297b6ae78
          check_file scripts/smoke_browser_boot.js \
            e137f3df2ff5f4c55a0ee3652489c8335788accfd6bb34cdc44a3f148f59eb0a
          check_file tests/test_build.py \
            afdc2a7df2c61a27475175afdae8361f0ecc60494bd1335728fc6473b9545d44
          check_file tests/test_tournament_classification.py \
            ad3de229aced26f2f6ba49be04394a52388cb5ec2c07a93efb2e94edf8b030a6
          check_file config/venue_effects.json \
            fb540d312239d7ac2322dae508991d5cbc5d46bb596a31e55a193bad6969f1e9
          check_file scripts/model.py \
            10859823a2bb7487adaa44b9da50c4a8b6f28f6762a17b4790a419f222f182b1
          check_file scripts/build_site.py \
            0284bf9dc9ee9ccae4fece07fb1fb7e09d989b125baf27f7302e37d5c7bc1f27

          git rev-parse HEAD > "$RUNNER_TEMP/start-sha"
          sha256sum .github/workflows/pages.yml \
            > "$RUNNER_TEMP/pages-before.sha256"

      - name: Install the complete replacement files
