name: Install velvet botanical ledger and fast route loading v11

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nfelo-velvet-botanical-ledger-performance-v11
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the reproducible repository runtime
        run: python -m pip install --requirement requirements.txt

      - name: Apply, audit, self-delete, publish and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          Q11_RUNTIME_SHA256: "0140c61c9449f075463cc89d61e62521b1fb903bdad8e0f55b719eee291ad921"
          Q11_PATCH_SHA256: "cd587ffa6b16e12c05df07d50b1791f36771586da5b555f1c0b388f04d4615e5"
