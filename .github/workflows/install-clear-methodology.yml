name: Install clear methodology and team pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-clear-methodology-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Verify the expected starting code
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            local path="$1"
            local expected="$2"
            local actual
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Expected file is missing."
              exit 1
            fi
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::This file has changed since the installer was prepared. Nothing has been modified; request a refreshed installer."
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          }

          check_file public/assets/app.js \
            cdc692e1a037e3cc45ea6ddedbaa3254e9515757ea7241599a3c24f9386ec080
          check_file public/assets/styles.css \
            88eebf5af54440a0ae4fa7b26007c3bbfaa9829e86044817dcada5175d351d8f
          check_file tests/test_build.py \
            3ee240caf3016e812901290bd16fe07dda8f60fdaaccfc84855d2f58ae13e7fc
          check_file tests/test_tournament_classification.py \
            a13d536168d5c820df700225fb166f0a84c5f622426ba286c81e67ffd682e53e
          check_file config/venue_effects.json \
            fb540d312239d7ac2322dae508991d5cbc5d46bb596a31e55a193bad6969f1e9
          check_file scripts/model.py \
            10859823a2bb7487adaa44b9da50c4a8b6f28f6762a17b4790a419f222f182b1
          check_file scripts/build_site.py \
            0284bf9dc9ee9ccae4fece07fb1fb7e09d989b125baf27f7302e37d5c7bc1f27

          sha256sum .github/workflows/pages.yml \
            > "$RUNNER_TEMP/pages-before.sha256"

      - name: Install the complete replacement files
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfelo-clear-copy.tar.xz"

