      - name: Record deterministic build hashes
        shell: bash
        env:
          HASH_FILE: ${{ runner.temp }}/clear-copy-build-hashes.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = (
              "public/data/state.json",
              "public/data/summary.json",
              "public/data/fixtures.json",
              "source/prospective_forecasts.jsonl",
          )

          def digest(path_text):
              path = Path(path_text)
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if path_text.endswith("summary.json"):
                      value.get("meta", {}).pop("generated_at", None)
                  payload = json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              else:
                  payload = path.read_bytes()
              return hashlib.sha256(payload).hexdigest()

          hashes = {path: digest(path) for path in paths}
          Path(os.environ["HASH_FILE"]).write_text(
              json.dumps(hashes, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(hashes, indent=2))
          PY

      - name: Prove the site rebuilds identically
        shell: bash
        env:
          HASH_FILE: ${{ runner.temp }}/clear-copy-build-hashes.json
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected = json.loads(
              Path(os.environ["HASH_FILE"]).read_text(encoding="utf-8")
          )

          def digest(path_text):
              path = Path(path_text)
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if path_text.endswith("summary.json"):
                      value.get("meta", {}).pop("generated_at", None)
                  payload = json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              else:
                  payload = path.read_bytes()
              return hashlib.sha256(payload).hexdigest()

          actual = {path: digest(path) for path in expected}
          if actual != expected:
              print("First build:", json.dumps(expected, indent=2))
              print("Second build:", json.dumps(actual, indent=2))
              raise SystemExit("The two complete builds were not identical")
          print("Repeatability check passed.")
          PY
          node --check public/assets/app.js
          python -m unittest discover \
            --start-directory tests \
            --verbose
          git diff --check
          sha256sum --check "$RUNNER_TEMP/pages-before.sha256"

      - name: Commit the verified site update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            public \
            tests/test_build.py \
            tests/test_tournament_classification.py \
            source/prospective_forecasts.jsonl

          python - <<'PY'
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines()
          allowed_exact = {
              "tests/test_build.py",
              "tests/test_tournament_classification.py",
              "source/prospective_forecasts.jsonl",
          }
          unexpected = [
              path
              for path in paths
              if path not in allowed_exact
              and not path.startswith("public/")
          ]
          if unexpected:
              raise SystemExit(
                  f"Refusing unexpected staged paths: {unexpected}"
              )
          if ".github/workflows/pages.yml" in paths:
              raise SystemExit("pages.yml must not be changed")
          print(f"Verified {len(paths)} staged site files.")
          PY

          if git diff --cached --quiet; then
            echo "::error::The verified update produced no changes."
            exit 1
          fi

          starting_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$starting_sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main changed during validation. Nothing has been pushed; run this installer again so it checks the newest source."
            exit 1
          fi

          git commit -m \
            "docs(ui): unify methodology and simplify team pages"
          git push origin HEAD:main

