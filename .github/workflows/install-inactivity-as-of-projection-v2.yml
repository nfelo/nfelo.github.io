            SIEf+XpZ/khXzFqOstnLG3OJToAvZ413p6B81Ilz7ODwvqhCer9BVBUshe9b979ONTAVB97UFtC/
            +K4mm2M6i+SHlTPk+WeWpGtjD7EPpl5kWoS1fN7UIujf2MRmg5t88tP65vELqrSGVMt8U0gubMt8
            dWsqFXTVi+eOLUwwU2vroL9DBqI+iXk8cCjPV3iqCeaoW2ZU9k9f/QPBdKIifl8AAA==
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/nfelo-inactivity-as-of-v2.patch"
          printf '%s' "$UPDATE_PATCH_GZIP_BASE64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > "$patch_file"

          if grep -q '2026-07-26-inactivity-as-of-drift' scripts/model.py && grep -q 'const projectTeamRating = (team, asOfDate)' public/assets/app.js && grep -q 'first_variance = projected_variance(' scripts/build_site.py; then
            echo "The complete inactivity projection is already installed."
          else
            git apply --check "$patch_file"
            git apply "$patch_file"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild the complete site
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run all verification
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          git diff --check

      - name: Verify the generated inactivity projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("public/data")
          summary = json.loads((data / "summary.json").read_text(encoding="utf-8"))
          state = json.loads((data / "state.json").read_text(encoding="utf-8"))

          assert summary["meta"]["methodology_version"] == (
              "2026-07-26-inactivity-as-of-drift"
          )
          assert state["as_of_date"] == summary["meta"]["results_through"]
          assert len(state["last_day"]) == len(state["codes"])

          current = summary["current"]
          assert current
          assert all(
              team["rating_date"] == summary["meta"]["results_through"]
              for team in current
          )
          assert all(
              team["last_match_date"] <= team["rating_date"]
              for team in current
          )

          stale = [
              team for team in current
              if team["last_match_date"] < team["rating_date"]
          ]
          assert stale, "Expected at least one inactive but still eligible team"
          for team in stale:
              page = json.loads(
                  (data / "teams" / f'{team["code"]}.json').read_text(
                      encoding="utf-8"
                  )
              )
              last_point = page["history"][-1]
              assert team["se"] >= last_point["se"]

          print(
              "Verified read-only inactivity projection for "
              f"{len(stale)} currently eligible teams."
          )
          PY

      - name: Commit the verified source change
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- README.md scripts/model.py scripts/build_site.py public/assets/app.js tests/test_build.py

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No source change to commit."
          else
            git commit -m "fix(model): project inactivity to every as-of date"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase safely and publish
        if: steps.commit.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Deployment note
        run: |
          echo "The push to main starts the existing Pages workflow."
          echo "No second deployment was dispatched by this installer."

