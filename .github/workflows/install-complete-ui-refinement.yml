    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository and starting files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test "$GITHUB_REF_NAME" = "main"
          cat > "$RUNNER_TEMP/nfelo-ui-before.sha256" <<'EOF'
          2f296b63af18c805209e76ad16c80620ee8b727800821cf9ad5849f6e1e2f591  README.md
          c1c75c4c1920ca0a504ad0f52a049a24a86aa72a4925dacee28816ef0be21f09  config/404.html
          36dac6f203a5e107f3228d3593dfc907d9a1c83ec78d311a4422d450659245ea  public/assets/app.js
          b80c851f98c21452c88c68ea234ebbd5a4ad4b626f93d8604290e8458eed3fc8  public/assets/styles.css
          c1f987b60430ef60bd8ed399c718a2be1c04d05f3fd154737abbeebf5b464ef4  public/index.html
          7e1c4c164d7ed87f0875db1c413b4413f8b3dea3f83c25caa1b529a61d5f408d  public/site.webmanifest
          0070a7833f9f3fb2a29aa0b8eac29f216c474d9e505669529a5dea3106634c3c  tests/test_build.py
          EOF
          sha256sum --check "$RUNNER_TEMP/nfelo-ui-before.sha256"

      - name: Decode, verify and apply the complete release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$UPDATE_PATCH" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$RUNNER_TEMP/nfelo-complete-ui.patch.xz"
          echo "d142b25be853cee0119ceae4afea024cd2b26167a6d4176aad8482e999f21d08  $RUNNER_TEMP/nfelo-complete-ui.patch.xz" \
            | sha256sum --check
          xz --test "$RUNNER_TEMP/nfelo-complete-ui.patch.xz"
          xz --decompress --stdout \
            "$RUNNER_TEMP/nfelo-complete-ui.patch.xz" \
            > "$RUNNER_TEMP/nfelo-complete-ui.patch"
          git apply --check "$RUNNER_TEMP/nfelo-complete-ui.patch"
          git apply --whitespace=error "$RUNNER_TEMP/nfelo-complete-ui.patch"
          cat > "$RUNNER_TEMP/nfelo-ui-after.sha256" <<'EOF'
          eb2573747ebb25b83615dd5a0b43aefa0767a40614ca923623b243b46af7f4b3  README.md
          8f8891c1ffee76d0fd868e1e9db4038ba0d989af9a4c677ebedfd2b59fac8948  config/404.html
          be2f8ec8bc12a9eae4a5cdfb17bf3b1bc6cfeee9379b29fd12f3e803975d7295  public/assets/app.js
          6be8afb7b626f83467db871ff1c5c8aa8106ab61104c111150b5f218fa428919  public/assets/styles.css
          caf7cc7eb55e01c9c9b41d665e4079beef87180bf9eb9eb018e419b34fd1fa4c  public/index.html
          e1e0202bf271cd275e2804df073bdb7da5719ae5e9f2315b5e7a7a34dfa25582  public/site.webmanifest
          4fa1ff0bc83b8ffe4fe3705a0175bbfe5468a092295c384930edf803cca420dd  tests/test_build.py
          EOF
          sha256sum --check "$RUNNER_TEMP/nfelo-ui-after.sha256"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Build, test and audit the release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js
          python scripts/audit_site_consistency.py \
            --public public
          git diff --check

      - name: Prove the generated release is deterministic
        shell: bash
        run: |
          set -euo pipefail
          canonical_fingerprint() {
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("public")
          digest = hashlib.sha256()

          def without_build_time(value):
              if isinstance(value, dict):
                  return {
                      key: without_build_time(item)
                      for key, item in sorted(value.items())
                      if key != "generated_at"
                  }
              if isinstance(value, list):
                  return [without_build_time(item) for item in value]
              return value

          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              relative = path.relative_to(root).as_posix()
              if relative == "build-manifest.json":
                  # Its file hashes include the intentionally timestamped
                  # summary, so verify the underlying files instead.
                  continue
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  payload = json.dumps(
                      without_build_time(value),
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              else:
                  payload = path.read_bytes()
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(payload)
              digest.update(b"\0")
          print(digest.hexdigest())
          PY
          }
          first_fingerprint="$(canonical_fingerprint)"
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          second_fingerprint="$(canonical_fingerprint)"
          echo "First canonical fingerprint:  $first_fingerprint"
          echo "Second canonical fingerprint: $second_fingerprint"
          test "$first_fingerprint" = "$second_fingerprint"
          node --check public/assets/app.js
          python scripts/audit_site_consistency.py \
            --public public
          git diff --check

      - name: Verify the final change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only \
            > "$RUNNER_TEMP/nfelo-ui-changed-paths.txt"
          while IFS= read -r path; do
            case "$path" in
              README.md|config/404.html|public/index.html|public/site.webmanifest|public/assets/app.js|public/assets/styles.css|tests/test_build.py|public/*/index.html|public/team/*/index.html)
                ;;
              *)
                echo "::error::Unexpected changed path: $path"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/nfelo-ui-changed-paths.txt"
          git diff --exit-code -- \
            scripts/model.py \
            scripts/forecast_layer.py \
            config/model.json \
            source

      - name: Commit the validated release and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/install-complete-ui-refinement.yml
          git add -- \
            README.md \
            config/404.html \
            public \
            tests/test_build.py
          git diff --cached --check
          git commit -m \
            "Refine navigation and responsive interface"
          if ! git push origin HEAD:main; then
            echo "Main moved during validation; rebasing once."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write release summary
        if: success()
        run: |
          {
            echo "## Complete UI refinement installed"
            echo
            echo "- Grouped, keyboard-accessible navigation"
            echo "- Full-data ranking cards for tablet and mobile"
            echo "- Expandable advanced Predict tables"
            echo "- Clearer public terminology"
            echo "- Contrast-tested pink/lavender theme and softer display type"
            echo "- 84 tests, browser boot, consistency audit and two-build determinism check"
            echo
            echo "The push starts the normal Pages deployment automatically."
          } >> "$GITHUB_STEP_SUMMARY"
