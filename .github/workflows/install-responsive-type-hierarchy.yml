name: Install responsive type hierarchy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-responsive-type-hierarchy
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the latest model patch and install the UI release
        run: |
          python - <<'PY'
          from pathlib import Path


          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")


          def require(path: str, markers: tuple[str, ...]) -> None:
              content = read(path)
              missing = [marker for marker in markers if marker not in content]
              if missing:
                  raise SystemExit(
                      f"{path} is not the expected current release; "
                      f"missing {missing}"
                  )


          require(
              "scripts/model.py",
              (
                  "def projected_variance(",
                  "def projected_public_record(",
                  '"2026-07-26-inactivity-as-of-drift"',
                  '"last_day": self.last_day.tolist()',
                  '"as_of_date": last_match.date_text',
              ),
          )
          require(
              "scripts/build_site.py",
              (
                  "first_variance = projected_variance(",
                  "second_variance = projected_variance(",
                  "point = projected_public_record(",
              ),
          )
          require(
              "public/assets/app.js",
              (
                  "const projectTeamRating = (team, asOfDate)",
                  ".map((team) => projectTeamRating(team, chosen))",
                  "summary.current.map((team) => projectTeamRating(team, dateValue))",
              ),
          )
          require(
              "tests/test_build.py",
              (
                  "def test_inactivity_is_projected_without_rewriting_matchdays",
                  "def test_final_ui_and_consistency_contract",
                  "def test_multi_team_comparison_includes_historical_teams",
              ),
          )
          require(
              ".github/workflows/pages.yml",
              (
                  "python scripts/build_site.py --source source --config config --output public",
                  "python -m unittest discover --start-directory tests --verbose",
                  "node --check public/assets/app.js",
              ),
          )

          style_path = Path("public/assets/styles.css")
          styles = read(str(style_path))
          style_marker = "/* Primary-name hierarchy */"
          style_block = """/* Primary-name hierarchy */
          .comparison-team-row select,
          .comparison-add-panel select {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: normal;
            line-height: 1.25;
            text-transform: none;
          }

          .team-picker select,
          .comparison-pair-picker select {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.25;
          }

          .comparison-team-name {
            font-size: 16px;
            line-height: 1.35;
          }

          .comparison-meetings td[data-label="Match"] {
            font-size: 16px;
            line-height: 1.4;
          }

          .bar-row a {
            font-size: 15px;
            line-height: 1.25;
          }

          .chart-inspector-value b {
            font-size: 14px;
          }

          .home-explore-links b {
            font-size: 16px;
            line-height: 1.25;
          }

          @media (min-width: 721px) {
            .table-shell .team-link {
              font-size: 16px;
              line-height: 1.35;
            }
          }

          @media (max-width: 720px) {
            .team-picker select,
            .comparison-pair-picker select {
              font-size: 16px;
            }

            .comparison-team-name {
              font-size: 17px;
            }
          }"""

          if style_marker in styles:
              if style_block not in styles:
                  raise SystemExit(
                      "A different primary-name hierarchy block already exists; "
                      "refusing to combine competing typography rules."
                  )
          else:
              style_path.write_text(
                  styles.rstrip() + "\n\n" + style_block + "\n",
                  encoding="utf-8",
              )

          test_path = Path("tests/test_build.py")
          tests = read(str(test_path))
          test_name = "def test_primary_names_have_responsive_type_hierarchy"
          test_anchor = (
              "    def test_browser_application_replaces_initial_loading_shell"
          )
          test_method = '''    def test_primary_names_have_responsive_type_hierarchy(self) -> None:
                  stylesheet = (
                      ROOT / "public" / "assets" / "styles.css"
                  ).read_text(encoding="utf-8")

                  self.assertIn("/* Primary-name hierarchy */", stylesheet)
                  for selector in (
                      ".comparison-team-row select",
                      ".comparison-add-panel select",
                      ".team-picker select",
                      ".comparison-pair-picker select",
                      ".comparison-team-name",
                      '.comparison-meetings td[data-label="Match"]',
                      ".bar-row a",
                      ".chart-inspector-value b",
                      ".home-explore-links b",
                      ".table-shell .team-link",
                  ):
                      self.assertIn(selector, stylesheet)

                  primary_block = stylesheet.split(
                      "/* Primary-name hierarchy */",
                      1,
                  )[1]
                  self.assertIn("font-size: 17px;", primary_block)
                  self.assertIn("font-size: 16px;", primary_block)
                  self.assertIn("font-size: 15px;", primary_block)
                  self.assertIn("text-transform: none;", primary_block)
                  self.assertIn("@media (min-width: 721px)", primary_block)
                  self.assertIn("@media (max-width: 720px)", primary_block)

          '''

          if test_name not in tests:
              if tests.count(test_anchor) != 1:
                  raise SystemExit(
                      "Could not find the unique test insertion point."
                  )
              tests = tests.replace(test_anchor, test_method + test_anchor, 1)
              test_path.write_text(tests, encoding="utf-8")

          print("Responsive typography release is installed in the worktree.")
          PY

      - name: Confirm the edit is strictly UI and test only
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "The release is already installed; validation will still run."
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              public/assets/styles.css|tests/test_build.py) ;;
              *)
                echo "::error::Unexpected changed file: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"
          sha256sum \
            scripts/model.py \
            scripts/build_site.py \
            public/assets/app.js \
            README.md \
            .github/workflows/pages.yml \
            > /tmp/nfelo-protected-files.sha256

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild the complete site
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run every model, consistency, UI and browser test
        run: |
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          sha256sum --check /tmp/nfelo-protected-files.sha256

      - name: Commit and publish the validated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/styles.css tests/test_build.py
          if git diff --cached --quiet; then
            echo "Nothing to commit; the release was already installed."
            git restore --worktree -- .
            exit 0
          fi
          git commit -m "style(ui): improve primary-name readability"
          git restore --worktree -- .
          git pull --rebase origin main
          git push origin HEAD:main
