    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify repository and installation baseline
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --short)"

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "config/404.html": "c911b9ad1caff9e8157141cde6c48ff5cd5d1b44d5c81628ce122f74a4293e9e",
              "public/assets/app.js": "be2f8ec8bc12a9eae4a5cdfb17bf3b1bc6cfeee9379b29fd12f3e803975d7295",
              "public/assets/styles.css": "86574473265574b95d676bf5454c5736f3ffc5f80831c7c7a3f0a624608b549a",
              "public/index.html": "59916e932185cb51460cffac6137054ebd3470bf3d840cff7131b1574d482819",
              "public/site.webmanifest": "83b206454f276b1bc8247a06fe7f1a6bf9ada046213957bb6e6761804e3caf55",
              "scripts/build_site.py": "0284bf9dc9ee9ccae4fece07fb1fb7e09d989b125baf27f7302e37d5c7bc1f27",
              "scripts/smoke_browser_boot.js": "0dbf874d5fe6625a15a3cb976cfe7a5dfc298b7719119c0e29b911cbfb9de6e5",
              "tests/test_build.py": "aae4df24d2cf4467e10b4c798814a6812c3a67a3fb0e7cc00866af10ff2c0aef",
              "tests/test_presentation.py": "21a9665c539d35945ee445fed4eb309ac3443533d3ec9f40b1a5e10f2549476d",
          }

          failures = []
          for filename, wanted in expected.items():
              path = Path(filename)
              actual = sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != wanted:
                  failures.append(f"{filename}: expected {wanted}, found {actual}")

          if failures:
              print("::error::The site changed after this installer was prepared. No files were changed.")
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"Verified {len(expected)} baseline files.")
          PY

      - name: Decode and inspect the audited release
        shell: bash
        run: |
          set -euo pipefail

          release="$RUNNER_TEMP/nfelo-chronology-navigation-brand-release.tar.xz"
          printf '%s' "$UPDATE_ARCHIVE" | tr -d '[:space:]' | base64 --decode > "$release"
          echo "$UPDATE_ARCHIVE_SHA256  $release" | sha256sum --check
          xz --test "$release"

          RELEASE="$release" python - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              "config/404.html",
              "public/assets/app.js",
              "public/assets/styles.css",
              "public/index.html",
              "public/site.webmanifest",
              "scripts/build_site.py",
              "scripts/smoke_browser_boot.js",
              "tests/test_build.py",
              "tests/test_presentation.py",
          }

          with tarfile.open(os.environ["RELEASE"], "r:xz") as archive:
              members = archive.getmembers()
              actual = {member.name for member in members}
              unsafe = [
                  member.name
                  for member in members
                  if not member.isfile()
                  or PurePosixPath(member.name).is_absolute()
                  or ".." in PurePosixPath(member.name).parts
              ]

          if actual != expected or unsafe:
              print(f"::error::Unexpected release contents: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}, unsafe={unsafe}")
              raise SystemExit(1)

          print(f"Release contains exactly {len(expected)} safe files.")
          PY

      - name: Install the release files
        shell: bash
        run: |
          set -euo pipefail

          release="$RUNNER_TEMP/nfelo-chronology-navigation-brand-release.tar.xz"
          tar --extract --xz --file "$release" --directory .

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "config/404.html": "28c2d269dac61d67add545604b94f2d83f3e06a864ae90cbd13cbee49ae9638b",
              "public/assets/app.js": "453f32d324f811da5b66ea4ec29e54aad57c4fa70668a5ec82990f63bc2969cb",
              "public/assets/styles.css": "6e1e925998a72489c12ec09c07ee34d05de0c3cf01fd7e4b5630d5f4e1389ab8",
              "public/index.html": "19a04a5f4ffe3f26cf705ae52cd2c1cddc0ea79cc9a0b7f6558888f1a047e740",
              "public/site.webmanifest": "8528e35effc9f1f3d1027a66852836b950069aa90786a5bb870eedf19cf30d69",
              "scripts/build_site.py": "423bbdd33f0c71811c896ba626e9d946821d77dafb458d5e307141dd62dc48ec",
              "scripts/smoke_browser_boot.js": "01f5ccb606ef5dda164e1c4985a1f62b6962ba91452dcf51e9596b7372d4f301",
              "tests/test_build.py": "405adc1287cdb559215f6cf8bc9d5858fbc5c7b21c6d88ac7ac705e3978a190e",
              "tests/test_presentation.py": "41c36a9ce371b7ef2fea13f8f7ed18ce972b6b94cabe177866fbb341c9671e66",
          }

          for filename, wanted in expected.items():
              actual = sha256(Path(filename).read_bytes()).hexdigest()
              if actual != wanted:
                  print(f"::error::{filename}: expected installed hash {wanted}, found {actual}")
                  raise SystemExit(1)

          print(f"Verified {len(expected)} installed files.")
          PY

          expected_changes="$RUNNER_TEMP/expected-initial-changes.txt"
          cat > "$expected_changes" <<'EOF'
          config/404.html
          public/assets/app.js
          public/assets/styles.css
          public/index.html
          public/site.webmanifest
          scripts/build_site.py
          scripts/smoke_browser_boot.js
          tests/test_build.py
          tests/test_presentation.py
          EOF
          git diff --name-only | sort > "$RUNNER_TEMP/actual-initial-changes.txt"
          diff -u "$expected_changes" "$RUNNER_TEMP/actual-initial-changes.txt"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild the complete static site
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run the full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          node --check scripts/smoke_browser_boot.js
          node scripts/smoke_browser_boot.js public
          git diff --check

      - name: Audit chronology, navigation, branding and release boundary
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import subprocess
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path

          summary = json.loads(Path("public/data/summary.json").read_text(encoding="utf-8"))
          spells = summary["number_ones"]
          if not spells:
              raise AssertionError("The No. 1 chronology is empty.")

          causes = Counter(spell.get("cause") for spell in spells)
          allowed_causes = {
              "direct-incoming",
              "direct-outgoing",
              "network",
              "drift",
              "name",
              "initial",
          }
          if set(causes) - allowed_causes:
              raise AssertionError(f"Unexpected chronology causes: {sorted(set(causes) - allowed_causes)}")
          if not causes["network"] or not causes["drift"]:
              raise AssertionError(f"Indirect chronology cases were not classified: {causes}")

          unrelated = []
          for spell in spells:
              incoming = spell["code"]
              outgoing = spell.get("displaced_code")
              matches = spell.get("matches") or []
              cause = spell.get("cause")
              for match in matches:
                  participants = {match["team1_code"], match["team2_code"]}
                  if incoming not in participants and outgoing not in participants:
                      unrelated.append((spell["from"], incoming, outgoing, match["id"]))

              if cause in {"network", "drift"}:
                  if matches:
                      raise AssertionError(f"{cause} spell on {spell['from']} contains a displayed match.")
                  if not spell.get("reason", "").startswith("No direct match:"):
                      raise AssertionError(f"{cause} spell on {spell['from']} lacks a clear explanation.")

          if unrelated:
              raise AssertionError(f"Unrelated chronology matches remain: {unrelated[:10]}")

          app = Path("public/assets/app.js").read_text(encoding="utf-8")
          required_navigation_tokens = {
              "routeHistoryState",
              "navigateToInternalRoute",
              'window.addEventListener("popstate"',
              'history.scrollRestoration = "manual"',
          }
          missing_navigation = sorted(token for token in required_navigation_tokens if token not in app)
          if missing_navigation:
              raise AssertionError(f"Navigation implementation is incomplete: {missing_navigation}")

          css = Path("public/assets/styles.css").read_bytes()
          js = Path("public/assets/app.js").read_bytes()
          css_version = sha256(css).hexdigest()[:12]
          js_version = sha256(js).hexdigest()[:12]
          routes = sorted(Path("public").glob("**/index.html"))
          if len(routes) < 250:
              raise AssertionError(f"Expected at least 250 generated routes, found {len(routes)}.")

          for route in routes:
              html = route.read_text(encoding="utf-8")
              problems = []
              if 'class="brand-mark" src="favicon-2026.svg?v=20260728"' not in html:
                  problems.append("unified header logo")
              if '<span class="brand-mark"' in html:
                  problems.append("obsolete CSS logo")
              if f"assets/styles.css?v={css_version}" not in html:
                  problems.append("current stylesheet hash")
              if f"assets/app.js?v={js_version}" not in html:
                  problems.append("current script hash")
              if "favicon-2026.svg?v=20260728" not in html:
                  problems.append("versioned favicon")
              if problems:
                  raise AssertionError(f"{route}: missing {', '.join(problems)}")

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          route_names = {route.as_posix() for route in routes}
          expected_non_routes = {
              "config/404.html",
              "public/assets/app.js",
              "public/assets/styles.css",
              "public/site.webmanifest",
              "scripts/build_site.py",
              "scripts/smoke_browser_boot.js",
              "tests/test_build.py",
              "tests/test_presentation.py",
          }
          expected_changes = route_names | expected_non_routes
          if changed != expected_changes:
              raise AssertionError(
                  "Unexpected final change boundary: "
                  f"missing={sorted(expected_changes - changed)}, "
                  f"extra={sorted(changed - expected_changes)}"
              )

          protected_prefixes = ("source/", "docs/", "research/")
          protected_files = {
              "README.md",
              "config/elo_matches.json",
              "config/forecast_layer.json",
              "config/tournament_classification.json",
              "config/venue_effects.json",
              "public/favicon-2026.svg",
              "public/favicon.ico",
              "public/apple-touch-icon.png",
              "public/icon-192.png",
              "public/icon-512.png",
              "public/social-card.png",
          }
          protected_changes = sorted(
              filename
              for filename in changed
              if filename in protected_files or filename.startswith(protected_prefixes)
          )
          if protected_changes:
              raise AssertionError(f"Protected model, content or image files changed: {protected_changes}")

          print(f"Chronology spells: {len(spells)}; causes: {dict(causes)}")
          print("Unrelated displayed chronology matches: 0")
          print(f"Generated routes checked: {len(routes)}")
          print(f"Final files changed: {len(changed)}")
          PY

      - name: Commit and publish the audited release
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- config public scripts tests
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes were available to commit."
            exit 1
          fi

          git commit -m "Fix chronology causes, navigation and brand consistency"
          git push origin HEAD:main

      - name: Installation summary
        if: success()
        run: |
          {
            echo "## NFELO site repair installed"
            echo
            echo "- No. 1 chronology entries now show only a match involving the incoming or displaced leader."
            echo "- Network-effect and decay-only changes now show a truthful explanation instead of unrelated matches."
            echo "- Internal navigation opens new pages at the top and Back restores the previous route and scroll position."
            echo "- The visible header logo now uses the same artwork as the browser, Apple and Android icons."
            echo "- Dainty rose and lavender presentation details were refined without changing content or model values."
            echo "- The full build, 90-test suite, JavaScript checks, route audit and change-boundary audit passed before publication."
            echo
            echo "The push to main has triggered the normal Pages deployment."
          } >> "$GITHUB_STEP_SUMMARY"
