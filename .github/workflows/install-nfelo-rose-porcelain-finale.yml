name: Install NFELO rose porcelain finale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-nfelo-rose-porcelain-finale
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check compatibility
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "nfelo/nfelo.github.io" ]]; then
            echo "::error::This installer is only for nfelo/nfelo.github.io."
            exit 1
          fi

          needs_apply=0
          check_file() {
            local path="$1"
            local old_blob="$2"
            local new_blob="$3"
            local actual

            if [[ ! -f "$path" ]]; then
              echo "::error::$path is missing."
              exit 1
            fi
            actual="$(git hash-object "$path")"
            if [[ "$actual" == "$new_blob" ]]; then
              return
            fi
            if [[ "$actual" == "$old_blob" ]]; then
              needs_apply=1
              return
            fi
            echo "::error::$path has unexpected contents ($actual)."
            echo "The installer stopped rather than overwriting a newer edit."
            exit 1
          }

          check_file README.md \
            5f75f467d4b192e4e834b8aec961fe7b69f1796a \
            c738f015821f3ab4cbb26d7634c4bef09297d27e
