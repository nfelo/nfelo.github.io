      - name: Render browser, Apple, Android and sharing artwork
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          render_dir="$(mktemp -d)"
          npm install \
            --prefix "$render_dir" \
            --no-audit \
            --no-fund \
            --no-package-lock \
            sharp@0.34.5

          RENDER_DIR="$render_dir" node <<'JS'
          const path = require("node:path");
          const sharp = require(
            path.join(process.env.RENDER_DIR, "node_modules", "sharp")
          );

          async function render() {
            const palette = {
              compressionLevel: 9,
              palette: true,
              quality: 95,
            };

            await sharp("public/favicon-2026.svg")
              .resize(180, 180)
              .png(palette)
              .toFile("public/apple-touch-icon-2026.png");

            for (const size of [192, 512]) {
              await sharp("public/icon-maskable-2026.svg")
                .resize(size, size)
                .png(palette)
                .toFile(`public/icon-${size}-2026.png`);
            }

            await sharp("public/social-card.svg")
              .resize(1200, 630)
              .png({ compressionLevel: 9 })
              .toFile("public/social-card.png");

            for (const size of [16, 32, 48]) {
              await sharp("public/favicon-2026.svg")
                .resize(size, size)
                .png(palette)
                .toFile(`/tmp/nfelo-finale-${size}.png`);
            }
          }

          render().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          python - <<'PY'
          from pathlib import Path
          import struct

          sizes = (16, 32, 48)
          frames = [
              Path(f"/tmp/nfelo-finale-{size}.png").read_bytes()
              for size in sizes
          ]
          offset = 6 + 16 * len(frames)
          entries = []
          for size, frame in zip(sizes, frames):
              entries.append(
                  struct.pack(
                      "<BBBBHHII",
                      size,
                      size,
                      0,
                      0,
                      1,
                      32,
                      len(frame),
                      offset,
                  )
              )
              offset += len(frame)
          payload = (
              struct.pack("<HHH", 0, 1, len(frames))
              + b"".join(entries)
              + b"".join(frames)
          )
          Path("public/favicon-2026.ico").write_bytes(payload)
          Path("public/favicon.ico").write_bytes(payload)
          PY

          sha256sum --check --strict <<'SHAS'
          d46cbcd87b6de729739391a931f2b7cb29f19dff31511af72cbcea23587429da  public/apple-touch-icon-2026.png
          83b2fbe3fc4cf36b80a4aebfd3923121927bb072241facab86d18fcba118c708  public/icon-192-2026.png
          aea5fb0a8372c0c17caef155b26a59aef79d16e22230fb7e1a4b0487477b3935  public/icon-512-2026.png
          5d7366cd652c38b2faeb3d81f0fb369740235790e7723a329eddd3419c81cf15  public/favicon-2026.ico
          5d7366cd652c38b2faeb3d81f0fb369740235790e7723a329eddd3419c81cf15  public/favicon.ico
          7f4f7d806903c25356eb9c4d068c02724f0a09f253803b9e1d38cb54d4ad10dc  public/social-card.png
          SHAS

      - name: Rebuild every static route
        if: steps.compatibility.outputs.apply == 'true'
        run: python scripts/build_site.py --source source --config config --output public

      - name: Verify application, accessibility and presentation
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          python scripts/audit_site_consistency.py --public public
          npx --yes csstree-validator@4.0.1 public/assets/styles.css
          git diff --check

          if ! git diff --quiet -- \
            source \
            scripts \
            requirements.txt \
            config/elo_matches.json \
            config/forecast_layer.json \
            config/source_slugs.txt \
            config/tournament_classification.json \
            config/tournament_evidence.example.json \
            config/venue_effects.json; then
            echo "::error::A model, source-data or build-logic file changed."
            git diff --name-only -- \
              source \
              scripts \
              requirements.txt \
              config/elo_matches.json \
              config/forecast_layer.json \
              config/source_slugs.txt \
              config/tournament_classification.json \
              config/tournament_evidence.example.json \
              config/venue_effects.json
            exit 1
          fi

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re

          public = Path("public")
          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise SystemExit(f"Only {len(routes)} generated routes were found")

          css_hash = hashlib.sha256(
              (public / "assets" / "styles.css").read_bytes()
          ).hexdigest()[:12]
          required = (
              'content="#4a183f"',
              'content="#170b14"',
              "favicon-2026.svg?v=20260728f3",
              "apple-touch-icon-2026.png?v=20260728f3",
              "social-card.png?v=20260728f3",
              f"assets/styles.css?v={css_hash}",
              'href="#/rankings">Rankings</a>',
              'href="#/fixtures">Upcoming matches</a>',
              'href="#/predict">Predict</a>',
              'href="#/history">History</a>',
              'href="#/tournaments">Tournaments</a>',
              'href="#/matches">Matches</a>',
              'href="#/compare">Compare</a>',
              'href="#/records">Records</a>',
              'href="#/methodology">Methodology</a>',
              'href="#/faq">FAQ</a>',
              'href="#/about">About</a>',
          )
          for route in routes:
              html = route.read_text(encoding="utf-8")
              missing = [marker for marker in required if marker not in html]
              if missing:
                  raise SystemExit(f"{route} is missing {missing}")
              if "20260728f2" in html:
                  raise SystemExit(f"{route} still uses the previous artwork")

          css = (public / "assets" / "styles.css").read_text(
              encoding="utf-8"
          )
          app = (public / "assets" / "app.js").read_text(encoding="utf-8")
          for marker in (
              "Rose-porcelain finale.",
              "--porcelain-rose: #fff6fb;",
              "--black-cherry: #1b0d17;",
              ".home-action-rankings",
              ".home-action-fixtures",
              ".home-action-predict",
              ".score-profile-highlights",
              "1. A Ladurée-like aquarelle wash",
              "10. Footer links are joined by alternating seed-pearl markers",
              "@media (prefers-color-scheme: dark)",
              "@media (min-width: 721px) and (max-width: 1024px)",
              "@media (max-width: 720px)",
          ):
              if marker not in css:
                  raise SystemExit(f"Final stylesheet is missing {marker!r}")
          if "--result-win:" in css.split("Rose-porcelain finale.", 1)[1]:
              raise SystemExit("The final layer changed the win colour")
          if "--result-loss:" in css.split("Rose-porcelain finale.", 1)[1]:
              raise SystemExit("The final layer changed the loss colour")

          for marker in (
              'class="venue-profile score-profile"',
              'id="score-profile-title"',
              'class="venue-profile-details score-profile-details"',
              "gradually move towards neutral",
          ):
              if marker not in app:
                  raise SystemExit(f"Team panel is missing {marker!r}")

          prose = "\n".join(
              (
                  app,
                  Path("README.md").read_text(encoding="utf-8"),
                  Path(
                      "docs/methodology-audit-2026-07-19.md"
                  ).read_text(encoding="utf-8"),
                  Path("docs/model-validation.md").read_text(
                      encoding="utf-8"
                  ),
              )
          )
          for phrase in (
              " move toward ",
              " moves toward ",
              " revert toward ",
              " decays toward ",
              " fades toward ",
              "static artifact",
              "## License",
          ):
              if phrase in prose:
                  raise SystemExit(f"American spelling remains: {phrase!r}")
          if re.search(r"\bresearch programs?\b", prose):
              raise SystemExit("American research-program spelling remains")

          manifest = json.loads(
              (public / "site.webmanifest").read_text(encoding="utf-8")
          )
          if manifest["background_color"] != "#fff6fb":
              raise SystemExit("Manifest background colour is out of date")
          if manifest["theme_color"] != "#4a183f":
              raise SystemExit("Manifest theme colour is out of date")

          def png_dimensions(path: Path) -> tuple[int, int]:
              payload = path.read_bytes()
              if payload[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path} is not a PNG")
              return (
                  int.from_bytes(payload[16:20], "big"),
                  int.from_bytes(payload[20:24], "big"),
              )

          expected_dimensions = {
              "apple-touch-icon-2026.png": (180, 180),
              "icon-192-2026.png": (192, 192),
              "icon-512-2026.png": (512, 512),
              "social-card.png": (1200, 630),
          }
          for name, dimensions in expected_dimensions.items():
              actual = png_dimensions(public / name)
              if actual != dimensions:
                  raise SystemExit(
                      f"{name}: expected {dimensions}, found {actual}"
                  )

          print(
              f"Verified {len(routes)} generated routes, complete footer, "
              "responsive themes, British English and every artwork surface."
          )
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.compatibility.outputs.apply }}" == "true" ]]; then
            git add -- \
              README.md \
              config/404.html \
              docs/methodology-audit-2026-07-19.md \
              docs/model-validation.md \
              public \
              tests/test_build.py \
              tests/test_presentation.py
          fi

          git rm --ignore-unmatch \
            .github/workflows/install-nfelo-rose-porcelain-finale.yml

          if git diff --cached --quiet; then
            echo "Nothing remains to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete NFELO rose porcelain presentation"
          git push origin HEAD:main
