            e4cac8269875518fbddce4e3ca21be39cfc34c87 \
            a486c9eb211288d2b33226f889d24b4037ad72e1

          if [[ "$needs_apply" -eq 0 ]]; then
            echo "The rose porcelain finale is already installed."
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: steps.compatibility.outputs.apply == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

