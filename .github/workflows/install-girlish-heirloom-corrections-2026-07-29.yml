name: Install girlish heirloom corrections

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-girlish-heirloom-corrections
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the audited baseline and lock the logo
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "dea38435b0ad7d7aa3e7e1ddb5466fe2af3a1693f1920a4945d068cbef23f07f"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "a794d697aa56974775cd1acc9b31bd0ce930540e9799d7abe119979d2466439b"
          grep -Fq \
            "Editorial keepsake corrective finishing system." \
            public/assets/styles.css
          test \
            "$(grep -Fc "Girlish heirloom corrective finish." \
              public/assets/styles.css || true)" \
            -eq 0

          route_count="$(find public -type f -name index.html | wc -l)"
          test "$route_count" -eq 260

          sha256sum --check <<'SHA256'
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon-2026.svg
