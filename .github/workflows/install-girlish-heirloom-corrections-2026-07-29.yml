            "e12729ddf5985eb6aa2ec94597a74f10169363d03ddc21f067b48e9d5bdbb335  $archive" \
            | sha256sum --check

          actual_files="$(tar -tJf "$archive" | LC_ALL=C sort)"
          expected_files="$(
            printf '%s\n' \
              girlish-heirloom.css \
              install_release.py \
              test_girlish_heirloom.py
          )"
          test "$actual_files" = "$expected_files"

          tar -xJf "$archive" -C "$release_dir"
          python "$release_dir/install_release.py" \
            --repo "$GITHUB_WORKSPACE" \
            --payload "$release_dir"

      - name: Verify layout, accessibility and browser contracts
        shell: bash
        run: |
          set -euo pipefail

          python tests/test_girlish_heirloom.py -v
          python tests/test_editorial_keepsake.py -v
          python tests/test_ribbon_atelier.py -v
          python tests/test_presentation.py -v
          python tests/test_luminous_fairytale_redesign.py -v
          python tests/test_couture_alphabet.py -v
          python tests/test_actual_final_presentation.py -v
          node --check public/assets/app.js
          node scripts/smoke_browser_boot.js public
          git diff --check

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "fe826fe66b208cd1e2a5823473a8de66c71de611011f2a43ea452f0fe75fe820"

          sha256sum --check <<'SHA256'
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon-2026.svg
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon.svg
          0f0bc225dd59f4b5b840b660f20149c61c39536546452acfd807be57807e61d7  public/favicon-2026.ico
          0f0bc225dd59f4b5b840b660f20149c61c39536546452acfd807be57807e61d7  public/favicon.ico
