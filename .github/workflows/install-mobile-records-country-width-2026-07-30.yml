name: Install mobile Records country width

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-mobile-records-country-width-2026-07-30
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm the audited stylesheet
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          css_path = Path("public/assets/styles.css")
          wanted = "2779e0b8d88a5bdbd6b3de7259a384e440a67401"
          if not css_path.is_file():
              raise SystemExit(f"Required file is missing: {css_path}")
          actual = subprocess.check_output(
              ["git", "hash-object", str(css_path)],
              text=True,
          ).strip()
          if actual != wanted:
              raise SystemExit(
                  "public/assets/styles.css has changed since this "
                  f"mobile-only fix was audited ({actual} != {wanted})."
              )

          test_path = Path(
              "tests/test_mobile_records_country_width.py"
          )
          if test_path.exists():
              raise SystemExit(
                  "The mobile Records country-width test already exists."
              )
          PY

      - name: Install the mobile-only country width
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import textwrap
          from pathlib import Path

          public = Path("public")
          css_path = public / "assets" / "styles.css"
          test_path = Path(
              "tests/test_mobile_records_country_width.py"
          )
          marker = "Mobile Records country width 2026-07-30."

          css = css_path.read_text(encoding="utf-8")
          if marker in css:
              raise SystemExit(
                  "The mobile Records country-width fix is already "
                  "installed."
              )

          layer = r'''

          /*
           * Mobile Records country width 2026-07-30.
           *
           * Country links stay intact on phones and every Records cell
           * containing one receives a readable width. Tournament links,
           * desktop tables and all non-Records routes remain unchanged.
           */
          @media (max-width: 720px) {
            body[data-route="records"] #record-table
            td:has(a.team-link[href^="#/team/"]) {
              min-inline-size: 13rem;
            }

            body[data-route="records"] #record-table
            a.team-link[href^="#/team/"] {
              display: inline-block;
              max-inline-size: none;
              white-space: nowrap;
              overflow-wrap: normal;
              word-break: normal;
              hyphens: none;
            }
          }
          '''
          css_path.write_text(
              css.rstrip() + "\n" + textwrap.dedent(layer).lstrip(),
              encoding="utf-8",
          )

          test_source = r'''
          from __future__ import annotations

          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          CSS_PATH = ROOT / "public" / "assets" / "styles.css"
          MARKER = "Mobile Records country width 2026-07-30."


          class MobileRecordsCountryWidthTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.css = CSS_PATH.read_text(encoding="utf-8")
                  if MARKER not in cls.css:
                      raise AssertionError(
                          "Mobile Records country-width marker missing."
                      )
                  cls.finish = cls.css.split(MARKER, 1)[1]

              def test_layer_is_unique_last_and_balanced(self) -> None:
                  self.assertEqual(self.css.count(MARKER), 1)
                  self.assertIn(
                      "Balanced interface unification 2026-07-30.",
                      self.css,
                  )
                  self.assertGreater(
                      self.css.index(MARKER),
                      self.css.index(
                          "Balanced interface unification 2026-07-30."
                      ),
                  )
                  depth = 0
                  for character in self.css:
                      if character == "{":
                          depth += 1
                      elif character == "}":
                          depth -= 1
                      self.assertGreaterEqual(depth, 0)
                  self.assertEqual(depth, 0)
                  self.assertTrue(self.css.rstrip().endswith("}"))

              def test_fix_is_mobile_and_records_only(self) -> None:
                  for expected in (
                      "@media (max-width: 720px)",
                      'body[data-route="records"] #record-table',
                      'a.team-link[href^="#/team/"]',
                  ):
                      self.assertIn(expected, self.finish)
                  self.assertEqual(self.finish.count("@media"), 1)
                  self.assertNotIn(
                      'body[data-route="rankings"]',
                      self.finish,
                  )
                  self.assertNotIn(
                      'body[data-route="tournaments"]',
                      self.finish,
                  )

              def test_country_cells_have_a_readable_floor(self) -> None:
                  for expected in (
                      'td:has(a.team-link[href^="#/team/"])',
                      "min-inline-size: 13rem;",
                  ):
                      self.assertIn(expected, self.finish)

              def test_country_names_do_not_split(self) -> None:
                  for expected in (
                      "display: inline-block;",
                      "max-inline-size: none;",
                      "white-space: nowrap;",
                      "overflow-wrap: normal;",
                      "word-break: normal;",
                      "hyphens: none;",
                  ):
                      self.assertIn(expected, self.finish)


          if __name__ == "__main__":
              unittest.main()
          '''
          test_path.write_text(
              textwrap.dedent(test_source).lstrip(),
              encoding="utf-8",
          )

          revision = hashlib.sha256(
              css_path.read_bytes()
          ).hexdigest()[:12]
          html_paths = sorted(public.rglob("*.html"))
          routes = sorted(public.rglob("index.html"))
          if len(routes) != 260:
              raise SystemExit(
                  f"Unexpected route count: {len(routes)} (expected 260)."
              )

          changed_html = 0
          for html_path in html_paths:
              html = html_path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'assets/styles\.css(?:\?v=[^"\']*)?',
                  f"assets/styles.css?v={revision}",
                  html,
              )
              if updated != html:
                  html_path.write_text(updated, encoding="utf-8")
                  changed_html += 1
          if changed_html == 0:
              raise SystemExit("No HTML stylesheet revisions were updated.")
          PY

      - name: Verify only the focused change
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )
          changed = set()
          for line in status.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          required = {
              "public/assets/styles.css",
              "tests/test_mobile_records_country_width.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(
                  "Expected change is missing: " + ", ".join(missing)
              )
          unexpected = sorted(
              path
              for path in changed
              if path not in required
              and not (
                  path.startswith("public/")
                  and path.endswith(".html")
              )
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: " + ", ".join(unexpected)
              )
          PY

          python -m unittest discover \
            --start-directory tests \
            --pattern "test_mobile_records_country_width.py" \
            --verbose

      - name: Commit and trigger Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public \
            tests/test_mobile_records_country_width.py
          if git diff --cached --quiet; then
            echo "The mobile Records country-width fix is installed."
            exit 0
          fi
          git commit -m "fix: widen mobile Records country columns"
          git push
