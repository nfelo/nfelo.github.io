name: Install chart contrast accessibility fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-chart-contrast-accessibility-fix
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the exact failed presentation baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test "$GITHUB_REF_NAME" = "main"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          stylesheet = Path("public/assets/styles.css")
          payload = stylesheet.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          expected_digest = (
              "513c8a9c4585711d4fdabefd554868df0"
              "b9398d5109c208a80d381a1b6774ec6"
          )
          if digest != expected_digest:
              raise SystemExit(
                  "The stylesheet has changed since the failed deployment. "
                  f"Expected {expected_digest}, found {digest}."
              )

          css = payload.decode("utf-8")
          old_colour = "  --chart-b: #c72d83;"
          new_colour = "  --chart-b: #c52c82;"
          if css.count(old_colour) != 1 or new_colour in css:
              raise SystemExit(
                  "The expected light-mode chart colour baseline was not found."
              )

          routes = sorted(Path("public").rglob("index.html"))
          old_marker = "assets/styles.css?v=513c8a9c4585"
          invalid = []
          for route in routes:
              html = route.read_text(encoding="utf-8")
              if html.count(old_marker) != 1:
                  invalid.append(str(route))
          if len(routes) != 260 or invalid:
              raise SystemExit(
                  "The route baseline is not the audited release: "
                  f"routes={len(routes)}, invalid={invalid[:5]}"
              )

          print(
              "Verified the failed presentation release: "
              "one deficient chart colour and 260 matching routes."
          )
          PY

      - name: Apply the minimal contrast correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          stylesheet = Path("public/assets/styles.css")
          css = stylesheet.read_text(encoding="utf-8")
          old_colour = "  --chart-b: #c72d83;"
          new_colour = "  --chart-b: #c52c82;"
          if css.count(old_colour) != 1:
              raise SystemExit("Refusing to make an ambiguous CSS replacement.")
          stylesheet.write_text(
              css.replace(old_colour, new_colour),
              encoding="utf-8",
          )

          digest = hashlib.sha256(stylesheet.read_bytes()).hexdigest()
          expected_digest = (
              "86574473265574b95d676bf5454c5736"
              "f3ffc5f80831c7c7a3f0a624608b549a"
          )
          if digest != expected_digest:
              raise SystemExit(
                  "The corrected stylesheet does not match the audited result: "
                  f"{digest}"
              )

          old_marker = "assets/styles.css?v=513c8a9c4585"
          new_marker = f"assets/styles.css?v={digest[:12]}"
          routes = sorted(Path("public").rglob("index.html"))
          changed = 0
          for route in routes:
              html = route.read_text(encoding="utf-8")
              if html.count(old_marker) != 1:
                  raise SystemExit(
                      f"Unexpected stylesheet marker in {route}."
                  )
              route.write_text(
                  html.replace(old_marker, new_marker),
                  encoding="utf-8",
              )
              changed += 1

          if changed != 260:
              raise SystemExit(f"Expected 260 routes, changed {changed}.")
          print(
              "Changed chart B from #c72d83 to #c52c82 and "
              f"updated {changed} route cache keys to {digest[:12]}."
          )
          PY

      - name: Validate every chart colour in light and dark modes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          stylesheet = Path("public/assets/styles.css")
          css = stylesheet.read_text(encoding="utf-8")
          light_css, dark_css = css.split(
              "@media (prefers-color-scheme: dark)",
              maxsplit=1,
          )
          dark_css = dark_css.split("\n}\n\n* {", maxsplit=1)[0]

          def variables(block: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for line in block.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("--") and ":" in stripped:
                      name, value = stripped.rstrip(";").split(
                          ":",
                          maxsplit=1,
                      )
                      values[name] = value.strip()
              return values

          def luminance(colour: str) -> float:
              channels = [
                  int(colour[index:index + 2], 16) / 255
                  for index in (1, 3, 5)
              ]
              linear = [
                  value / 12.92
                  if value <= 0.04045
                  else ((value + 0.055) / 1.055) ** 2.4
                  for value in channels
              ]
              return (
                  0.2126 * linear[0]
                  + 0.7152 * linear[1]
                  + 0.0722 * linear[2]
              )

          def contrast(first: str, second: str) -> float:
              brighter, darker = sorted(
                  (luminance(first), luminance(second)),
                  reverse=True,
              )
              return (brighter + 0.05) / (darker + 0.05)

          minimum = float("inf")
          for mode, palette in (
              ("light", variables(light_css)),
              ("dark", variables(dark_css)),
          ):
              background = palette["--surface-subtle"]
              for suffix in "abcdefghij":
                  variable = f"--chart-{suffix}"
                  ratio = contrast(palette[variable], background)
                  minimum = min(minimum, ratio)
                  print(
                      f"{mode:5} {variable}: "
                      f"{palette[variable]} on {background} = {ratio:.6f}:1"
                  )
                  if ratio < 4.5:
                      raise SystemExit(
                          f"{mode} {variable} remains below 4.5:1."
                      )

          if variables(light_css)["--chart-b"] != "#c52c82":
              raise SystemExit("The corrected chart B colour is not active.")
          if minimum < 4.5:
              raise SystemExit("A chart colour remains below 4.5:1.")

          digest = hashlib.sha256(stylesheet.read_bytes()).hexdigest()[:12]
          marker = f"assets/styles.css?v={digest}"
          routes = sorted(Path("public").rglob("index.html"))
          invalid = [
              str(route)
              for route in routes
              if route.read_text(encoding="utf-8").count(marker) != 1
          ]
          if len(routes) != 260 or invalid:
              raise SystemExit(
                  "Not every route has the corrected cache key: "
                  f"routes={len(routes)}, invalid={invalid[:5]}"
              )

          print(
              f"All chart colours pass 4.5:1; minimum={minimum:.6f}:1."
          )
          PY

      - name: Run fast presentation checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests \
            --pattern test_presentation.py \
            --verbose
          node --check public/assets/app.js
          git diff --check

      - name: Verify the minimal change boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          expected = {
              "public/assets/styles.css",
              *(
                  path.as_posix()
                  for path in Path("public").rglob("index.html")
              ),
          }
          actual = set(changed)
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(
                  "Unexpected change boundary: "
                  f"missing={missing[:5]}, extra={extra[:5]}"
              )
          if len(actual) != 261:
              raise SystemExit(
                  f"Expected exactly 261 changed files, found {len(actual)}."
              )
          print(
              "Only the stylesheet and its 260 route cache keys changed."
          )
          PY

      - name: Commit the fix and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- public
          git rm -- \
            .github/workflows/install-chart-contrast-accessibility-fix.yml
          git diff --cached --check
          git commit -m \
            "Fix light-mode chart colour contrast"
          if ! git push origin HEAD:main; then
            echo "Main moved during validation; rebasing once."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write installation summary
        if: success()
        run: |
          {
            echo "## Chart contrast corrected"
            echo
            echo "- Light chart B: \`#c72d83\` → \`#c52c82\`"
            echo "- Contrast: 4.4700:1 → 4.5525:1"
            echo "- All 20 light/dark chart combinations pass 4.5:1"
            echo "- All 260 route cache keys updated"
            echo "- Presentation checks passed"
            echo
            echo "No ratings, forecasts, match data, copy or layout changed."
            echo "The push has triggered a fresh Pages build and deployment."
          } >> "$GITHUB_STEP_SUMMARY"
