    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify repository and presentation baseline
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --short)"

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "config/404.html": "28c2d269dac61d67add545604b94f2d83f3e06a864ae90cbd13cbee49ae9638b",
              "public/apple-touch-icon-2026.png": "e0143f98ba13acdc64549d077a36660536500e62215006a3e1b7276802467db0",
              "public/assets/styles.css": "6e1e925998a72489c12ec09c07ee34d05de0c3cf01fd7e4b5630d5f4e1389ab8",
              "public/favicon-2026.ico": "89d11330300663518edbbe8a73cd5411c7308700ad9f6d1c6281117ace4c7754",
              "public/favicon-2026.svg": "abfd5ac4e7944b5351ff4c19e065adff9b708037b656d773616ab00af6862ee8",
              "public/favicon.ico": "89d11330300663518edbbe8a73cd5411c7308700ad9f6d1c6281117ace4c7754",
              "public/favicon.svg": "abfd5ac4e7944b5351ff4c19e065adff9b708037b656d773616ab00af6862ee8",
              "public/icon-192-2026.png": "89138b6433f6e0825d7ef83ae0da3994e10b3b58ea665cc25395a69e5c541540",
              "public/icon-512-2026.png": "b62526525177c055e1aabefbe6260fb578cc7aff276278e66fcfd1fa5336d09b",
              "public/index.html": "19a04a5f4ffe3f26cf705ae52cd2c1cddc0ea79cc9a0b7f6558888f1a047e740",
              "public/site.webmanifest": "8528e35effc9f1f3d1027a66852836b950069aa90786a5bb870eedf19cf30d69",
              "public/social-card.png": "8667b618fc3dec26c942cce12ef137ef46be15024118e252b4b4cc81c9a7f4a0",
              "public/social-card.svg": "05006359cd42d80da23541a0c85a58a173a149200aa4d06dc2fc90bd05533d01",
              "tests/test_build.py": "405adc1287cdb559215f6cf8bc9d5858fbc5c7b21c6d88ac7ac705e3978a190e",
              "tests/test_presentation.py": "41c36a9ce371b7ef2fea13f8f7ed18ce972b6b94cabe177866fbb341c9671e66",
          }
          must_be_absent = {
              "public/assets/botanical-sprig-2026.svg",
              "public/assets/floral-divider-2026.svg",
              "public/assets/fonts/Fraunces-OFL.txt",
              "public/assets/fonts/fraunces-variable-latin-v38.woff2",
          }

          failures = []
          for filename, wanted in expected.items():
              path = Path(filename)
              actual = sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != wanted:
                  failures.append(f"{filename}: expected {wanted}, found {actual}")
          for filename in sorted(must_be_absent):
              if Path(filename).exists():
                  failures.append(f"{filename}: expected this new asset to be absent")

          if failures:
              print("::error::The presentation changed after this installer was prepared. No files were changed.")
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"Verified {len(expected)} baseline files and {len(must_be_absent)} new paths.")
          PY

      - name: Decode and inspect the floral release
        shell: bash
        run: |
          set -euo pipefail

          release="$RUNNER_TEMP/nfelo-floral-editorial-release.tar.xz"
          for number in {01..16}; do
            variable="UPDATE_ARCHIVE_$number"
            printf '%s' "${!variable}"
          done | tr -d '[:space:]' | base64 --decode > "$release"

          echo "$UPDATE_ARCHIVE_SHA256  $release" | sha256sum --check
          xz --test "$release"

          RELEASE="$release" python - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              "config/404.html",
              "public/apple-touch-icon-2026.png",
              "public/assets/styles.css",
              "public/assets/botanical-sprig-2026.svg",
              "public/assets/floral-divider-2026.svg",
              "public/assets/fonts/Fraunces-OFL.txt",
              "public/assets/fonts/fraunces-variable-latin-v38.woff2",
              "public/favicon-2026.ico",
              "public/favicon-2026.svg",
              "public/favicon.ico",
              "public/favicon.svg",
              "public/icon-192-2026.png",
              "public/icon-512-2026.png",
              "public/index.html",
              "public/site.webmanifest",
              "public/social-card.png",
              "public/social-card.svg",
              "tests/test_build.py",
              "tests/test_presentation.py",
          }

          with tarfile.open(os.environ["RELEASE"], "r:xz") as archive:
              members = archive.getmembers()
              actual = {member.name for member in members}
              unsafe = [
                  member.name
                  for member in members
                  if not member.isfile()
                  or PurePosixPath(member.name).is_absolute()
                  or ".." in PurePosixPath(member.name).parts
              ]

          if actual != expected or unsafe:
              print(
                  "::error::Unexpected release contents: "
                  f"missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}, "
                  f"unsafe={unsafe}"
              )
              raise SystemExit(1)

          print(f"Release contains exactly {len(expected)} safe presentation files.")
          PY

