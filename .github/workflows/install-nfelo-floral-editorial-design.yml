              "public/favicon.ico": "a707ea44632158dd52347b698f5a3322b02fa823daea23ba2bf74e13ecead096",
              "public/favicon.svg": "9a8784c3f4b436d72ef9e25a96ca2652244eed5bef8c9048ee989bfe59a9146e",
              "public/icon-192-2026.png": "8fa93e0dda17646a0952e53fb8dfd7454db7cf1b8544d1b10989f090bf7dc665",
              "public/icon-512-2026.png": "8c23e87bf12d5b0645160af97a8fb4fabd4c20356bb337f0eeba64dbad15ab8a",
              "public/index.html": "ae257fdd4cc779760a26d21b7dbcec7716fa77fc9264e2e35e88003b03f64685",
              "public/site.webmanifest": "9a198065bef9113ba7be61c9c0368e74847884269db73cbd5f332a9d5f4d8604",
              "public/social-card.png": "153cf9910d7113d9c9148beedbd0e5797a1eac41b61cbb734666bd9107f0d4f1",
              "public/social-card.svg": "c5685fe572fd22612529af2fa77648604f5dbdfadfa01ab93d80e3ae71cfd36e",
              "tests/test_build.py": "65b350ecb4afaac7612d2916f03a2dd96b52703a098f1a9df3fc9d583e405c92",
              "tests/test_presentation.py": "13bcea3d639a9a593a3146eb1ec10615ff5b68ba85873e92e1358b99220b9c29",
          }

          failures = []
          for filename, wanted in expected.items():
              actual = sha256(Path(filename).read_bytes()).hexdigest()
              if actual != wanted:
                  failures.append(f"{filename}: expected {wanted}, found {actual}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          changed.update(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          if changed != set(expected):
              raise AssertionError(
                  "Unexpected pre-build change boundary: "
                  f"missing={sorted(set(expected) - changed)}, "
                  f"extra={sorted(changed - set(expected))}"
              )

          print(f"Verified {len(expected)} installed presentation files.")
          PY

          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild every static route
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run the complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          node --check scripts/smoke_browser_boot.js
          node scripts/smoke_browser_boot.js public
          git diff --check

      - name: Audit accessibility, branding and change boundary
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import subprocess

          public = Path("public")
          styles_path = public / "assets" / "styles.css"
          styles = styles_path.read_text(encoding="utf-8")
          css_version = sha256(styles_path.read_bytes()).hexdigest()[:12]
          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise AssertionError(f"Expected at least 250 generated routes, found {len(routes)}")

          required_route_markers = {
              "favicon-2026.ico?v=20260728f1",
              "favicon-2026.svg?v=20260728f1",
              "apple-touch-icon-2026.png?v=20260728f1",
              "site.webmanifest?v=20260728f1",
              "social-card.png?v=20260728f1",
              'src="favicon-2026.svg?v=20260728f1"',
              f"assets/styles.css?v={css_version}",
          }
          for route in routes:
              html = route.read_text(encoding="utf-8")
              missing = sorted(marker for marker in required_route_markers if marker not in html)
              if missing:
                  raise AssertionError(f"{route}: missing presentation markers {missing}")

          required_css = {
              '@font-face',
              '--font-display: "Fraunces Variable", Candara, Corbel',
              '--font-numeric: "Aptos", Calibri',
              '--flower-mask:',
              'url("botanical-sprig-2026.svg")',
              'url("floral-divider-2026.svg")',
              "Floral editorial presentation system",
              "@media (prefers-color-scheme: dark)",
              "@media (min-width: 721px) and (max-width: 1024px)",
              "@media (max-width: 720px)",
              ".button-primary::before",
              ".eyebrow::before",
              ".chronology-cause::before",
          }
          missing_css = sorted(marker for marker in required_css if marker not in styles)
          if missing_css:
              raise AssertionError(f"Missing presentation CSS: {missing_css}")
          if styles.count("--result-win: #2f7657;") != 2:
              raise AssertionError("Traditional green win styling changed")
          if styles.count("--result-loss: #a93b55;") != 2:
              raise AssertionError("Traditional red loss styling changed")

          font = public / "assets" / "fonts" / "fraunces-variable-latin-v38.woff2"
          if font.read_bytes()[:4] != b"wOF2":
              raise AssertionError("The self-hosted display font is not a valid WOFF2 file")
          licence = (public / "assets" / "fonts" / "Fraunces-OFL.txt").read_text(encoding="utf-8")
          if "SIL OPEN FONT LICENSE" not in licence:
              raise AssertionError("The Fraunces licence is missing")

          primary_svg = (public / "favicon-2026.svg").read_text(encoding="utf-8")
          if primary_svg != (public / "favicon.svg").read_text(encoding="utf-8"):
              raise AssertionError("The SVG browser icons do not match")
          if primary_svg.count("<ellipse") < 5 or '<radialGradient id="petal">' not in primary_svg:
              raise AssertionError("The brand flower is not explicit")
          if (public / "favicon-2026.ico").read_bytes() != (public / "favicon.ico").read_bytes():
              raise AssertionError("The ICO browser icons do not match")

          for filename in ("botanical-sprig-2026.svg", "floral-divider-2026.svg"):
              botanical = (public / "assets" / filename).read_text(encoding="utf-8")
              if '<g id="flower">' not in botanical or botanical.count("<ellipse") < 5:
                  raise AssertionError(f"{filename} is not recognisably floral")

          def png_dimensions(path: Path) -> tuple[int, int]:
              payload = path.read_bytes()
              if payload[:8] != b"\x89PNG\r\n\x1a\n":
                  raise AssertionError(f"{path} is not a PNG")
              return (
                  int.from_bytes(payload[16:20], "big"),
                  int.from_bytes(payload[20:24], "big"),
              )

          expected_dimensions = {
              "apple-touch-icon-2026.png": (180, 180),
              "icon-192-2026.png": (192, 192),
              "icon-512-2026.png": (512, 512),
              "social-card.png": (1200, 630),
          }
          for filename, dimensions in expected_dimensions.items():
              if png_dimensions(public / filename) != dimensions:
                  raise AssertionError(f"{filename} has the wrong dimensions")

          manifest = json.loads((public / "site.webmanifest").read_text(encoding="utf-8"))
          if {icon["src"] for icon in manifest["icons"]} != {
              "icon-192-2026.png?v=20260728f1",
              "icon-512-2026.png?v=20260728f1",
          }:
              raise AssertionError("The PWA icon versions are inconsistent")

          def luminance(colour: str) -> float:
              channels = [
                  int(colour[index:index + 2], 16) / 255.0
                  for index in (1, 3, 5)
              ]
              linear = [
                  value / 12.92
                  if value <= 0.04045
                  else ((value + 0.055) / 1.055) ** 2.4
                  for value in channels
              ]
              return (
                  0.2126 * linear[0]
                  + 0.7152 * linear[1]
                  + 0.0722 * linear[2]
              )

          def contrast(first: str, second: str) -> float:
              lighter, darker = sorted(
                  (luminance(first), luminance(second)),
                  reverse=True,
              )
              return (lighter + 0.05) / (darker + 0.05)

          contrast_pairs = {
              "light body": ("#3d1f38", "#fffafd"),
              "light secondary": ("#705268", "#fffafd"),
              "dark body": ("#fff9fd", "#27111f"),
              "dark secondary": ("#e4ccdc", "#27111f"),
              "primary button start": ("#35102e", "#ffc4e5"),
              "primary button middle": ("#35102e", "#ff9fd5"),
              "primary button end": ("#35102e", "#ddb9f4"),
              "win": ("#fff9fd", "#2f7657"),
              "loss": ("#fff9fd", "#a93b55"),
          }
          failed_contrast = {
              name: contrast(*pair)
              for name, pair in contrast_pairs.items()
              if contrast(*pair) < 4.5
          }
          if failed_contrast:
              raise AssertionError(f"WCAG AA contrast failures: {failed_contrast}")

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          changed.update(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          route_names = {route.as_posix() for route in routes}
          expected_non_routes = {
              "config/404.html",
              "public/apple-touch-icon-2026.png",
              "public/assets/styles.css",
              "public/assets/botanical-sprig-2026.svg",
              "public/assets/floral-divider-2026.svg",
              "public/assets/fonts/Fraunces-OFL.txt",
              "public/assets/fonts/fraunces-variable-latin-v38.woff2",
              "public/favicon-2026.ico",
              "public/favicon-2026.svg",
              "public/favicon.ico",
              "public/favicon.svg",
              "public/icon-192-2026.png",
              "public/icon-512-2026.png",
              "public/site.webmanifest",
              "public/social-card.png",
              "public/social-card.svg",
              "tests/test_build.py",
              "tests/test_presentation.py",
          }
          expected_changes = route_names | expected_non_routes
          if changed != expected_changes:
              raise AssertionError(
                  "Unexpected final change boundary: "
                  f"missing={sorted(expected_changes - changed)}, "
                  f"extra={sorted(changed - expected_changes)}"
              )

          protected_prefixes = ("source/", "docs/", "research/", "scripts/")
          protected_files = {
              "README.md",
              "config/elo_matches.json",
              "config/forecast_layer.json",
              "config/tournament_classification.json",
              "config/venue_effects.json",
              "public/assets/app.js",
          }
          protected_changes = sorted(
              filename
              for filename in changed
              if filename in protected_files or filename.startswith(protected_prefixes)
          )
          if protected_changes:
              raise AssertionError(f"Model, data, content or application logic changed: {protected_changes}")

          print(f"Routes checked: {len(routes)}")
          print(f"Final files changed: {len(changed)}")
          print(f"Stylesheet version: {css_version}")
          print("Light, dark, desktop, tablet and mobile presentation guards passed.")
          PY

      - name: Commit and publish the presentation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- config public tests
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No presentation changes were available to commit."
            exit 1
          fi

          git commit -m "Adopt floral editorial presentation"
          git push origin HEAD:main

      - name: Installation summary
        if: success()
        run: |
          {
            echo "## Floral editorial presentation installed"
            echo
            echo "- Replaced eye-like lozenges with unmistakable five-petal blossoms."
            echo "- Added botanical sprigs and floral page dividers without obscuring content."
            echo "- Added a self-hosted editorial display serif; all data and ratings retain aligned sans-serif numerals."
            echo "- Unified the floral logo across the header, browser, Apple, Android and social-sharing assets."
            echo "- Preserved traditional green wins, red losses, accessible contrast and 44px touch targets."
            echo "- Verified every generated route across desktop, tablet, mobile, light and dark presentation rules."
            echo
            echo "The push to main has triggered the normal Pages deployment."
          } >> "$GITHUB_STEP_SUMMARY"
