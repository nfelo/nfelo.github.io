          p=.nfelo-universal-tournaments-v3.patch
          if grep -Eq '^diff --git a/\.github/workflows/' "$p"; then
            echo "::error::The encoded upgrade must not modify an existing workflow."
            exit 1
          fi
          if git apply --check "$p"; then
            git apply --index "$p"
          elif git apply --reverse --check "$p"; then
            echo "The v3 upgrade is already present; validating it before removing this installer."
          elif git apply --3way --index "$p"; then
            echo "Applied v3 onto newer non-overlapping repository changes."
          else
            echo "::error::v3 conflicts with newer repository work; nothing will be pushed."
            exit 1
          fi
          if test -n "$(git diff --cached --name-only -- .github/workflows)"; then
            echo "::error::The payload unexpectedly staged a workflow change."
            exit 1
          fi
          git diff --cached --check

      - name: Install and verify the runtime
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Build the universal tournament catalogue
        run: |
          set -Eeuo pipefail
          python scripts/build_site.py --source source --config config --output public
          python scripts/tournament_odds.py validate \
            --manifest source/tournament_odds/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("source/tournament_odds/manifest.json").read_text(encoding="utf-8"))
          p = json.loads(Path("source/tournament_odds/probabilities.json").read_text(encoding="utf-8"))
          editions = list(m["editions"].values())
          ready = [row for row in editions if row["status"] == "ready"]
          if len(editions) < 1000 or len(ready) / len(editions) < 0.99:
              raise SystemExit(f"Universal coverage is too low: {len(ready)}/{len(editions)}")
          if len(p["editions"]) != len(ready):
              raise SystemExit("The probability cache does not match the ready manifest")
          for key, row in p["editions"].items():
              if row["trials"] < 10000 or sum(row["wins"]) != row["trials"]:
                  raise SystemExit(f"Invalid deterministic counts for {key}")
              if sum(round(float(value) * 10) for value in row["title_chances"].values()) != 1000:
                  raise SystemExit(f"Displayed chances do not total 100.0% for {key}")
          lookup = {(row["family"], row["start"]): row for row in editions}
          if lookup[("FIFA World Cup", "1990-06-08")]["rules"]["points_for_win"] != 2:
              raise SystemExit("The 1990 World Cup must use two points per win")
          if lookup[("FIFA World Cup", "1994-06-17")]["rules"]["points_for_win"] != 3:
              raise SystemExit("The 1994 World Cup must use three points per win")
          print(json.dumps({"editions": len(editions), "ready": len(ready), "unsupported": len(editions) - len(ready)}, sort_keys=True))
          PY

      - name: Prove the generated odds are reproducible
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(sha256sum source/tournament_odds/manifest.json source/tournament_odds/probabilities.json)"
          python scripts/build_site.py --source source --config config --output public
          after="$(sha256sum source/tournament_odds/manifest.json source/tournament_odds/probabilities.json)"
          if [ "$before" != "$after" ]; then
            echo "::error::A repeated build changed the signed tournament artefacts."
            exit 1
          fi

      - name: Run syntax and tournament regression checks
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/tournament_odds.py \
            scripts/tournament_simulation.py \
            scripts/build_site.py \
            scripts/model.py \
            scripts/forecast_layer.py \
            scripts/fetch_sources.py
          node --check public/assets/app.js
          python -m unittest tests.test_tournament_title_chances --verbose

      - name: Run the complete repository test suite
        run: |
          set -Eeuo pipefail
          python -m unittest discover --start-directory tests --verbose

      - name: Commit the validated v3 installation
        shell: bash
        run: |
          set -Eeuo pipefail
          i="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          i="${i%@*}"
          case "$i" in
            .github/workflows/*.yml|.github/workflows/*.yaml) ;;
            *) echo "::error::Could not identify this installer safely: $i"; exit 1 ;;
          esac

          git add -- \
            README.md \
            config/tournament_odds.json \
            public/assets/app.js \
            public/assets/styles.css \
            scripts/build_site.py \
            scripts/fetch_sources.py \
            scripts/forecast_layer.py \
            scripts/model.py \
            scripts/tournament_odds.py \
            scripts/tournament_simulation.py \
            source/tournament_odds/manifest.json \
            source/tournament_odds/probabilities.json \
            tests/test_build.py \
            tests/test_tournament_title_chances.py
          find public -type f -name index.html -exec git add -- {} +
          git rm -- "$i"
          rm -f -- .nfelo-universal-tournaments-v3.patch

          if test -n "$(git diff --name-only)"; then
            echo "::error::The build left unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          w="$(git diff --cached --name-only -- .github/workflows)"
          if [ "$w" != "$i" ]; then
            echo "::error::v3 must not modify any workflow except deleting itself."
            printf '%s\n' "$w"
            exit 1
          fi
          git diff --cached --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during validation; refusing to overwrite newer work."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: model universal tournament title chances [skip ci]"
          git push origin HEAD:main

      - name: Trigger the validated Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run pages.yml \
            --ref main \
            --field refresh_source=false \
            --field full_refresh=false
