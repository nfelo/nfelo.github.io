name: Install universal tournament title chances v3

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-universal-tournament-title-chances-v3
  cancel-in-progress: false

jobs:
  install:
    name: Build, validate and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
