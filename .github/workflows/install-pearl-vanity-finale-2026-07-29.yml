          0f0bc225dd59f4b5b840b660f20149c61c39536546452acfd807be57807e61d7  public/favicon.ico
          cb6431e450e087b89060fe432246563fbf75f7b0dfd77204fcda95acfa7b6d86  public/apple-touch-icon-2026.png
          8cdb242ebbc757fcfe7ba37b707dda392fc55b618342ddf927c030d1dd8c2987  public/icon-192-2026.png
          cc648859f5f6dbebcbb0fa862b4e510c2212137df76659cba517f182d699c38b  public/icon-512-2026.png
          87d39efb6f49ba8725a742b99bdbada6018e2ca7aa631597e1627667c6cd74a6  public/icon-maskable-2026.svg
          ddd65437e8c70d129eb53ad362a50f9740af54335c05f05fdabd5d9573ca8558  public/social-card.svg
          0a96079b8755dae00361ce74a76a3e0fb2f0d6d346ee2bab66639ed2fd700b73  public/social-card.png
          76f0094e761fd804591ff44320648ec8ef42a9139f193c23b3f4eb273a560364  public/site.webmanifest
          SHA256

