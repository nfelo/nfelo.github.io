name: Install pearl vanity finale

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-pearl-vanity-finale
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the audited baseline and lock the identity
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "f28cb91c026648f2738ec61d4f777827a14d2fc5bd6cd0159122876ff73138a3"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "a794d697aa56974775cd1acc9b31bd0ce930540e9799d7abe119979d2466439b"
          grep -Fq \
            "Moonlit matchbook visibility correction." \
            public/assets/styles.css
          test \
            "$(grep -Fc "Pearl vanity unification finale." \
              public/assets/styles.css || true)" \
            -eq 0

          route_count="$(find public -type f -name index.html | wc -l)"
          test "$route_count" -eq 260

          sha256sum --check <<'SHA256'
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon-2026.svg
