        shell: bash
        run: |
          set -euo pipefail

          release="$RUNNER_TEMP/nfelo-floral-editorial-compact-release.tar.xz"
          tar --extract --xz --file "$release" --directory .

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          expected = {
