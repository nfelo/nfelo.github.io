              "public/apple-touch-icon-2026.png": "297b26bd3ad3c9a6c923169979d0e40651c3db6b17bc661b7fabbcb79fbc541a",
              "public/assets/styles.css": "1181467d71a989e086de37aebbb85d9f8f5bd366f52e9cd64766764f10e99022",
              "public/assets/botanical-sprig-2026.svg": "42902ed73020aad6be6e5565a980559eeac2ff6b739985dc57bb36ad15e11053",
              "public/assets/floral-divider-2026.svg": "7065c37fd16b0eb5612676e58ba6adca47356aa921f5090f1d5dd5bf5c949323",
              "public/assets/fonts/Fraunces-OFL.txt": "cd3384cafac6f2bddc3955273958a2e029f97027c8037ac539ef5744a77b579e",
              "public/assets/fonts/fraunces-variable-latin-v38.woff2": "7e744849028e2219e2aa1bc467dc4032980dc4487c9c3da3010081cd72d3b103",
              "public/favicon-2026.ico": "a707ea44632158dd52347b698f5a3322b02fa823daea23ba2bf74e13ecead096",
              "public/favicon-2026.svg": "9a8784c3f4b436d72ef9e25a96ca2652244eed5bef8c9048ee989bfe59a9146e",
              "public/favicon.ico": "a707ea44632158dd52347b698f5a3322b02fa823daea23ba2bf74e13ecead096",
              "public/favicon.svg": "9a8784c3f4b436d72ef9e25a96ca2652244eed5bef8c9048ee989bfe59a9146e",
              "public/icon-192-2026.png": "5ff3bef28684138a656ee556e46a0b8bd2e3cda6441c4184368c16f659c709f3",
              "public/icon-512-2026.png": "cfed14714e9a2bc50a7231a144468897720c059b4ad1dbcbe398914c494f64d4",
