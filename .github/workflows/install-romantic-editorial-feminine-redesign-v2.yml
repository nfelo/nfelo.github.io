              linear-gradient(
                135deg,
                color-mix(in srgb, var(--lime) 88%, white),
                color-mix(in srgb, var(--lime) 76%, var(--romantic-champagne))
              );
            box-shadow:
              0 1px 0 rgba(255, 255, 255, 0.78) inset,
              0 8px 19px color-mix(
                in srgb,
                var(--romantic-dusty-rose) 24%,
                transparent
              );
          }

          .field input,
          .field select,
          .team-picker select,
          .comparison-pair-picker select,
          .chart-year-form input {
            max-width: 100%;
            border-color: color-mix(
              in srgb,
              var(--control-border) 72%,
              var(--romantic-mauve)
            );
            background:
              linear-gradient(
                180deg,
                color-mix(in srgb, var(--surface) 94%, var(--romantic-pearl)),
                var(--surface)
              );
            box-shadow:
              0 1px 0 var(--romantic-pearl-line) inset,
              0 5px 13px rgba(88, 29, 72, 0.05);
          }

          :where(
            .field input,
            .field select,
            .team-picker select,
            .comparison-pair-picker select,
            .chart-year-form input
          ):focus {
            border-color: var(--focus);
            box-shadow:
              0 0 0 4px color-mix(in srgb, var(--focus) 20%, transparent),
              0 1px 0 var(--romantic-pearl-line) inset;
          }

          .table-shell {
            position: relative;
            background:
              linear-gradient(
                180deg,
                color-mix(in srgb, var(--surface) 96%, var(--romantic-pearl)),
                var(--surface)
              );
            border-color: color-mix(
              in srgb,
              var(--border) 72%,
              var(--romantic-dusty-rose)
            );
            box-shadow: var(--romantic-small-shadow);
          }

          thead th {
