          body:is(
            [data-route="rankings"],
            [data-route="history"],
            [data-route="tournaments"],
            [data-route="matches"],
            [data-route="fixtures"],
            [data-route="records"],
            [data-route="compare"],
            [data-route="predict"],
            [data-route="team"]
          ) :where(.table-shell, .toolbar, .chart-shell, .panel) {
            box-shadow:
              0 1px 0 var(--romantic-pearl-line) inset,
              0 10px 28px rgba(76, 24, 62, 0.08);
          }

          body:is(
            [data-route="methodology"],
            [data-route="faq"],
            [data-route="about"]
          ) .prose > h2 {
            position: relative;
            padding-inline-start: 23px;
          }

          body:is(
            [data-route="methodology"],
            [data-route="faq"],
            [data-route="about"]
          ) .prose > h2::before {
            position: absolute;
            top: 0.2em;
            left: 0;
            width: 15px;
            height: 15px;
            background: linear-gradient(
              145deg,
              var(--romantic-dusty-rose),
              var(--romantic-mauve)
            );
            content: "";
            -webkit-mask: var(--flower-mask) center / contain no-repeat;
            mask: var(--flower-mask) center / contain no-repeat;
          }

          .site-footer {
            background:
              url("botanical-sprig-2026.svg") calc(100% + 80px) -35px / 270px auto no-repeat,
              radial-gradient(
                circle at 12% 100%,
                rgba(255, 150, 208, 0.12),
                transparent 23rem
              ),
              linear-gradient(
                135deg,
                var(--navy),
                color-mix(in srgb, var(--navy) 78%, var(--romantic-mauve))
              );
          }

          .site-footer a {
            text-decoration-color: color-mix(
              in srgb,
              currentColor 58%,
              transparent
            );
            text-underline-offset: 3px;
          }

          @media (prefers-color-scheme: dark) {
            body {
              background:
                radial-gradient(
                  circle at 7% 3%,
                  rgba(255, 120, 197, 0.11),
                  transparent 27rem
                ),
                radial-gradient(
                  circle at 94% 16%,
                  rgba(135, 169, 220, 0.08),
                  transparent 31rem
                ),
                radial-gradient(
                  circle at 48% 78%,
                  rgba(111, 178, 140, 0.055),
                  transparent 38rem
                ),
                repeating-radial-gradient(
                  circle at 0 0,
                  rgba(255, 230, 246, 0.014) 0 0.55px,
