          """
          layer_css_path.write_text(
              textwrap.dedent(css_layer).lstrip(),
              encoding="utf-8",
          )

          strict_anchor = '"use strict";'
          if app.count(strict_anchor) != 1:
              raise SystemExit("Could not locate the JavaScript strict-mode anchor.")
          app = app.replace(
              strict_anchor,
              strict_anchor + "\n\n  /* " + marker + " */",
              1,
          )

          copy_replacements = {
              "A predictive rating, rebuilt from 1872":
                  "A living football archive, modelled from 1872",
              "International football, ranked in context.":
                  "International football, ranked through history.",
              "What makes it different":
                  "The story beneath the score",
              "Opponents—and their opponents—matter.":
                  "Every opponent leaves a trace.",
              "More ways to explore":
                  "Follow the story",
              '<h2 id="home-explore-title">Explore</h2>':
                  '<h2 id="home-explore-title">Explore the archive</h2>',
          }
          for old, new in copy_replacements.items():
              if app.count(old) != 1:
                  raise SystemExit(
                      f"Expected one homepage copy anchor, found {app.count(old)}: {old}"
                  )
              app = app.replace(old, new, 1)

          function_name = "const filteredEmptyState = (subject) => ("
          if app.count(function_name) != 1:
              raise SystemExit("Could not locate the table enhancement function.")
          function_start = app.index(function_name)
          function_close = re.search(
              r"(?m)^[ \t]*\);[ \t]*$",
              app[function_start:],
          )
          if function_close is None:
              raise SystemExit("Could not locate the end of the table enhancement function.")
          function_end = function_start + function_close.end()
          enhancement = r"""const enhanceScrollableTables = () => {
            const compactViewport = window.matchMedia(
              "(max-width: 1180px)",
            ).matches;
            document.querySelectorAll(".table-shell").forEach((shell) => {
              const table = shell.querySelector(":scope > table");
              if (!table) return;
              const scrollable = shell.scrollWidth > shell.clientWidth + 2;
              const previous = shell.previousElementSibling;
              const existingHint = previous?.classList.contains(
                "table-scroll-hint",
              ) ? previous : null;

              shell.classList.toggle(
                "is-horizontally-scrollable",
                scrollable,
              );
              if (!scrollable || !compactViewport) {
                existingHint?.remove();
                if (shell.dataset.scrollRegion === "true") {
                  shell.removeAttribute("tabindex");
                  shell.removeAttribute("role");
                  shell.removeAttribute("aria-label");
                  delete shell.dataset.scrollRegion;
                }
                return;
              }

              const caption = table.querySelector("caption")
                ?.textContent?.trim();
              const label = table.getAttribute("aria-label")
                || caption
                || "Data table";
              shell.dataset.scrollRegion = "true";
              shell.setAttribute("tabindex", "0");
              shell.setAttribute("role", "region");
              shell.setAttribute(
                "aria-label",
                `${label}. Scroll horizontally for more columns.`,
              );

              const hint = existingHint || document.createElement("p");
              hint.className = "table-scroll-hint";
              hint.textContent = "Scroll or swipe to see more";
              hint.setAttribute("aria-hidden", "true");
              if (!existingHint) shell.before(hint);

              if (shell.dataset.scrollHintBound !== "true") {
                shell.dataset.scrollHintBound = "true";
                shell.addEventListener("scroll", () => {
                  const activeHint = shell.previousElementSibling;
                  if (
                    shell.scrollLeft > 10
                    && activeHint?.classList.contains("table-scroll-hint")
                  ) {
                    activeHint.remove();
                  }
                }, { passive: true });
              }
            });
          };
          """
          app = (
              app[:function_end]
              + "\n\n"
              + textwrap.dedent(enhancement).strip()
              + "\n"
              + app[function_end:]
          )

          route_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)setRouteMetadata\(current\);\n"
          )
          route_matches = list(route_pattern.finditer(app))
          if len(route_matches) != 1:
              raise SystemExit(
                  f"Expected one route metadata anchor, found {len(route_matches)}."
              )
          app = route_pattern.sub(
              lambda match: (
                  match.group(0)
                  + match.group("indent")
                  + "enhanceScrollableTables();\n"
              ),
              app,
              count=1,
          )

          offline_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)window\.addEventListener'
              r'\("offline", syncConnectionState\);\n'
          )
          offline_matches = list(offline_pattern.finditer(app))
          if len(offline_matches) != 1:
              raise SystemExit(
                  f"Expected one offline-listener anchor, found {len(offline_matches)}."
              )
          app = offline_pattern.sub(
              lambda match: (
                  match.group(0)
                  + match.group("indent")
                  + 'window.addEventListener("resize", enhanceScrollableTables);\n'
              ),
              app,
              count=1,
          )
          app_path.write_text(app, encoding="utf-8")

          test_source = r"""
          from __future__ import annotations

          import hashlib
          import re
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          PUBLIC = ROOT / "public"
          MAIN_CSS_PATH = PUBLIC / "assets" / "styles.css"
          LAYER_CSS_PATH = (
              PUBLIC / "assets" / "romantic-editorial-feminine-v2.css"
          )
          APP_PATH = PUBLIC / "assets" / "app.js"
          MARKER = "Romantic editorial feminine redesign v2 2026-07-30."


          class RomanticEditorialFeminineRedesignV2Tests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.main_css = MAIN_CSS_PATH.read_text(encoding="utf-8")
                  cls.layer = LAYER_CSS_PATH.read_text(encoding="utf-8")
                  cls.app = APP_PATH.read_text(encoding="utf-8")

              def test_new_layer_and_javascript_markers_are_unique(self) -> None:
                  self.assertNotIn(MARKER, self.main_css)
                  self.assertEqual(self.layer.count(MARKER), 1)
                  self.assertEqual(self.app.count(MARKER), 1)

              def test_existing_feminine_system_is_preserved(self) -> None:
                  for expected in (
                      "Refined rose-and-lavender presentation system",
                      "Floral editorial presentation system",
                      "botanical-sprig-2026.svg",
                      "floral-divider-2026.svg",
                      "--flower-mask",
                  ):
                      self.assertIn(expected, self.main_css)

              def test_palette_adds_variety_without_abandoning_rose(self) -> None:
                  for expected in (
                      "--romantic-rosewater",
                      "--romantic-blush",
                      "--romantic-dusty-rose",
                      "--romantic-mauve",
                      "--romantic-aubergine",
                      "--romantic-champagne",
                      "--romantic-sage",
                      "--romantic-powder-blue",
                  ):
                      self.assertIn(expected, self.layer)

              def test_light_dark_and_accessibility_modes_are_explicit(self) -> None:
                  for expected in (
                      "@media (prefers-color-scheme: dark)",
                      "@media (prefers-reduced-motion: no-preference)",
                      "@media (prefers-reduced-motion: reduce)",
                      "@media (forced-colors: active)",
                  ):
                      self.assertIn(expected, self.layer)

              def test_desktop_tablet_phone_and_tiny_breakpoints_exist(self) -> None:
                  for expected in (
                      "(min-width: 901px) and (max-width: 1180px)",
                      "(min-width: 721px) and (max-width: 900px)",
                      "@media (max-width: 720px)",
                      "@media (max-width: 430px)",
                      "@media (max-width: 360px)",
                  ):
                      self.assertIn(expected, self.layer)
                  self.assertIn(".ranking-desktop", self.layer)
                  self.assertIn(".ranking-cards", self.layer)

              def test_tables_and_charts_receive_accessible_refinement(self) -> None:
                  for expected in (
                      ".table-scroll-hint",
                      ".rating-history-line",
                      ".chart-marker",
                      "stroke-linecap: round",
                      "tbody tr:nth-child(even) td",
                  ):
                      self.assertIn(expected, self.layer)
                  for expected in (
                      "const enhanceScrollableTables = () =>",
                      'shell.setAttribute("tabindex", "0")',
                      'shell.setAttribute("role", "region")',
                      "Scroll horizontally for more columns.",
                      "enhanceScrollableTables();",
                      'window.addEventListener("resize", enhanceScrollableTables)',
                  ):
                      self.assertIn(expected, self.app)

              def test_editorial_home_copy_remains_clear_and_specific(self) -> None:
                  for expected in (
                      "A living football archive, modelled from 1872",
                      "International football, ranked through history.",
                      "The story beneath the score",
                      "Every opponent leaves a trace.",
                      "Follow the story",
                      "Explore the archive",
                  ):
                      self.assertIn(expected, self.app)

              def test_layer_braces_are_balanced(self) -> None:
                  without_comments = re.sub(
                      r"/\*.*?\*/",
                      "",
                      self.layer,
                      flags=re.DOTALL,
                  )
                  self.assertEqual(
                      without_comments.count("{"),
                      without_comments.count("}"),
                  )

              def test_all_static_routes_load_the_layer_after_the_main_css(self) -> None:
                  main_revision = hashlib.sha256(
                      MAIN_CSS_PATH.read_bytes()
                  ).hexdigest()[:12]
                  layer_revision = hashlib.sha256(
                      LAYER_CSS_PATH.read_bytes()
                  ).hexdigest()[:12]
                  app_revision = hashlib.sha256(
                      APP_PATH.read_bytes()
                  ).hexdigest()[:12]
                  routes = sorted(PUBLIC.rglob("index.html"))
                  self.assertGreaterEqual(len(routes), 250)
                  for path in routes:
                      html = path.read_text(encoding="utf-8")
                      main_link = (
                          f"assets/styles.css?v={main_revision}"
                      )
                      layer_link = (
                          "assets/romantic-editorial-feminine-v2.css"
                          f"?v={layer_revision}"
                      )
                      app_link = f"assets/app.js?v={app_revision}"
                      self.assertIn(main_link, html, path)
                      self.assertEqual(html.count(layer_link), 1, path)
                      self.assertIn(app_link, html, path)
                      self.assertLess(
                          html.index(main_link),
                          html.index(layer_link),
                          path,
                      )


          if __name__ == "__main__":
              unittest.main()
          """
          test_path.write_text(
              textwrap.dedent(test_source).lstrip(),
              encoding="utf-8",
          )

          main_revision = hashlib.sha256(
              main_css_path.read_bytes()
          ).hexdigest()[:12]
          layer_revision = hashlib.sha256(
              layer_css_path.read_bytes()
          ).hexdigest()[:12]
          app_revision = hashlib.sha256(
              app_path.read_bytes()
          ).hexdigest()[:12]

          html_paths = sorted(public.rglob("index.html"))
          if len(html_paths) < 250:
              raise SystemExit(
                  f"Unexpectedly small static route set: {len(html_paths)} index files."
              )

          main_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)'
              r'<link rel="stylesheet" href="assets/styles\.css'
              r'(?:\?v=[^"\']*)?">[ \t]*$'
          )
          app_pattern = re.compile(
              r'assets/app\.js(?:\?v=[^"\']*)?'
          )
          changed_html = 0
          for html_path in html_paths:
              html = html_path.read_text(encoding="utf-8")
              matches = list(main_pattern.finditer(html))
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one main stylesheet link in {html_path}, "
                      f"found {len(matches)}."
                  )
              if "assets/romantic-editorial-feminine-v2.css" in html:
                  raise SystemExit(
                      f"The v2 stylesheet link already exists in {html_path}."
                  )
              match = matches[0]
              main_link = (
                  match.group("indent")
                  + '<link rel="stylesheet" '
                  + f'href="assets/styles.css?v={main_revision}">'
              )
              layer_link = (
                  match.group("indent")
                  + '<link rel="stylesheet" '
                  + 'href="assets/romantic-editorial-feminine-v2.css'
                  + f'?v={layer_revision}">'
              )
              updated = (
                  html[:match.start()]
                  + main_link
                  + "\n"
                  + layer_link
                  + html[match.end():]
              )
              updated = app_pattern.sub(
                  f"assets/app.js?v={app_revision}",
                  updated,
              )
              html_path.write_text(updated, encoding="utf-8")
              changed_html += 1

          print(
              f"Installed the independent v2 redesign stylesheet across "
              f"{changed_html} routes; main CSS {main_revision}, "
              f"layer {layer_revision}, JS {app_revision}."
          )
          PY

      - name: Check browser code and the focused v2 redesign test
        run: |
          node --check public/assets/app.js
          python -m unittest discover \
            --start-directory tests \
            --pattern "test_romantic_editorial_feminine_redesign_v2.py" \
            --verbose

      - name: Build temporary data for the complete test suite
        id: test_data
        if: inputs.run_full_test_suite
        run: |
          rm -rf \
            "$RUNNER_TEMP/nfelo-redesign-source" \
            "$RUNNER_TEMP/nfelo-redesign-public" \
            "$RUNNER_TEMP/nfelo-original-public-data"
          cp -a source "$RUNNER_TEMP/nfelo-redesign-source"
          cp -a public "$RUNNER_TEMP/nfelo-redesign-public"
          python scripts/build_site.py \
            --source "$RUNNER_TEMP/nfelo-redesign-source" \
            --config config \
            --output "$RUNNER_TEMP/nfelo-redesign-public"
          if [ -e public/data ] || [ -L public/data ]; then
            mv public/data "$RUNNER_TEMP/nfelo-original-public-data"
            echo "had_original=true" >> "$GITHUB_OUTPUT"
          else
            echo "had_original=false" >> "$GITHUB_OUTPUT"
          fi
          ln -s "$RUNNER_TEMP/nfelo-redesign-public/data" public/data

      - name: Run the complete repository test suite
        if: inputs.run_full_test_suite
        run: python -m unittest discover --start-directory tests --verbose

      - name: Restore the repository data state
        if: ${{ always() && inputs.run_full_test_suite }}
        env:
          HAD_ORIGINAL: ${{ steps.test_data.outputs.had_original }}
        run: |
          rm -rf public/data
          if [ "$HAD_ORIGINAL" = "true" ]; then
            mv "$RUNNER_TEMP/nfelo-original-public-data" public/data
          fi

      - name: Verify only compatible presentation files changed
        if: steps.preflight.outputs.already_installed != 'true'
        run: |
          git diff --check
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )
          changed: set[str] = set()
          for line in status.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          required = {
              "public/assets/app.js",
              "public/assets/romantic-editorial-feminine-v2.css",
              "tests/test_romantic_editorial_feminine_redesign_v2.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(
                  "Expected v2 redesign files are missing: "
                  + ", ".join(missing)
              )

          unexpected = sorted(
              path
              for path in changed
              if path not in required
              and not (
                  path.startswith("public/")
                  and path.endswith("/index.html")
              )
              and path != "public/index.html"
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected non-presentation files changed: "
                  + ", ".join(unexpected)
              )

          forbidden = sorted(
              path
              for path in changed
              if path == "public/assets/styles.css"
              or path.startswith(
                  (
                      "source/",
                      "config/",
                      "scripts/",
                      "public/data/",
                  )
              )
          )
          if forbidden:
              raise SystemExit(
                  "Protected current-system files changed: "
                  + ", ".join(forbidden)
              )
          PY

      - name: Create a reviewable patch when commit is disabled
        if: ${{ !inputs.commit_changes && steps.preflight.outputs.already_installed != 'true' }}
        run: |
          git add -N -- \
            public/assets/romantic-editorial-feminine-v2.css \
            tests/test_romantic_editorial_feminine_redesign_v2.py
          git diff --binary > romantic-editorial-feminine-redesign-v2.patch

      - name: Upload the reviewable patch
        if: ${{ !inputs.commit_changes && steps.preflight.outputs.already_installed != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: romantic-editorial-feminine-redesign-v2
          path: romantic-editorial-feminine-redesign-v2.patch
          if-no-files-found: error

      - name: Commit the validated v2 redesign and trigger Pages
        if: ${{ inputs.commit_changes && steps.preflight.outputs.already_installed != 'true' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/assets/app.js \
            public/assets/romantic-editorial-feminine-v2.css \
            tests/test_romantic_editorial_feminine_redesign_v2.py \
            ':(glob)public/**/index.html'
          if git diff --cached --quiet; then
            echo "The romantic editorial v2 redesign is already installed."
            exit 0
          fi
          git commit -m "style: deepen the romantic editorial design"
          git push origin "HEAD:${BRANCH_NAME}"
