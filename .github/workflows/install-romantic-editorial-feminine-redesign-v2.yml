name: Install romantic editorial feminine redesign v2

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit the validated redesign to the selected branch
        type: boolean
        default: true
      run_full_test_suite:
        description: Build temporary data and run every Python test
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nfelo-romantic-editorial-feminine-redesign-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the repository runtime
        run: python -m pip install --requirement requirements.txt

      - name: Confirm the audited starting point
        id: preflight
        env:
          EXPECTED_CSS_BLOB: 178aabebcd9a636dfbab8d8ecd650c61b8dc8426
          EXPECTED_APP_BLOB: e1d5102fc1a9d57fe76ab0ae11e7ff872a780cd5
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          main_css = Path("public/assets/styles.css")
          layer_css = Path("public/assets/romantic-editorial-feminine-v2.css")
          app_path = Path("public/assets/app.js")
          test_path = Path(
              "tests/test_romantic_editorial_feminine_redesign_v2.py"
          )
          required_assets = (
              Path("public/assets/botanical-sprig-2026.svg"),
              Path("public/assets/floral-divider-2026.svg"),
          )
          marker = "Romantic editorial feminine redesign v2 2026-07-30."

          for path in (main_css, app_path, *required_assets):
              if not path.is_file():
                  raise SystemExit(f"Required current-system file is missing: {path}")

          main_text = main_css.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")
          installed = (
              layer_css.is_file()
              and marker in layer_css.read_text(encoding="utf-8"),
              marker in app,
              test_path.is_file(),
          )

          if all(installed):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("already_installed=true\n")
              print("The v2 redesign is already installed; validation will still run.")
              raise SystemExit(0)

          if any(installed):
              raise SystemExit(
                  "A partial v2 installation was found. Restore the branch or finish "
                  "the existing installation before running this workflow again."
              )

          expected = {
              main_css: os.environ["EXPECTED_CSS_BLOB"],
              app_path: os.environ["EXPECTED_APP_BLOB"],
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)],
                  text=True,
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"{path} has changed since this workflow was audited "
                      f"({actual} != {wanted}). Review the current presentation "
                      "before updating the guard."
                  )

          for required_marker in (
              "Refined rose-and-lavender presentation system",
              "Floral editorial presentation system",
          ):
              if required_marker not in main_text:
                  raise SystemExit(
                      "The current feminine presentation layer is missing: "
                      + required_marker
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("already_installed=false\n")
          PY

      - name: Install the independent responsive editorial layer
        if: steps.preflight.outputs.already_installed != 'true'
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import textwrap
          from pathlib import Path

          public = Path("public")
          main_css_path = public / "assets" / "styles.css"
          layer_css_path = (
              public / "assets" / "romantic-editorial-feminine-v2.css"
          )
          app_path = public / "assets" / "app.js"
          test_path = Path(
              "tests/test_romantic_editorial_feminine_redesign_v2.py"
          )
          marker = 'Romantic editorial feminine redesign v2 2026-07-30.'

          main_css = main_css_path.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")
          if layer_css_path.exists() or marker in app or test_path.exists():
              raise SystemExit("Refusing to create a duplicate v2 redesign layer.")

          css_layer = r"""

          /*
           * Romantic editorial feminine redesign v2 2026-07-30.
           *
           * This independent cascade layer deepens the existing rose, lavender and
           * botanical identity without removing any current feminine details.
           * It gives the home and editorial routes the richest treatment,
           * keeps analytical routes disciplined, creates a deliberate tablet
           * mode, improves mobile table discovery and supports light, dark,
           * reduced-motion, high-contrast and very narrow screens.
           */
          :root {
            --romantic-cream: #fffaf3;
            --romantic-pearl: #fff7fc;
            --romantic-rosewater: #fce3f0;
            --romantic-blush: #f4bfd8;
            --romantic-dusty-rose: #cf719d;
            --romantic-mauve: #9d5a8b;
            --romantic-aubergine: #421536;
            --romantic-champagne: #e7c98e;
            --romantic-sage: #b9d4c3;
            --romantic-powder-blue: #c8d9ef;
            --romantic-lace: rgba(164, 70, 128, 0.20);
            --romantic-pearl-line: rgba(255, 255, 255, 0.72);
            --romantic-panel-shadow:
              0 1px 0 var(--romantic-pearl-line) inset,
              0 18px 46px rgba(88, 29, 72, 0.12);
            --romantic-small-shadow:
              0 1px 0 var(--romantic-pearl-line) inset,
              0 9px 24px rgba(88, 29, 72, 0.10);
          }

          @media (prefers-color-scheme: dark) {
            :root {
              --romantic-cream: #25131f;
              --romantic-pearl: #2f1728;
              --romantic-rosewater: #4b233d;
              --romantic-blush: #773859;
              --romantic-dusty-rose: #e78ab9;
              --romantic-mauve: #d69ac8;
              --romantic-aubergine: #160910;
              --romantic-champagne: #e2c58f;
              --romantic-sage: #91c7aa;
              --romantic-powder-blue: #9ebde1;
              --romantic-lace: rgba(255, 166, 216, 0.22);
              --romantic-pearl-line: rgba(255, 236, 248, 0.10);
              --romantic-panel-shadow:
                0 1px 0 var(--romantic-pearl-line) inset,
                0 22px 54px rgba(3, 1, 4, 0.40);
              --romantic-small-shadow:
                0 1px 0 var(--romantic-pearl-line) inset,
                0 10px 26px rgba(3, 1, 4, 0.34);
            }
          }

          html,
          body {
            max-width: 100%;
          }

          body {
            overflow-x: clip;
            background:
              radial-gradient(
                circle at 7% 3%,
                color-mix(in srgb, var(--romantic-blush) 42%, transparent),
                transparent 27rem
              ),
              radial-gradient(
                circle at 94% 16%,
                color-mix(in srgb, var(--romantic-powder-blue) 30%, transparent),
                transparent 31rem
              ),
              radial-gradient(
                circle at 48% 78%,
                color-mix(in srgb, var(--romantic-sage) 18%, transparent),
                transparent 38rem
              ),
              repeating-radial-gradient(
                circle at 0 0,
                rgba(121, 48, 96, 0.026) 0 0.55px,
                transparent 0.65px 4px
              ),
              linear-gradient(
                180deg,
                var(--paper),
                color-mix(in srgb, var(--paper) 88%, var(--romantic-cream))
              );
          }

          body::before,
          body::after {
            opacity: 0.29;
            filter: saturate(1.08) drop-shadow(0 5px 14px rgba(98, 32, 79, 0.08));
          }

          .site-header {
            background:
              linear-gradient(
                90deg,
                color-mix(in srgb, var(--header-bg) 92%, var(--romantic-aubergine)),
                var(--header-bg) 52%,
                color-mix(in srgb, var(--header-bg) 91%, var(--romantic-mauve))
              );
            border-bottom-color: color-mix(
              in srgb,
              var(--romantic-blush) 34%,
              var(--dark-line)
            );
            box-shadow:
              0 1px 0 rgba(255, 228, 244, 0.08) inset,
              0 10px 30px rgba(38, 10, 31, 0.16);
          }

          .brand-mark {
            filter:
              drop-shadow(0 0 9px rgba(255, 150, 208, 0.20))
              drop-shadow(0 4px 8px rgba(25, 5, 20, 0.20));
          }

          .brand strong {
            letter-spacing: -0.025em;
          }

          .brand small {
            color: color-mix(in srgb, var(--mint) 82%, var(--romantic-champagne));
            letter-spacing: 0.18em;
          }

          .site-nav a,
          .nav-group > summary,
          .menu-button {
            border: 1px solid transparent;
          }

          .site-nav a:hover,
          .site-nav a[aria-current="page"],
          .nav-group > summary:hover,
          .nav-group[open] > summary,
          .nav-group.contains-current > summary {
            border-color: rgba(255, 255, 255, 0.30);
            background:
              linear-gradient(
                135deg,
                color-mix(in srgb, var(--lime) 88%, white),
                color-mix(in srgb, var(--lime) 76%, var(--romantic-champagne))
              );
            box-shadow:
              0 1px 0 rgba(255, 255, 255, 0.72) inset,
              0 6px 14px rgba(34, 8, 28, 0.18);
          }

          h1,
          h2,
          h3 {
            text-wrap: balance;
          }

          h1 {
            font-size: clamp(2.55rem, 5.8vw, 5.55rem);
            line-height: 0.98;
          }

          h2 {
            line-height: 1.08;
          }

          p,
          .lede {
            text-wrap: pretty;
          }

          .eyebrow {
            width: fit-content;
            max-width: 100%;
            padding: 5px 10px 5px 7px;
            background:
              linear-gradient(
                90deg,
                color-mix(in srgb, var(--romantic-rosewater) 78%, transparent),
                transparent
              );
            border: 1px solid color-mix(
              in srgb,
              var(--romantic-dusty-rose) 27%,
              transparent
            );
            border-radius: 999px 18px 999px 18px;
          }

          .page-heading {
            position: relative;
            isolation: isolate;
          }

          .page-heading::before {
            position: absolute;
            z-index: -1;
            top: -22px;
            right: -24px;
            width: min(300px, 36vw);
            height: 150px;
            pointer-events: none;
            background:
              url("botanical-sprig-2026.svg") right center / contain no-repeat;
            content: "";
            opacity: 0.13;
            transform: rotate(-5deg);
          }

          :where(
            .home-ranking-list,
            .home-upcoming,
            .home-records,
            .home-explore,
            .panel,
            .stat-card,
            .bar-chart,
            .team-picker,
            .team-stats > div,
            .toolbar,
            .faq-tools,
            .faq-item,
            .method-contents,
            .method-details,
            .metric-grid > div,
            .analysis-disclosure,
            .ranking-card,
            .chart-shell,
            .team-model-details,
            .venue-profile,
            .comparison-selection,
            .comparison-team-row,
            .comparison-add-panel,
            .comparison-summary-table,
            .comparison-head-summary
          ) {
            border-color: color-mix(
              in srgb,
              var(--border) 68%,
              var(--romantic-dusty-rose)
            );
            box-shadow: var(--romantic-small-shadow);
          }

          body[data-route="home"] .home-intro {
            position: relative;
            overflow: hidden;
            background:
              url("botanical-sprig-2026.svg") calc(100% + 68px) -26px / 280px auto no-repeat,
              radial-gradient(
                circle at 84% 10%,
                color-mix(in srgb, var(--romantic-powder-blue) 27%, transparent),
                transparent 18rem
              ),
              radial-gradient(
                circle at 8% 96%,
                color-mix(in srgb, var(--romantic-sage) 22%, transparent),
                transparent 19rem
              ),
              linear-gradient(
                145deg,
                color-mix(in srgb, var(--navy) 88%, var(--romantic-aubergine)),
                color-mix(in srgb, var(--navy-2) 78%, var(--romantic-mauve))
              );
            border: 1px solid color-mix(
              in srgb,
              var(--romantic-dusty-rose) 40%,
              var(--border)
            );
            box-shadow:
              0 0 0 1px var(--romantic-pearl-line) inset,
              0 0 0 7px color-mix(
                in srgb,
                var(--romantic-rosewater) 25%,
                transparent
              ),
              var(--romantic-panel-shadow);
          }

          body[data-route="home"] .home-intro h1 {
            max-width: 12ch;
            color: color-mix(in srgb, var(--on-dark) 92%, var(--romantic-champagne));
          }

          body[data-route="home"] .home-intro .lede {
            max-width: 63ch;
            font-size: clamp(1.05rem, 1.35vw, 1.25rem);
          }

          body[data-route="home"] .home-facts {
            background:
              linear-gradient(
                145deg,
                color-mix(in srgb, var(--dark-panel) 86%, var(--romantic-mauve)),
                var(--dark-panel)
              );
            border: 1px solid color-mix(
              in srgb,
              var(--dark-panel-border) 74%,
              var(--romantic-blush)
            );
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.10) inset;
          }

          body[data-route="home"] .home-facts dd {
            color: color-mix(in srgb, var(--on-dark) 90%, var(--romantic-champagne));
          }

          .compact-heading h2::after,
          .section-heading h2::after {
            opacity: 0.92;
            filter: drop-shadow(0 2px 4px rgba(91, 30, 74, 0.14));
          }

          .home-explore-links a {
            position: relative;
            overflow: hidden;
            border: 1px solid color-mix(
              in srgb,
              var(--romantic-dusty-rose) 25%,
              var(--border)
            );
            background:
              linear-gradient(
                145deg,
                color-mix(in srgb, var(--accent-soft) 76%, var(--romantic-cream)),
                color-mix(in srgb, var(--accent-soft) 88%, var(--romantic-rosewater))
              );
            box-shadow: 0 1px 0 var(--romantic-pearl-line) inset;
          }

          .home-explore-links a::before {
            position: absolute;
            right: -26px;
            bottom: -29px;
            width: 92px;
            height: 92px;
            pointer-events: none;
            background:
              radial-gradient(
                ellipse at center,
                color-mix(in srgb, var(--romantic-blush) 42%, transparent) 0 16%,
                transparent 17%
              ) 0 0 / 30px 30px;
            content: "";
