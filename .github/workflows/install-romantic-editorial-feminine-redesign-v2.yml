            }

            body::before,
            body::after {
              opacity: 0.20;
              filter: saturate(1.12) drop-shadow(0 6px 17px rgba(0, 0, 0, 0.24));
            }

            body[data-route="home"] .home-intro {
              background:
                url("botanical-sprig-2026.svg") calc(100% + 68px) -26px / 280px auto no-repeat,
                radial-gradient(
                  circle at 84% 10%,
                  rgba(129, 165, 219, 0.09),
                  transparent 18rem
                ),
                radial-gradient(
                  circle at 8% 96%,
                  rgba(112, 182, 144, 0.07),
                  transparent 19rem
                ),
                linear-gradient(
                  145deg,
                  color-mix(in srgb, var(--navy) 90%, #240c1d),
