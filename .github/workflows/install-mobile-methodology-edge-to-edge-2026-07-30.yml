name: Install mobile Methodology edge-to-edge tables

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-mobile-methodology-edge-to-edge-2026-07-30
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm the audited stylesheet
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          css_path = Path("public/assets/styles.css")
          wanted = "68629aab62298bd6cb65840a9847d02a3ec7860d"
          if not css_path.is_file():
              raise SystemExit(f"Required file is missing: {css_path}")
          actual = subprocess.check_output(
              ["git", "hash-object", str(css_path)],
              text=True,
          ).strip()
          if actual != wanted:
              raise SystemExit(
                  "public/assets/styles.css has changed since this "
                  f"Methodology-only fix was audited ({actual} != {wanted})."
              )

          test_path = Path(
              "tests/test_mobile_methodology_edge_to_edge.py"
          )
          if test_path.exists():
              raise SystemExit(
                  "The mobile Methodology edge-to-edge test already exists."
              )
          PY

      - name: Install the Methodology-only mobile fix
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import textwrap
          from pathlib import Path

          public = Path("public")
          css_path = public / "assets" / "styles.css"
          test_path = Path(
              "tests/test_mobile_methodology_edge_to_edge.py"
          )
          marker = (
              "Mobile Methodology tables edge-to-edge 2026-07-30."
          )
          next_marker = "Mobile Records country width 2026-07-30."

          css = css_path.read_text(encoding="utf-8")
          if marker in css:
              raise SystemExit(
                  "The mobile Methodology edge-to-edge fix is already "
                  "installed."
              )
          if css.count(next_marker) != 1:
              raise SystemExit(
                  "The expected mobile Records finishing layer is missing "
                  "or duplicated."
              )

          layer = r'''

          /*
           * Mobile Methodology tables edge-to-edge 2026-07-30.
           *
           * The Methodology page is inset by 12px on each side on phones.
           * Its two parameter tables deliberately reclaim exactly that 24px,
           * meeting both viewport edges without affecting any other content.
           */
          @media (max-width: 720px) {
            body[data-route="methodology"] .methodology-page
            > .method-section > .table-shell {
              box-sizing: border-box;
              width: calc(100% + 24px);
              max-width: none;
              margin-inline: -12px;
              border-right: 0;
              border-left: 0;
              border-radius: 0;
            }
          }
          '''
          insertion = "/*\n * " + next_marker
          if css.count(insertion) != 1:
              raise SystemExit(
                  "Could not locate the Records layer insertion point."
              )
          css = css.replace(
              insertion,
              textwrap.dedent(layer).lstrip() + "\n" + insertion,
              1,
          )
          css_path.write_text(css, encoding="utf-8")

          test_source = r'''
          from __future__ import annotations

          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          CSS_PATH = ROOT / "public" / "assets" / "styles.css"
          MARKER = (
              "Mobile Methodology tables edge-to-edge 2026-07-30."
          )
          NEXT_MARKER = "Mobile Records country width 2026-07-30."


          class MobileMethodologyEdgeToEdgeTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.css = CSS_PATH.read_text(encoding="utf-8")
                  if MARKER not in cls.css:
                      raise AssertionError(
                          "Mobile Methodology edge-to-edge marker missing."
                      )
                  start = cls.css.index(MARKER)
                  end = cls.css.index(NEXT_MARKER, start)
                  cls.layer = cls.css[start:end]

              def test_layer_is_unique_ordered_and_balanced(self) -> None:
                  self.assertEqual(self.css.count(MARKER), 1)
                  self.assertEqual(self.css.count(NEXT_MARKER), 1)
                  self.assertLess(
                      self.css.index(MARKER),
                      self.css.index(NEXT_MARKER),
                  )
                  depth = 0
                  for character in self.css:
                      if character == "{":
                          depth += 1
                      elif character == "}":
                          depth -= 1
                      self.assertGreaterEqual(depth, 0)
                  self.assertEqual(depth, 0)

              def test_only_methodology_tables_are_targeted(self) -> None:
                  for expected in (
                      "@media (max-width: 720px)",
                      'body[data-route="methodology"]',
                      ".methodology-page",
                      "> .method-section > .table-shell",
                  ):
                      self.assertIn(expected, self.layer)
                  for forbidden in (
                      'body[data-route="records"]',
                      'body[data-route="faq"]',
                      'body[data-route="about"]',
                      ".formula",
                      ".method-details",
                  ):
                      self.assertNotIn(forbidden, self.layer)

              def test_mobile_tables_reclaim_both_page_insets(self) -> None:
                  for expected in (
                      "width: calc(100% + 24px);",
                      "max-width: none;",
                      "margin-inline: -12px;",
                      "border-right: 0;",
                      "border-left: 0;",
                      "border-radius: 0;",
                  ):
                      self.assertIn(expected, self.layer)


          if __name__ == "__main__":
              unittest.main()
          '''
          test_path.write_text(
              textwrap.dedent(test_source).lstrip(),
              encoding="utf-8",
          )

          revision = hashlib.sha256(
              css_path.read_bytes()
          ).hexdigest()[:12]
          html_paths = sorted(public.rglob("*.html"))
          routes = sorted(public.rglob("index.html"))
          if len(routes) != 260:
              raise SystemExit(
                  f"Unexpected route count: {len(routes)} (expected 260)."
              )

          changed_html = 0
          for html_path in html_paths:
              html = html_path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'assets/styles\.css(?:\?v=[^"\']*)?',
                  f"assets/styles.css?v={revision}",
                  html,
              )
              if updated != html:
                  html_path.write_text(updated, encoding="utf-8")
                  changed_html += 1
          if changed_html == 0:
              raise SystemExit("No HTML stylesheet revisions were updated.")
          PY

      - name: Verify only the focused change
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )
          changed = set()
          for line in status.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          required = {
              "public/assets/styles.css",
              "tests/test_mobile_methodology_edge_to_edge.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(
                  "Expected change is missing: " + ", ".join(missing)
              )
          unexpected = sorted(
              path
              for path in changed
              if path not in required
              and not (
                  path.startswith("public/")
                  and path.endswith(".html")
              )
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: " + ", ".join(unexpected)
              )
          PY

          python -m unittest discover \
            --start-directory tests \
            --pattern "test_mobile_methodology_edge_to_edge.py" \
            --verbose
          python -m unittest discover \
            --start-directory tests \
            --pattern "test_mobile_records_country_width.py" \
            --verbose

      - name: Commit and trigger Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public \
            tests/test_mobile_methodology_edge_to_edge.py
          if git diff --cached --quiet; then
            echo "The mobile Methodology table fix is installed."
            exit 0
          fi
          git commit -m "fix: extend Methodology tables to mobile edges"
          git push
