name: Repair tournament presentation and scheduled deployment

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tournament-presentation-scheduled-deploy-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Install tested repair
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode and apply the repair
        shell: bash
        env:
          REPAIR_PATCH_B64: ""
          REPAIR_PATCH_SHA256: "9c72fd123b99791d8dcac897d984851647c5a80cbf9ca03386cf94060c42c64c"
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main
          patch_file="$RUNNER_TEMP/tournament-ui-ci-repair.patch"
          printf '%s' "$REPAIR_PATCH_B64" \
            | base64 --decode \
            | gzip --decompress > "$patch_file"
          printf '%s  %s\n' "$REPAIR_PATCH_SHA256" "$patch_file" \
            | sha256sum --check
          git apply --check "$patch_file"
          git apply --index --3way "$patch_file"
          git diff --cached --check

      - name: Run focused and permanent regression checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/validate_live_replay.py \
            tests/test_tournament_ui_ci_repair.py
          node --check public/assets/app.js
          python -m unittest tests.test_tournament_ui_ci_repair -v
          git diff --cached --check

      - name: Commit the repair and remove this installer
        shell: bash
        run: |
          set -Eeuo pipefail
          installer="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          installer="${installer%@*}"
          case "$installer" in
            .github/workflows/*.yml|.github/workflows/*.yaml) ;;
            *)
              echo "::error::Could not identify this installer safely: $installer"
              exit 1
              ;;
          esac
          test -f "$installer"
          git rm -- "$installer"

          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              "$installer"|\
              .github/workflows/pages.yml|\
              README.md|\
              public/assets/app.js|\
              public/assets/styles.css|\
              public/index.html|\
              public/*/index.html|\
              scripts/validate_live_replay.py|\
              tests/test_build.py|\
              tests/test_romantic_editorial_feminine_tablet_v8.py|\
              tests/test_tournament_title_chances.py|\
              tests/test_tournament_ui_ci_repair.py)
                ;;
              *)
                echo "::error::Unexpected staged path: $path"
                exit 1
                ;;
            esac
          done

          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify tournament chances and live-source validation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger validated Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
