name: Install final consistency polish

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-final-consistency-polish
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the audited pearl baseline and lock the identity
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "7fd661819053f53c6254280073ae0674f9ea8ebdca77b787040114783f519409"
          test "$(sha256sum public/assets/app.js | cut -d' ' -f1)" = \
            "94140b04942cbbfe4c7d83ef3a22eb814a58ec52656d3849d4534467dd67e00e"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "a794d697aa56974775cd1acc9b31bd0ce930540e9799d7abe119979d2466439b"
          grep -Fq \
            "Pearl vanity unification finale." \
            public/assets/styles.css
          test \
            "$(grep -Fc "Final consistency polish." \
              public/assets/styles.css || true)" \
            -eq 0

          route_count="$(find public -type f -name index.html | wc -l)"
          test "$route_count" -eq 260

          python - <<'PY'
          from pathlib import Path

          routes = sorted(Path("public").rglob("index.html"))
          assert len(routes) == 260
          reference = "assets/styles.css?v=7fd661819053"
          for route in routes:
              html = route.read_text(encoding="utf-8")
              assert html.count(reference) == 1, route
          PY

          sha256sum --check <<'SHA256'
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon-2026.svg
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon.svg
          0f0bc225dd59f4b5b840b660f20149c61c39536546452acfd807be57807e61d7  public/favicon-2026.ico
          0f0bc225dd59f4b5b840b660f20149c61c39536546452acfd807be57807e61d7  public/favicon.ico
          cb6431e450e087b89060fe432246563fbf75f7b0dfd77204fcda95acfa7b6d86  public/apple-touch-icon-2026.png
          8cdb242ebbc757fcfe7ba37b707dda392fc55b618342ddf927c030d1dd8c2987  public/icon-192-2026.png
          cc648859f5f6dbebcbb0fa862b4e510c2212137df76659cba517f182d699c38b  public/icon-512-2026.png
          87d39efb6f49ba8725a742b99bdbada6018e2ca7aa631597e1627667c6cd74a6  public/icon-maskable-2026.svg
          ddd65437e8c70d129eb53ad362a50f9740af54335c05f05fdabd5d9573ca8558  public/social-card.svg
          0a96079b8755dae00361ce74a76a3e0fb2f0d6d346ee2bab66639ed2fd700b73  public/social-card.png
          76f0094e761fd804591ff44320648ec8ef42a9139f193c23b3f4eb273a560364  public/site.webmanifest
          SHA256

