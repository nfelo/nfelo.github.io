name: Install transient geometry and honest overflow repair v12

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nfelo-transient-geometry-honest-overflow-v12
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the reproducible repository runtime
        run: python -m pip install --requirement requirements.txt

      - name: Apply, audit, self-delete, publish and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          Q12_RUNTIME_SHA256: "61763c0124edf2fd249aadaf7a66e57556d216b5bc08ee5b1600a917609675e2"
          Q12_PATCH_SHA256: "6354c723a3e4e3192abbe7c55fa8a5e5655be9f242ed232e0d9092a5afcfeaa0"
