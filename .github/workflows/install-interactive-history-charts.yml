    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and install the audited release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "nfelo/nfelo.github.io" ]]; then
            echo "::error::This installer is only for nfelo/nfelo.github.io."
            exit 1
          fi

          check_release_path() {
            local path="$1"
            local original_hash="$2"
            local release_hash="$3"
            local current_hash
            current_hash="$(sha256sum "$path" | cut -d' ' -f1)"
            if [[ "$current_hash" != "$original_hash" && "$current_hash" != "$release_hash" ]]; then
              echo "::error file=$path::The file has changed since this release was audited; refusing to overwrite it."
              exit 1
            fi
          }

          check_release_path \
            public/assets/app.js \
            86df21899efb27fac78d0a2c34fc6aa36113f80d48709974a80678ab6fd80d94 \
            813615a3484ddbe322279923220b385fa64e2561f2aa6a1bc0cd91b0c9c28806
          check_release_path \
            public/assets/styles.css \
            d862ba6317eb9b7b232be0c6d2b1d9671efb164fc90f4ddee7056ab0e3986b10 \
            cd795106e0dd35acf369b349da7d863df180cdacd012c231c0fbac0cb6625791
          check_release_path \
            tests/test_build.py \
            86aab9052ffa32ea61ddfd7fc8fe1b7ae1bc21f42842a97ea4ec7e1d2438efab \
            a5e1d7c252c5ac80c141645017a888396a03c33445601b497e8c61e4ce32e717

          archive="$RUNNER_TEMP/nfelo-interactive-history-charts.tar.xz"
          printf '%s' "$UPDATE_ARCHIVE" \
            | tr -d '[:space:]' \
            | base64 --decode > "$archive"
          echo "a91d51f76184f99ebee34ed15c11cbc4fabbc84058b894b81adc8d3178ef0ec6  $archive" \
            | sha256sum --check

          expected_contents="$(
            printf '%s\n' \
              public/assets/app.js \
              public/assets/styles.css \
              tests/test_build.py \
              | sort
          )"
          actual_contents="$(
            tar -tJf "$archive" \
              | sed 's#^\./##' \
              | sort
          )"
          if [[ "$actual_contents" != "$expected_contents" ]]; then
            echo "::error::Unexpected files in the release archive."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_contents" "$actual_contents"
            exit 1
          fi

          tar -xJf "$archive"
          echo "813615a3484ddbe322279923220b385fa64e2561f2aa6a1bc0cd91b0c9c28806  public/assets/app.js" \
            | sha256sum --check
          echo "cd795106e0dd35acf369b349da7d863df180cdacd012c231c0fbac0cb6625791  public/assets/styles.css" \
            | sha256sum --check
          echo "a5e1d7c252c5ac80c141645017a888396a03c33445601b497e8c61e4ce32e717  tests/test_build.py" \
            | sha256sum --check

          while IFS= read -r changed_path; do
            case "$changed_path" in
              public/assets/app.js|public/assets/styles.css|tests/test_build.py)
                ;;
              *)
                echo "::error file=$changed_path::The installer changed an unexpected file."
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          git diff --check -- \
            public/assets/app.js \
            public/assets/styles.css \
            tests/test_build.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild and test in an isolated copy
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/nfelo-chart-validation"
          mkdir -p "$validation_dir"
          rsync -a \
            --exclude=.git \
            --exclude=__pycache__ \
            ./ "$validation_dir/"
          cd "$validation_dir"
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js

      - name: Commit the three validated files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/assets/app.js \
            public/assets/styles.css \
            tests/test_build.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The interactive charts are already installed."
          else
            git commit -m "Improve interactive rating history charts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the normal Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
          {
            echo "## Interactive history charts installed"
            echo
            echo "All model, build and browser checks passed."
            echo "The normal Pages workflow has been started to publish the site."
          } >> "$GITHUB_STEP_SUMMARY"
