    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository and presentation baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nfelo/nfelo.github.io"
          test "$GITHUB_REF_NAME" = "main"
          test ! -e tests/test_presentation.py
          cat > "$RUNNER_TEMP/nfelo-presentation-before.sha256" <<'EOF'
          8f8891c1ffee76d0fd868e1e9db4038ba0d989af9a4c677ebedfd2b59fac8948  config/404.html
          6be8afb7b626f83467db871ff1c5c8aa8106ab61104c111150b5f218fa428919  public/assets/styles.css
          caf7cc7eb55e01c9c9b41d665e4079beef87180bf9eb9eb018e419b34fd1fa4c  public/index.html
          e1e0202bf271cd275e2804df073bdb7da5719ae5e9f2315b5e7a7a34dfa25582  public/site.webmanifest
          4fa1ff0bc83b8ffe4fe3705a0175bbfe5468a092295c384930edf803cca420dd  tests/test_build.py
          b2b3f939918f77e71e7b90555333dabe3ad838d7b2b15671b8e6b7aecde51bb7  public/favicon-2026.svg
          b2b3f939918f77e71e7b90555333dabe3ad838d7b2b15671b8e6b7aecde51bb7  public/favicon.svg
          1170b601fee990e59f7eefb1fe5b1227387d5ebc1a22a2e3ea26247f75f7ea97  public/favicon-2026.ico
          1170b601fee990e59f7eefb1fe5b1227387d5ebc1a22a2e3ea26247f75f7ea97  public/favicon.ico
          5f702b0dc3aa274b53b869ead8fe41259b0ae8fa5f3c1955b1d98d937f904837  public/apple-touch-icon-2026.png
          a0b76805daa732a19c25931954adb6699d85afe8f5089efe4940f9ca7673af6f  public/icon-192-2026.png
          4ff197e423cb9fef10f990df77f05db48cd138563d0eaefd253558eeb12ebfcd  public/icon-512-2026.png
          e441905b066cdfad19fbb40f9cdc7873ae4aa77eb9c06bf56383af648e36c9a7  public/social-card.svg
          b18bd26fae73e25307ddb94f6f13397a36668f990c77d762aa9593a4ee1ba610  public/social-card.png
          EOF
          sha256sum --check \
            "$RUNNER_TEMP/nfelo-presentation-before.sha256"
          test "$(find public -name index.html -type f | wc -l)" -eq 260

      - name: Decode and apply the presentation sources
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CORE_ARCHIVE" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$RUNNER_TEMP/nfelo-feminine-core.patch.xz"
          echo "c7e76d90845c8f3c3b414a344863fda29bf362d2482c68670a505383500cf99e  $RUNNER_TEMP/nfelo-feminine-core.patch.xz" \
            | sha256sum --check
          xz --test "$RUNNER_TEMP/nfelo-feminine-core.patch.xz"
          xz --decompress --stdout \
            "$RUNNER_TEMP/nfelo-feminine-core.patch.xz" \
            > "$RUNNER_TEMP/nfelo-feminine-core.patch"
          git apply --check \
            "$RUNNER_TEMP/nfelo-feminine-core.patch"
          git apply --whitespace=error \
            "$RUNNER_TEMP/nfelo-feminine-core.patch"

      - name: Set up the small image renderer
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate browser, Apple, Android and social artwork
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RENDERER_ARCHIVE" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$RUNNER_TEMP/render-nfelo-brand.py.xz"
          echo "b35ffecbfe431650fefdceae1922c3752cd37b0d19a8cc06e403411e1dde5697  $RUNNER_TEMP/render-nfelo-brand.py.xz" \
            | sha256sum --check
          xz --test "$RUNNER_TEMP/render-nfelo-brand.py.xz"
          xz --decompress --stdout \
            "$RUNNER_TEMP/render-nfelo-brand.py.xz" \
            > "$RUNNER_TEMP/render-nfelo-brand.py"
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "Pillow==12.2.0"
          python "$RUNNER_TEMP/render-nfelo-brand.py" \
            --public public

      - name: Synchronise presentation metadata across every route
        shell: bash
        run: |
          set -euo pipefail
          stylesheet_hash="$(
            sha256sum public/assets/styles.css | cut -c1-12
          )"
          test "$stylesheet_hash" = "513c8a9c4585"
          find public -name index.html -type f -print0 \
            | xargs -0 perl -pi -e '
              s|    <meta name="theme-color" content="#301032">|    <meta name="theme-color" content="#43133c" media="(prefers-color-scheme: light)">\n    <meta name="theme-color" content="#10070e" media="(prefers-color-scheme: dark)">|g;
              s|href="favicon-2026\.ico"|href="favicon-2026.ico?v=20260727"|g;
              s|href="favicon-2026\.svg"|href="favicon-2026.svg?v=20260727"|g;
              s|href="apple-touch-icon-2026\.png"|href="apple-touch-icon-2026.png?v=20260727"|g;
              s|href="site\.webmanifest\?v=20260723"|href="site.webmanifest?v=20260727"|g;
              s|https://nfelo\.github\.io/social-card\.png"|https://nfelo.github.io/social-card.png?v=20260727"|g;
              s|assets/styles\.css\?v=6be8afb7b626|assets/styles.css?v=513c8a9c4585|g;
            '
          python - <<'PY'
          from pathlib import Path

          marker = "styles.css?v=513c8a9c4585"
          routes = sorted(Path("public").rglob("index.html"))
          missing = [
              str(path)
              for path in routes
              if marker not in path.read_text(encoding="utf-8")
          ]
          if len(routes) != 260 or missing:
              raise SystemExit(
                  "Presentation metadata was not synchronised: "
                  f"routes={len(routes)}, missing={missing[:5]}"
              )
          print("All 260 routes use the new presentation.")
          PY

      - name: Verify exact presentation sources
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nfelo-presentation-after.sha256" <<'EOF'
          c911b9ad1caff9e8157141cde6c48ff5cd5d1b44d5c81628ce122f74a4293e9e  config/404.html
          513c8a9c4585711d4fdabefd554868df0b9398d5109c208a80d381a1b6774ec6  public/assets/styles.css
          fdd95faa0b8dd7a80fa10ed805171878aa487cebf7b3c2de25c0faaa39fb18a1  public/index.html
          83b206454f276b1bc8247a06fe7f1a6bf9ada046213957bb6e6761804e3caf55  public/site.webmanifest
          aae4df24d2cf4467e10b4c798814a6812c3a67a3fb0e7cc00866af10ff2c0aef  tests/test_build.py
          21a9665c539d35945ee445fed4eb309ac3443533d3ec9f40b1a5e10f2549476d  tests/test_presentation.py
          abfd5ac4e7944b5351ff4c19e065adff9b708037b656d773616ab00af6862ee8  public/favicon-2026.svg
          abfd5ac4e7944b5351ff4c19e065adff9b708037b656d773616ab00af6862ee8  public/favicon.svg
          05006359cd42d80da23541a0c85a58a173a149200aa4d06dc2fc90bd05533d01  public/social-card.svg
          EOF
          sha256sum --check \
            "$RUNNER_TEMP/nfelo-presentation-after.sha256"

      - name: Run fast presentation-only checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests \
            --pattern test_presentation.py \
            --verbose
          node --check public/assets/app.js
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("tests/test_build.py"),
              Path("tests/test_presentation.py"),
          ):
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
          print("Python syntax checks passed.")
          PY
          git diff --check

      - name: Verify the presentation-only change boundary
        shell: bash
        run: |
          set -euo pipefail
          git add --intent-to-add tests/test_presentation.py
          git diff --name-only \
            > "$RUNNER_TEMP/nfelo-presentation-paths.txt"
          changed_count=0
          while IFS= read -r path; do
            changed_count=$((changed_count + 1))
            case "$path" in
              config/404.html|public/index.html|public/assets/styles.css|public/site.webmanifest|public/favicon-2026.svg|public/favicon.svg|public/favicon-2026.ico|public/favicon.ico|public/apple-touch-icon-2026.png|public/icon-192-2026.png|public/icon-512-2026.png|public/social-card.svg|public/social-card.png|tests/test_build.py|tests/test_presentation.py|public/*/index.html|public/team/*/index.html)
                ;;
              *)
                echo "::error::Unexpected changed path: $path"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/nfelo-presentation-paths.txt"
          test "$changed_count" -eq 274
          git diff --exit-code -- \
            README.md \
            docs \
            scripts \
            source \
            public/assets/app.js \
            config/elo_matches.json \
            config/forecast_layer.json \
            config/tournament_classification.json \
            config/venue_effects.json

      - name: Commit the presentation and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/install-feminine-presentation.yml \
            .github/workflows/install-dainty-site-presentation.yml
          git add -- \
            config/404.html \
            public \
            tests/test_build.py \
            tests/test_presentation.py
          git diff --cached --check
          git commit -m \
            "Refine the site presentation"
          if ! git push origin HEAD:main; then
            echo "Main moved during validation; rebasing once."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write installation summary
        if: success()
        run: |
          {
            echo "## Refined feminine presentation installed"
            echo
            echo "- Graceful display type with sturdy body text"
            echo "- Lining tabular numerals throughout data views"
            echo "- Rose, lilac and aubergine light/dark themes"
            echo "- Petal-inspired shared logo and decorative details"
            echo "- Regenerated browser, Apple, Android/PWA and social artwork"
            echo "- All 260 routes synchronised"
            echo "- Five fast presentation checks passed"
            echo
            echo "No rating, probability, match-data or public-copy code changed."
            echo "The normal Pages workflow will rebuild and deploy the site."
          } >> "$GITHUB_STEP_SUMMARY"
