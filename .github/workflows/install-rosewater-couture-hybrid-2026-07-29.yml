name: Install rosewater couture hybrid

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-rosewater-couture-hybrid
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify compatible presentation base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          compatible = {
              "public/assets/styles.css": {
                  "57fdd4caedb0da3c14209ffec079273521d1b19b",
                  "efb52886eae3061da686c8ef6820b87ef20101d1",
              },
              "config/404.html": {
                  "60e1fe3c13a3f0ad610cf27a4af3840de089a27e",
                  "1b811ef6eaa609f35c9b60088ed0072416526703",
              },
              "tests/test_luminous_fairytale_redesign.py": {
                  "82abd01afbcb24c70f933760c604a536722752d5",
                  "ea2e5eede0de2b100f48db45cd9fb4d2ec9cae39",
              },
          }
          problems = []
          for path, allowed in compatible.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", path],
                  text=True,
              ).strip()
              if actual not in allowed:
                  problems.append(f"{path}: unexpected blob {actual}")
          if problems:
              raise SystemExit(
                  "The presentation base has changed; refusing an unsafe "
                  "partial install.\n" + "\n".join(problems)
              )
          print("Compatible presentation base verified.")
          PY

