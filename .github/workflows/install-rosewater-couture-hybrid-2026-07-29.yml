      - name: Verify presentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          exact = {
              "config/404.html",
              "public/404.html",
              "public/assets/styles.css",
              "tests/test_luminous_fairytale_redesign.py",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True,
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()
          unexpected = []
          for path in changed:
              route = (
                  path == "public/index.html"
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
              )
              if path not in exact and not route:
                  unexpected.append(path)
          unexpected.extend(untracked)
          if unexpected:
              raise SystemExit(
                  "Presentation install changed unexpected files:\n"
                  + "\n".join(unexpected)
              )
          if not changed:
              print("Presentation is already installed.")
          else:
              print(
                  "Presentation-only scope verified "
                  f"({len(changed)} generated or authored files)."
              )
          PY

      - name: Commit the guarded release
        id: commit
        shell: bash
        env:
          INSTALLER: .github/workflows/install-rosewater-couture-hybrid-2026-07-29.yml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f -- "$INSTALLER"
          git add -- \
            config/404.html \
            public \
            tests/test_luminous_fairytale_redesign.py \
            "$INSTALLER"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing needed committing."
          else
            git commit -m \
              "style: install rosewater couture hybrid [skip ci]"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the installed presentation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
