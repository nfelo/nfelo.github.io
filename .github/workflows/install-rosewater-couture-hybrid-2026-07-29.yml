          python - <<'PY'
          import subprocess

          expected = {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_luminous_fairytale_redesign.py",
          }
          listed = set(
              subprocess.check_output(
                  [
                      "tar",
