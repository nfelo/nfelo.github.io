              "tests/test_luminous_fairytale_redesign.py":
                  "ea2e5eede0de2b100f48db45cd9fb4d2ec9cae39",
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", path],
                  text=True,
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"{path}: expected {wanted}, found {actual}"
                  )
          print("Exact audited files restored.")
          PY

      - name: Install reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild static routes
        run: |
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public

      - name: Verify the complete site
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          css = Path("public/assets/styles.css").read_text(
              encoding="utf-8"
          )
          depth = 0
          for character in css:
              if character == "{":
                  depth += 1
              elif character == "}":
                  depth -= 1
              if depth < 0:
                  raise SystemExit("CSS closes a block before it opens.")
          if depth:
              raise SystemExit(f"CSS has {depth} unclosed block(s).")
          print("CSS structure is balanced.")
          PY

