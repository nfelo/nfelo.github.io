                      "/tmp/nfelo-rosewater-couture-hybrid.tar.xz",
                  ],
                  text=True,
              ).splitlines()
          )
          if listed != expected:
              raise SystemExit(
                  "Unexpected release contents: "
                  f"missing={sorted(expected - listed)}, "
                  f"extra={sorted(listed - expected)}"
              )
          PY
          tar -xJf /tmp/nfelo-rosewater-couture-hybrid.tar.xz
          python - <<'PY'
          import subprocess

          expected = {
              "public/assets/styles.css":
                  "efb52886eae3061da686c8ef6820b87ef20101d1",
              "config/404.html":
