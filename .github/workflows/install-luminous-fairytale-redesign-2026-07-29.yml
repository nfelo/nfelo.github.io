      - name: Verify accessibility, presentation and browser boot
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest \
            tests.test_presentation \
            tests.test_actual_final_presentation \
            tests.test_couture_alphabet \
            tests.test_luminous_fairytale_redesign \
            --verbose
          node --check public/assets/app.js
          node scripts/smoke_browser_boot.js public
          git diff --check
          sha256sum --check \
            "$RUNNER_TEMP/luminous-protected.before"

      - name: Enforce presentation-only scope
        shell: bash
        run: |
          set -euo pipefail

          installer_path=".github/workflows/install-luminous-fairytale-redesign-2026-07-29.yml"
          rm -- "$installer_path"

          python - <<'PY'
          from __future__ import annotations

          import subprocess


          installer = (
              ".github/workflows/"
              "install-luminous-fairytale-redesign-2026-07-29.yml"
          )
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          changed.update(
              subprocess.check_output(
                  [
                      "git",
                      "ls-files",
                      "--others",
                      "--exclude-standard",
                  ],
                  text=True,
              ).splitlines()
          )
          exact = {
              installer,
              "config/404.html",
              "public/404.html",
              "public/assets/styles.css",
              "public/favicon-2026.svg",
              "public/favicon.svg",
              "public/icon-maskable-2026.svg",
              "public/social-card.svg",
              "public/apple-touch-icon-2026.png",
              "public/icon-192-2026.png",
              "public/icon-512-2026.png",
              "public/social-card.png",
              "public/favicon-2026.ico",
              "public/favicon.ico",
              "public/site.webmanifest",
              "tests/test_build.py",
              "tests/test_presentation.py",
              "tests/test_couture_alphabet.py",
              "tests/test_luminous_fairytale_redesign.py",
          }

          def allowed(path: str) -> bool:
              return (
                  path in exact
                  or path == "public/index.html"
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
              )

          unexpected = sorted(
              path for path in changed if not allowed(path)
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: "
                  + ", ".join(unexpected)
              )
          route_changes = [
              path
              for path in changed
              if (
                  path == "public/index.html"
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
              )
          ]
          if len(route_changes) < 250:
              raise SystemExit(
                  "Not every clean route received the new cache keys."
              )
          PY

          git diff --check

      - name: Commit and publish the redesign
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            .github/workflows/install-luminous-fairytale-redesign-2026-07-29.yml \
            config/404.html \
            public \
            tests

          git commit -m \
            "style: install luminous fairytale redesign [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start the normal Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatched=false
          for attempt in 1 2 3; do
            if gh workflow run pages.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field refresh_source=false \
              --field full_refresh=false; then
              dispatched=true
              break
            fi
            sleep 5
          done

          if [ "$dispatched" != "true" ]; then
            echo "::error::The redesign was committed, but Pages could not be started."
            echo "::error::Run 'Refresh ratings and deploy Pages' manually with source refresh off."
            exit 1
          fi

          {
            echo "### Luminous fairytale redesign installed"
            echo
            echo "- No. 1 is no longer styled like a selected item."
            echo "- Readability and responsive presentation were overhauled."
            echo "- Browser, Apple, Android and social branding now match."
            echo "- Model, data and application logic were not changed."
            echo "- The installer removed itself and started Pages."
          } >> "$GITHUB_STEP_SUMMARY"
