name: Install luminous fairytale redesign

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nfelo-luminous-fairytale-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the exact presentation base
        shell: bash
        run: |
          set -euo pipefail

          installer_path=".github/workflows/install-luminous-fairytale-redesign-2026-07-29.yml"
          test -f "$installer_path" || {
            echo "::error::Save this workflow at $installer_path before running it."
            exit 1
          }
          test "$(git branch --show-current)" = "main" || {
            echo "::error::This installer must run on main."
            exit 1
          }

          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path


          old = {
              "public/assets/styles.css":
                  "4d702a6e3b48100c067367f9a915e9a494fff62c",
              "config/404.html":
                  "02f49b5cdca01e9e1b238083ae6a0f2c4abea30f",
              "public/favicon-2026.svg":
                  "40ddd1238e980069fb59d138b6c44618d7036304",
