      - name: Install redesign, identity and cache versions
        shell: bash
        run: |
          set -euo pipefail

          cp -a "$RUNNER_TEMP/luminous-release/." .
          cp -- config/404.html public/404.html

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path


          root = Path.cwd()
          public = root / "public"
          version = "20260729l1"
          styles = public / "assets" / "styles.css"
          styles_hash = hashlib.sha256(
              styles.read_bytes()
          ).hexdigest()[:12]
          if styles_hash != "6eed142c5ada":
              raise SystemExit(
                  "Unexpected installed stylesheet hash: "
                  f"{styles_hash}"
              )

          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise SystemExit(
                  f"Only {len(routes)} clean routes were found."
              )

          asset_names = (
              "favicon-2026.ico",
              "favicon-2026.svg",
              "apple-touch-icon-2026.png",
              "site.webmanifest",
              "social-card.png",
          )
          for route in routes:
              html = route.read_text(encoding="utf-8")
              html, count = re.subn(
                  r"assets/styles\.css\?v=[0-9a-f]{12}",
                  f"assets/styles.css?v={styles_hash}",
                  html,
              )
              if count != 1:
                  raise SystemExit(
                      f"{route} has {count} stylesheet references."
                  )
              for name in asset_names:
                  pattern = re.compile(
                      rf"{re.escape(name)}\?v=[^\"']+"
                  )
                  html, count = pattern.subn(
                      f"{name}?v={version}",
                      html,
                  )
                  if count < 1:
                      raise SystemExit(
                          f"{route} has no {name} reference."
                      )
              html, count = re.subn(
                  (
                      r'<meta name="theme-color" '
                      r'content="#[0-9a-fA-F]{6}" '
                      r'media="\(prefers-color-scheme: light\)">'
                  ),
                  (
                      '<meta name="theme-color" content="#3b1232" '
                      'media="(prefers-color-scheme: light)">'
                  ),
                  html,
              )
              if count != 1:
                  raise SystemExit(
                      f"{route} has {count} light theme colours."
                  )
              route.write_text(html, encoding="utf-8")

              checks = (
                  f"assets/styles.css?v={styles_hash}",
                  f"favicon-2026.svg?v={version}",
                  f"apple-touch-icon-2026.png?v={version}",
                  'content="#3b1232" '
                  'media="(prefers-color-scheme: light)"',
              )
              for marker in checks:
                  if marker not in html:
                      raise SystemExit(
                          f"{route} is missing {marker}."
                      )
          PY

          python - <<'PY'
          from __future__ import annotations

          import subprocess


          expected = {
              "public/assets/styles.css":
                  "57fdd4caedb0da3c14209ffec079273521d1b19b",
              "config/404.html":
                  "60e1fe3c13a3f0ad610cf27a4af3840de089a27e",
              "public/404.html":
                  "60e1fe3c13a3f0ad610cf27a4af3840de089a27e",
              "public/favicon-2026.svg":
                  "d847990e13b051c17491c318699926176979ab90",
