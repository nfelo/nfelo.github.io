                  "80d2ac1112c356efdf56e5d88758a5cd7c21c5ef",
              "public/apple-touch-icon-2026.png":
                  "99cbe80ef87c14c07972313bd71a07cb2a506efc",
              "public/icon-192-2026.png":
                  "c41ed748708605f3fc48ef8f7020cfa44669e340",
              "public/icon-512-2026.png":
                  "8a53a923423a63863534c1206280e43d0babe936",
              "public/social-card.png":
                  "a486c9eb211288d2b33226f889d24b4037ad72e1",
              "public/favicon-2026.ico":
                  "a5d5015b255260bcba01e3238bcaa32d209f20f7",
              "public/favicon.ico":
                  "a5d5015b255260bcba01e3238bcaa32d209f20f7",
              "public/site.webmanifest":
                  "d8419e59e68ac1e82f0b846ed5eeb5617b430257",
              "tests/test_build.py":
                  "1de38ebaed722d7fa9e51016c410d9975aafd411",
              "tests/test_presentation.py":
                  "c39b78027b29d299de4ec3392f9a04222fe26a5f",
              "tests/test_couture_alphabet.py":
                  "d3cd826f4ad5da609c2014f67481c9bfaba2ed62",
          }
          new = {
              "public/assets/styles.css":
                  "57fdd4caedb0da3c14209ffec079273521d1b19b",
              "config/404.html":
                  "60e1fe3c13a3f0ad610cf27a4af3840de089a27e",
              "public/favicon-2026.svg":
                  "d847990e13b051c17491c318699926176979ab90",
              "public/favicon.svg":
                  "d847990e13b051c17491c318699926176979ab90",
              "public/icon-maskable-2026.svg":
                  "ebf77f72b68d2609333a1d74039bfa066f13df49",
              "public/social-card.svg":
                  "449031e2fe4c46b3a334a52c8b3c27da0e73570a",
              "public/apple-touch-icon-2026.png":
                  "431aaccb4946c5c1b405fb2b32db42ebc1aea28f",
              "public/icon-192-2026.png":
                  "df47289d27617ff7d84c573bf26db0e77391b867",
              "public/icon-512-2026.png":
                  "4ad993d18fa5cafacddeab75a77ef6dbf42109c3",
              "public/social-card.png":
                  "c6296ef3bff1d62f203a45ffa5e4ee3c8b71ad77",
              "public/favicon-2026.ico":
                  "6225227e778c9fef77e242e3735bb6caabdefacc",
              "public/favicon.ico":
                  "6225227e778c9fef77e242e3735bb6caabdefacc",
              "public/site.webmanifest":
                  "db25e82cfb4b66f95361c8dd2a2eeeb73783ae9b",
              "tests/test_build.py":
                  "4c4ead02843f3a09f1e644695aa76b1c28c04712",
              "tests/test_presentation.py":
                  "36c8e5474a6d1f3f029d29cfb4e87b10cfeaa9cf",
              "tests/test_couture_alphabet.py":
                  "bde66a00abd6b111e4c135cf3a976c662d8d6816",
              "tests/test_luminous_fairytale_redesign.py":
                  "82abd01afbcb24c70f933760c604a536722752d5",
          }

          def blob(path: str) -> str | None:
              target = Path(path)
              if not target.is_file():
                  return None
              return subprocess.check_output(
                  ["git", "hash-object", path],
                  text=True,
              ).strip()

          current = {
              path: blob(path)
              for path in set(old) | set(new)
          }
          old_ok = (
              all(current[path] == value for path, value in old.items())
              and current[
                  "tests/test_luminous_fairytale_redesign.py"
              ] is None
          )
          new_ok = all(
              current[path] == value
              for path, value in new.items()
          )
          if new_ok:
              print("The luminous redesign is already installed.")
          elif old_ok:
              print("The verified couture-alphabet base is present.")
          else:
              print(
                  "::error::Presentation files changed after this "
                  "release was prepared."
              )
              for path in sorted(current):
                  if (
                      current[path] != old.get(path)
                      and current[path] != new.get(path)
                  ):
                      print(
                          f"::error::{path}: "
                          f"{current[path] or 'missing'}"
                      )
              raise SystemExit(1)
          PY

          sha256sum \
            public/assets/app.js \
            scripts/model.py \
            scripts/build_site.py \
            config/elo_matches.json \
            config/forecast_layer.json \
            config/venue_effects.json \
            > "$RUNNER_TEMP/luminous-protected.before"

