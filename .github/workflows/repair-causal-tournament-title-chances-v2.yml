          p=.nfelo-tournament-title-chances.patch
          if git apply --check "$p"; then
            git apply --index "$p"
          elif git apply --reverse --check "$p"; then
            echo "Tournament title chances are already installed; validating the current implementation."
          elif test -f scripts/tournament_odds.py \
            && test -f scripts/tournament_simulation.py \
            && grep -Fq 'nfelo-title-chance-v4' config/tournament_odds.json \
            && grep -Fq 'Causal tournament title chances 2026-08-09.' public/assets/styles.css \
            && grep -Fq 'from tournament_odds import update_manifest, validate_manifest' scripts/fetch_sources.py \
            && grep -Fq 'test_unevidenced_2026_asean_bracket_fails_closed' tests/test_tournament_title_chances.py; then
