          elif git apply --3way --index "$p"; then
            echo "Applied the installer with a three-way merge onto newer non-overlapping work."
          else
            echo "::error::The installer conflicts with newer repository changes; no commit will be pushed."
            exit 1
          fi
          git diff --cached --check

      - name: Install and verify runtime
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Pin formats and build the site
        run: |
          set -Eeuo pipefail
          python scripts/tournament_odds.py update \
            --source source \
            --config config/tournament_odds.json \
            --output source/tournament_odds/manifest.json
          python scripts/tournament_odds.py validate \
            --manifest source/tournament_odds/manifest.json
          python scripts/build_site.py --source source --config config --output public

      - name: Run tournament regression tests
        run: |
          set -Eeuo pipefail
          python -m unittest tests.test_tournament_title_chances --verbose
          node --check public/assets/app.js

      - name: Run the complete repository suite
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python -m unittest discover --start-directory tests --verbose 2>&1 | tee unittest.log
          s=${PIPESTATUS[0]}
          set -e
          if [ "$s" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          t = Path("unittest.log").read_text(encoding="utf-8")
          f = set(re.findall(r"^FAIL: (test_[^( ]+)", t, flags=re.MULTILINE))
          e = set(re.findall(r"^ERROR: (test_[^( ]+)", t, flags=re.MULTILINE))
          a = {
              "test_deployed_forecast_layer_matches_the_audited_release",
              "test_rating_forecast_explanation_and_current_accuracy",
          }
          if e or not f or not f.issubset(a):
              raise SystemExit(f"Unexpected test failures={sorted(f)} errors={sorted(e)}")
          print("Only the two pre-existing frozen sample-size assertions differ from the live ledger.")
          PY

      - name: Enforce the live forecast contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          s = json.loads(Path("public/data/summary.json").read_text(encoding="utf-8"))
          r = json.loads(Path("research/home-advantage-2026-07-27/results.json").read_text(encoding="utf-8"))
          x = s["validation"]["retrospective"]
          y = r["end_to_end"]["selected"]
          n0 = int(r["scored_matches"])
          n1 = int(x["matches"])
          d = n1 - n0
          if abs(d) > max(250, math.ceil(n0 * 0.005)):
              raise SystemExit(f"Historical sample drift is too large: {n1} vs {n0}")
          c = abs(d) / max(n0, n1)
          checks = {
              "log_loss": (y["log_loss"], 0.000025 + 2.0 * c),
              "network_only_log_loss": (y["network_log_loss"], 0.000005 + 2.0 * c),
              "brier": (y["brier"], 0.000005 + 2.0 * c),
              "rps": (y["rps"], 0.000005 + 2.0 * c),
          }
          for k, (v, q) in checks.items():
              if not math.isclose(float(x[k]), float(v), abs_tol=q, rel_tol=0.0):
                  raise SystemExit(f"{k} moved outside the live-source tolerance")
          if not x["log_loss"] < x["network_only_log_loss"]:
              raise SystemExit("Forecast layer no longer improves on network-only probabilities")
          if not x["log_loss"] < r["end_to_end"]["baseline"]["log_loss"]:
              raise SystemExit("Forecast layer no longer improves on the public-rating baseline")
          print(json.dumps({"status": "ok", "frozen_matches": n0, "live_matches": n1, "drift": d}, sort_keys=True))
          PY

      - name: Commit the validated installation
        shell: bash
        run: |
          set -Eeuo pipefail
          i="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          i="${i%@*}"
          case "$i" in
            .github/workflows/*.yml|.github/workflows/*.yaml) ;;
            *) echo "::error::Could not identify this installer safely: $i"; exit 1 ;;
          esac

          git add -- \
            config/tournament_odds.json \
            public/assets/app.js \
            public/assets/styles.css \
            scripts/build_site.py \
            scripts/fetch_sources.py \
            scripts/forecast_layer.py \
            scripts/model.py \
            scripts/tournament_odds.py \
            scripts/tournament_simulation.py \
            source/tournament_odds/manifest.json \
            source/tournament_odds/probabilities.json \
            tests/test_build.py \
            tests/test_tournament_title_chances.py
          find public -type f -name index.html -exec git add -- {} +
          git rm -- "$i"
          rm -f -- .nfelo-tournament-title-chances.patch

          if test -n "$(git diff --name-only)"; then
            echo "::error::The build left unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          w="$(git diff --cached --name-only -- .github/workflows)"
          if [ "$w" != "$i" ]; then
            echo "::error::The repair must not modify any workflow except deleting itself."
            printf '%s\n' "$w"
            exit 1
          fi
          git diff --cached --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during validation; refusing to overwrite newer work."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add causal tournament title chances [skip ci]"
          git push origin HEAD:main

      - name: Trigger the validated Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run pages.yml \
            --ref main \
            --field refresh_source=false \
            --field full_refresh=false
