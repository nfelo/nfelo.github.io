name: Install NFELO fairytale couture spectrum

# Presentation only:
# 1. Rosewater, lavender and sea-pearl atmosphere.
# 2. Softer fashion-editorial display typography.
# 3. A pearl perfume-seal setting for the existing logo.
# 4. Organza and tulle depth on focal panels.
# 5. Mother-of-pearl inner frames and couture silhouettes.
# 6. Varied powder-compact blush, lilac and pearl surfaces.
# 7. Satin controls with restrained, accessible movement.
# 8. Pearl details made from existing functional elements.
# 9. Whisper-soft table rhythm and disclosure states.
# 10. A dedicated moonlit dark mode plus tablet/mobile tuning.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-nfelo-fairytale-couture-spectrum
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check compatibility
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail

          hash_file() {
            sha256sum "$1" | awk '{print $1}'
          }

          old_styles="c40a22b528bf90e9f86471747efa82d197ba6c794ad92b041e0af7ac474a8fd9"
          old_404="ac77b813dc22038011ef90c0c2a2c1aeac3bd2cb1730f1fe1ab6d92e3f04fd3d"
          old_test="444311982fc71f27ecdcda2b1aeb064bb089de0d4bceb8a805d484dafb629847"

          new_styles="05d5b0fb14d3489a606395f487ddf5f43177c736b838aecfc2d6ef66a137f1e3"
          new_404="0fa4aeac6c8ea3945bf0ffb1e699850acbec4109e001d07878df614e46e7800b"
          new_test="deb45442ace7f31b6a99d21128b23dc60f6f62c5348e93bd5492184cdd4758e9"

          actual_styles="$(hash_file public/assets/styles.css)"
          actual_404="$(hash_file config/404.html)"
          actual_test="$(hash_file tests/test_presentation.py)"

          if [[ "$actual_styles" == "$new_styles" &&
                "$actual_404" == "$new_404" &&
                "$actual_test" == "$new_test" ]]; then
            echo "The fairytale couture spectrum is already installed."
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$actual_styles" != "$old_styles" ||
                "$actual_404" != "$old_404" ||
                "$actual_test" != "$old_test" ]]; then
            echo "::error::A presentation source file changed after this installer was audited."
            echo "Expected current stylesheet: $old_styles"
            echo "Actual current stylesheet:   $actual_styles"
            echo "Expected current 404:        $old_404"
            echo "Actual current 404:          $actual_404"
            echo "Expected current test:       $old_test"
            echo "Actual current test:         $actual_test"
            exit 1
          fi

          echo "apply=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.compatibility.outputs.apply == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install audited presentation sources
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

