    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the release still matches main
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "README.md": "6bd71c841042a7d8865878483c3f6522bdd3cf7a5a271a1d32bb95b93a9c851a",
              "config/404.html": "4ee0a40d9b59f1b8ddfe7164ad3325293845c5a5708f51b58a3b321c31b6015c",
              "docs/model-validation.md": "778f29142261fbed12047b38459eb49dfa5ca1d4c52a3d2125dc120b82741ea6",
              "public/assets/app.js": "2e062771502a04e628097a1df5f76fe04c1532400b873b3d93d2c1b3e4f1eb31",
              "scripts/forecast_layer.py": "66990900a1202ca4ad652fd93b74732adab1bb93d3b0e9438a67e05c39162216",
              "tests/test_build.py": "c29a1de32a65d5931426272245eaff1083e8c1fddfa8ef64c4e2f150df81c9c8",
          }
          failures = []
          for name, wanted in expected.items():
              path = Path(name)
              actual = sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != wanted:
                  failures.append(f"{name}: expected {wanted}, found {actual}")
          if failures:
              raise SystemExit(
                  "Main changed after this release was audited; no files were changed.\n"
                  + "\n".join(failures)
              )
          print("All six guarded source files match the audited main commit.")
          PY

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Build an untouched rating baseline
        run: |
          set -euo pipefail
          cp -a source "$RUNNER_TEMP/source-baseline"
          cp -a public "$RUNNER_TEMP/public-baseline"
          python scripts/build_site.py \
            --source "$RUNNER_TEMP/source-baseline" \
            --config config \
            --output "$RUNNER_TEMP/public-baseline"

      - name: Verify and install the audited source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfelo-deterministic-calibration-404.tar.xz"
          printf '%s' "$UPDATE_ARCHIVE" \
            | tr -d '[:space:]' \
            | base64 --decode > "$archive"
          printf '%s  %s\n' "$UPDATE_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check
          python - "$archive" <<'PY'
          from pathlib import Path
          import sys
          import tarfile

          expected = [
              "README.md",
              "config/404.html",
              "docs/model-validation.md",
              "public/assets/app.js",
              "scripts/forecast_layer.py",
              "tests/test_build.py",
          ]
          archive = Path(sys.argv[1])
          with tarfile.open(archive, "r:xz") as handle:
              members = handle.getmembers()
          actual = [member.name for member in members]
          unsafe = [
              member.name
              for member in members
              if not member.isfile()
              or member.name.startswith("/")
              or ".." in Path(member.name).parts
          ]
          if actual != expected or unsafe:
              raise SystemExit(
                  f"Unexpected archive contents: actual={actual!r}, unsafe={unsafe!r}"
              )
          print("Archive contains exactly the six audited regular files.")
          PY
          tar \
            --extract \
            --xz \
            --overwrite \
            --file="$archive" \
            --directory=.
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "README.md": "6336928ea7bed48e75e1b45e67bc6e78a5246c69770648eea4c392fc260ffdb0",
              "config/404.html": "c1c75c4c1920ca0a504ad0f52a049a24a86aa72a4925dacee28816ef0be21f09",
              "docs/model-validation.md": "81fbaca1da51cd32ed5d0e530ba237af81505a4dd47d2ccd02cc80ccc86df23a",
              "public/assets/app.js": "b08e63b6603527e3f7c1def1c4fd3059af326b6c53502b64ebdde04a49e989fe",
              "scripts/forecast_layer.py": "66883bd5584b45bd8930c92b6af48b75c6f43a2b40ec120aef64b35297b6ae78",
              "tests/test_build.py": "fa66a53a9af3811201f0885039e615f645090c8a56e37a25b1f5b0d865e62e9c",
          }
          for name, wanted in expected.items():
              actual = sha256(Path(name).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"Installed file checksum mismatch: {name}")
          print("All installed file checksums match the audited release.")
          PY

      - name: Rebuild the complete site
        run: python scripts/build_site.py --source source --config config --output public

      - name: Verify model, site, browser code and documentation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/forecast_layer.py \
            scripts/model.py \
            scripts/build_site.py \
            tests/test_build.py
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          python scripts/audit_site_consistency.py --public public
          git diff --check -- \
            README.md \
            config/404.html \
            docs/model-validation.md \
            public/assets/app.js \
            scripts/forecast_layer.py \
            tests/test_build.py

      - name: Prove ratings stayed unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          baseline_root = Path(
              __import__("os").environ["RUNNER_TEMP"]
          ) / "public-baseline" / "data"
          updated_root = Path("public/data")
          baseline = json.loads((baseline_root / "summary.json").read_text())
          updated = json.loads((updated_root / "summary.json").read_text())

          unchanged = (
              "current",
              "teams",
              "peaks",
              "top_matches",
              "upsets",
              "number_ones",
              "number_one_summary",
              "best_tournaments",
          )
          for key in unchanged:
              if baseline[key] != updated[key]:
                  raise SystemExit(f"Rating output changed unexpectedly: {key}")

          baseline_state = json.loads((baseline_root / "state.json").read_text())
          updated_state = json.loads((updated_root / "state.json").read_text())
          baseline_state.pop("forecast_layer")
          updated_state.pop("forecast_layer")
          if baseline_state != updated_state:
              raise SystemExit("The opponent-network rating state changed.")

          base_replay = baseline["validation"]["retrospective"]
          new_replay = updated["validation"]["retrospective"]
          for key in ("log_loss", "brier", "rps"):
              if abs(float(base_replay[key]) - float(new_replay[key])) > 0.0000001:
                  raise SystemExit(f"Forecast diagnostic moved materially: {key}")
          changed_classifications = abs(
              float(base_replay["accuracy"]) - float(new_replay["accuracy"])
          ) * int(base_replay["matches"])
          if changed_classifications > 1.1:
              raise SystemExit(
                  "More than the single audited numerical near-tie changed."
              )

          layer = updated["parameters"]["forecast_layer"]
          calibration = layer["calibration"]
          if layer["calibration_precision_decimals"] != 6:
              raise SystemExit("The public calibration grid is not six decimals.")
          for key in (
              "draw_log_tilt",
              "friendly_temperature",
              "competitive_temperature",
              "nfelo_weight",
          ):
              value = float(calibration[key])
              if value != float(f"{value:.6f}"):
                  raise SystemExit(f"Non-canonical calibration value: {key}")

          baseline_fixtures = json.loads(
              (baseline_root / "fixtures.json").read_text()
          )["fixtures"]
          updated_fixtures = json.loads(
              (updated_root / "fixtures.json").read_text()
          )["fixtures"]
          if len(baseline_fixtures) != len(updated_fixtures):
              raise SystemExit("Fixture count changed during the source-only release.")
          for old, new in zip(baseline_fixtures, updated_fixtures):
              identity = (
                  "date",
                  "team1_code",
                  "team2_code",
                  "tournament_code",
                  "home_sign",
              )
              old_identity = tuple(old.get(key) for key in identity)
              new_identity = tuple(new.get(key) for key in identity)
              if old_identity != new_identity:
                  raise SystemExit("Fixture order or identity changed.")
              old_display = tuple(
                  round(float(value) * 100, 1)
                  for value in old["probabilities"]
              )
              new_display = tuple(
                  round(float(value) * 100, 1)
                  for value in new["probabilities"]
              )
              if old_display != new_display:
                  raise SystemExit(
                      f"A displayed fixture probability changed: {old_identity}"
                  )

          print(
              "Ratings, rankings, records and displayed fixture probabilities "
              "are unchanged; the numerical near-tie guard passed."
          )
          PY

      - name: Prove repeatability under a second math environment
        run: |
          set -euo pipefail
          cp public/data/summary.json "$RUNNER_TEMP/summary-first.json"
          cp -a source "$RUNNER_TEMP/source-repeat"
          cp -a public "$RUNNER_TEMP/public-repeat"
          OPENBLAS_NUM_THREADS=1 \
          OMP_NUM_THREADS=1 \
          MKL_NUM_THREADS=1 \
          NUMEXPR_NUM_THREADS=1 \
            python scripts/build_site.py \
              --source "$RUNNER_TEMP/source-repeat" \
              --config config \
              --output "$RUNNER_TEMP/public-repeat"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          first = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "summary-first.json").read_text()
          )
          repeat = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "public-repeat"
                  / "data"
                  / "summary.json"
              ).read_text()
          )
          for value in (first, repeat):
              value["meta"].pop("generated_at", None)
          for key in (
              "current",
              "teams",
              "peaks",
              "top_matches",
              "upsets",
              "number_ones",
              "number_one_summary",
              "best_tournaments",
              "validation",
          ):
              if first[key] != repeat[key]:
                  raise SystemExit(f"Repeat build differs in {key}.")
          first_layer = first["parameters"]["forecast_layer"]
          repeat_layer = repeat["parameters"]["forecast_layer"]
          if first_layer != repeat_layer:
              raise SystemExit("Repeat build has different forecast calibration.")
          print(
              "A second full replay with single-threaded math produced the "
              "same calibration, ratings and validation output."
          )
          PY

      - name: Commit only the six audited source files
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-files.txt"
          printf '%s\n' \
            README.md \
            config/404.html \
            docs/model-validation.md \
            public/assets/app.js \
            scripts/forecast_layer.py \
            tests/test_build.py \
            > "$expected"
          git add -- \
            README.md \
            config/404.html \
            docs/model-validation.md \
            public/assets/app.js \
            scripts/forecast_layer.py \
            tests/test_build.py
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-files.txt"
          sort "$expected" -o "$expected"
          diff -u "$expected" "$RUNNER_TEMP/staged-files.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make calibration reproducible and align 404 theme"

      - name: Rebase safely and publish to main
        run: |
          set -euo pipefail
          git stash push --include-untracked \
            --message "validated generated installer outputs"
          git fetch origin main
          git rebase origin/main
          expected="$RUNNER_TEMP/expected-files.txt"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/committed-files.txt"
          diff -u "$expected" "$RUNNER_TEMP/committed-files.txt"
          git push origin HEAD:main
          echo "Installed successfully. The normal Pages workflow will deploy the verified build."
