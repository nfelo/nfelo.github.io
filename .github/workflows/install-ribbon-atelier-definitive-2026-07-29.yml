      - name: Refuse changes outside the audited presentation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          root = Path.cwd()
          routes = {
              path.relative_to(root).as_posix()
              for path in (root / "public").rglob("index.html")
          }
          if len(routes) != 260:
              raise SystemExit(
                  f"Expected 260 clean routes; found {len(routes)}."
              )

          expected = routes | {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_ribbon_atelier.py",
          }
          porcelain = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z"],
              text=True,
          )
          actual = set()
          for item in porcelain.split("\0"):
              if not item:
                  continue
              status = item[:2]
              path = item[3:]
              if "R" in status or "C" in status:
                  raise SystemExit(
                      f"Unexpected rename or copy in release: {item!r}"
                  )
              actual.add(path)

          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(
                  "Presentation scope mismatch.\n"
                  f"Missing: {missing}\n"
                  f"Unexpected: {extra}"
              )

          css = (root / "public/assets/styles.css").read_text(
              encoding="utf-8"
          )
          if css.count(
              "Ribbon atelier definitive finishing system."
          ) != 1:
              raise SystemExit(
                  "The definitive presentation layer is not unique."
              )
          print(
              "Scope verified: 260 route fingerprints, the stylesheet, "
              "the standalone 404 source and one regression test."
          )
          PY

      - name: Commit the presentation and remove this installer
        shell: bash
        run: |
          set -euo pipefail

          installer=".github/workflows/install-ribbon-atelier-definitive-2026-07-29.yml"
          test -f "$installer"
          rm -- "$installer"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            config/404.html \
            public/assets/styles.css \
            tests/test_ribbon_atelier.py \
            "$installer"
          find public -type f -name index.html -print0 \
            | xargs -0 git add --

          git diff --cached --check
          git commit -m \
            "style: install ribbon atelier presentation [skip ci]"
          git push origin HEAD:main

      - name: Start the normal Pages build and deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
