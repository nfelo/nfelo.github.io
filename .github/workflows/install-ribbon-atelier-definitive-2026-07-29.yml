name: Install ribbon atelier definitive presentation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-ribbon-atelier-definitive
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify compatible presentation and lock the logo
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "fbf9be2ac177bee10c84da72bb243f23bf77411c966ad6b627a8ce31a3fa0051"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "09f465edbb5f50797d08265ddbf614be5cc10891e720c44f7792482afe691002"
          grep -Fq "Rosewater couture hybrid." public/assets/styles.css
          grep -Fq "Rosewater couture hybrid echo" config/404.html

          route_count="$(find public -type f -name index.html | wc -l)"
          test "$route_count" -eq 260

          sha256sum --check <<'SHA256'
          649147e32d2ae5e000a6cc44b2bc9d5ab1e1f2ec32b62fd3d0b04a7734fed1ff  public/favicon-2026.svg
