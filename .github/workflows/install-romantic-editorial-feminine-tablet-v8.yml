name: "Install romantic editorial feminine tablet v8"
run-name: "Install romantic editorial feminine tablet v8 · #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: romantic-editorial-feminine-tablet-v8
  cancel-in-progress: false

