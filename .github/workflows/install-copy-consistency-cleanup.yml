      - name: Build and test the complete site
        shell: bash
        run: |
          set -euo pipefail

          node --check public/assets/app.js
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          root = Path(".")
          app = (
              root / "public/assets/app.js"
          ).read_text(encoding="utf-8")
          readme = (
              root / "README.md"
          ).read_text(encoding="utf-8")
          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )

          replay = summary["validation"]["retrospective"]
          benchmark = summary["validation"]["nested"]
          if replay["matches"] != 46_801:
              raise SystemExit(
                  f"Unexpected replay size: {replay['matches']}"
              )
          if abs(replay["log_loss"] - 0.87833346) > 0.000005:
              raise SystemExit(
                  f"Current log loss moved: {replay['log_loss']}"
              )
          if (
              abs(replay["accuracy"] - 0.59169676)
              > 2.5 / replay["matches"]
          ):
              raise SystemExit(
                  f"Current accuracy moved: {replay['accuracy']}"
              )
          expected_benchmark = {
              "matches": 46_801,
              "log_loss": 0.88421871,
              "accuracy": 0.59095,
              "best_scalar_elo_log_loss": 0.89296976,
              "best_scalar_elo_accuracy": 0.58527,
              "g_elo_log_loss": 0.895187,
              "g_elo_accuracy": 0.58779,
              "published_wfe_log_loss": 0.90261852,
              "published_wfe_accuracy": 0.58804,
          }
          for key, expected in expected_benchmark.items():
              actual = benchmark[key]
              if isinstance(expected, int):
                  if actual != expected:
                      raise SystemExit(
                          f"Benchmark {key} moved: {actual}"
                      )
              elif abs(actual - expected) > 5e-8:
                  raise SystemExit(
                      f"Benchmark {key} moved: {actual}"
                  )

          faq = app.split(
              "function buildFAQItems()",
              1,
          )[1].split("function faqSearchTokens", 1)[0]
          about = app.split(
              "function renderAbout()",
              1,
          )[1].split("function renderNotFound", 1)[0]
          venue_panel = app.split(
              'const venuePanel = venueProfile ? `',
              1,
          )[1].split('` : "";', 1)[0]
          score_panel = app.split(
              'const scorePanel = scoreProfile ? `',
              1,
          )[1].split('` : "";', 1)[0]

          required_venue_label = (
              "Match adjustment${cutoff ? "
              "` · ${validDate(venueAsOfDate)}` : \"\"}"
          )
          if required_venue_label not in venue_panel:
              raise SystemExit(
                  "Home/away date is not limited to historical pages."
              )
          if (
              "Match adjustment · "
              "${validDate(venueAsOfDate)}"
              in venue_panel
          ):
              raise SystemExit(
                  "Current home/away panel still shows a redundant date."
              )

          for phrase in (
              "<b>Attack and defence</b>",
              "Own expected goals",
              "Opponent expected goals",
              "Attack residual",
              "Defence residual",
              "after each completed matchday",
              "How the forecast layer works",
          ):
              if phrase not in score_panel:
                  raise SystemExit(
                      f"Team forecast panel missing: {phrase}"
                  )
          for redundant in (
              "validDate(venueAsOfDate)",
              "<small>",
              "Last matchday update",
              "Reversion half-life",
          ):
              if redundant in score_panel:
                  raise SystemExit(
                      f"Team forecast panel still contains: {redundant}"
                  )
          if score_panel.count("<div><span>") != 4:
              raise SystemExit(
                  "Team forecast panel must contain four metrics."
              )

          introduction = (
              "in technical comparisons, by log loss"
          )
          question = (
              'question: "What does better log loss mean '
              'in practice?"'
          )
          if (
              introduction not in faq
              or question not in faq
              or faq.index(introduction) >= faq.index(question)
          ):
              raise SystemExit(
                  "FAQ does not introduce log loss before using it."
              )
          if faq.count('question: "') != 33:
              raise SystemExit("FAQ question count changed.")
          if "summary.validation.retrospective.log_loss" in faq:
              raise SystemExit(
                  "FAQ exposes unnecessary exact log-loss data."
              )
          answers = re.findall(
              r'answer: (?:"([^"]*)"|`([^`]*)`)',
              faq,
          )
          if len(answers) != 33:
              raise SystemExit("Could not inspect every FAQ answer.")
          for first, second in answers:
              answer = re.sub(
                  r"\$\{[^}]+\}",
                  "value",
                  first or second,
              )
              words = re.findall(
                  r"[\w’%-]+",
                  answer,
                  flags=re.UNICODE,
              )
              if len(words) < 34:
                  raise SystemExit(
                      f"FAQ answer is too terse: {answer}"
                  )

          if "40-year venue half-life" in about:
              raise SystemExit(
                  "About still duplicates a technical half-life value."
              )
          for phrase in (
              "Rating parameters and the forecast-layer "
              "structure remain fixed",
              "preceding eight complete calendar years",
          ):
              if phrase not in about:
                  raise SystemExit(
                      f"About update explanation missing: {phrase}"
                  )

          normalised_readme = " ".join(readme.split()).lower()
          for phrase in (
              "across 46,801 stored pre-match forecasts",
              "59.2%",
              "methodology validation section",
          ):
              if phrase not in normalised_readme:
                  raise SystemExit(
                      f"README accuracy summary missing: {phrase}"
                  )
          for redundant in (
              "| formula | forecasts |",
              "59.170%",
              "0.878333",
          ):
              if redundant in readme.lower():
                  raise SystemExit(
                      f"README contains redundant detail: {redundant}"
                  )

          if summary["current"][0]["nation"] != "Spain":
              raise SystemExit("Current No. 1 guardrail failed.")
          england_rank = next(
              index
              for index, team in enumerate(
                  summary["current"],
                  start=1,
              )
              if team["nation"] == "England"
          )
          if england_rank != 6:
              raise SystemExit(
                  f"England ranking moved to {england_rank}."
              )
          early_british = {
              "England",
              "Scotland",
              "Wales",
              "Northern Ireland",
          }
          count = sum(
              peak["nation"] in early_british
              and peak["date"] < "1914-01-01"
              for peak in summary["peaks"][:10]
          )
          if count > 1:
              raise SystemExit(
                  "Early British peak guardrail failed."
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Prove a second build is identical
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          hashes = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(
                  root / "public/data/fixtures.json"
              ),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          (
              Path(os.environ["RUNNER_TEMP"])
              / "first-build-hashes.json"
          ).write_text(
              json.dumps(hashes, sort_keys=True),
              encoding="utf-8",
          )
          PY

          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          node --check public/assets/app.js
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          actual = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(
                  root / "public/data/fixtures.json"
              ),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          expected = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "first-build-hashes.json"
              ).read_text(encoding="utf-8")
          )
          if actual != expected:
              raise SystemExit(
                  f"The second build was not deterministic.\n"
                  f"Expected: {expected}\nActual: {actual}"
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Commit and publish the verified release
        shell: bash
        run: |
          set -euo pipefail

          git add \
            README.md \
            public \
            source/prospective_forecasts.jsonl \
            tests/test_build.py

          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "::error::The installer produced no staged changes."
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "$path" in
              README.md|public/*|source/prospective_forecasts.jsonl|tests/test_build.py)
                ;;
              *)
                echo "::error file=$path::Unexpected staged path."
                exit 1
                ;;
            esac
          done

          if git diff --cached --name-only \
            | grep -q '^\.github/workflows/pages\.yml$'; then
            echo "::error::.github/workflows/pages.yml must not be changed."
            exit 1
          fi
          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"
          git diff --cached --check

          git fetch origin main
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$start_sha" ]; then
            echo "::error::main changed while the installer was validating. Nothing was pushed; rerun the installer on the new main branch."
            echo "Started at: $start_sha"
            echo "Current:    $remote_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "docs(ui): remove redundant dates and clarify FAQ terms"
          git push origin HEAD:main

      - name: Installation summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Copy consistency cleanup installed"
            echo
            echo "- Attack and defence no longer repeats the current date."
            echo "- Home and away shows an as-of date only in historical views."
            echo "- FAQ introduces log loss before its dedicated explanation."
            echo "- About and README remove duplicated technical detail."
            echo "- All 83 tests and the site-wide consistency audit passed."
            echo "- Ratings, model parameters and pages.yml were not changed."
            echo
            echo "The normal Pages workflow should now deploy the verified commit."
            echo "After that succeeds, delete this one-use installer workflow."
          } >> "$GITHUB_STEP_SUMMARY"
