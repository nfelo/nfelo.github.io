name: Install copy consistency cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-copy-consistency-cleanup-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Verify the expected starting release
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            local path="$1"
            local expected="$2"
            local actual
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Expected file is missing."
              exit 1
            fi
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::This file changed after the installer was prepared. Nothing has been modified; request a refreshed installer."
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          }

          check_file README.md \
            6535013260b9915843a10e7412ba3f760c41b2b51bc6e47841e7f3102717b23c
          check_file public/assets/app.js \
            9e39877c58545e74ebfebc5f42c728f54c5ca17db7742185b8bc0d0fa5e4708d
          check_file tests/test_build.py \
            84829fad560b17a79af9143a017acd118d79fa20e97ee77a9d07f5a38627d5aa
          check_file public/assets/styles.css \
            b80c851f98c21452c88c68ea234ebbd5a4ad4b626f93d8604290e8458eed3fc8
          check_file scripts/model.py \
            10859823a2bb7487adaa44b9da50c4a8b6f28f6762a17b4790a419f222f182b1
          check_file scripts/build_site.py \
            0284bf9dc9ee9ccae4fece07fb1fb7e09d989b125baf27f7302e37d5c7bc1f27
          check_file scripts/forecast_layer.py \
            dc53afa926c4f91d9a0164dac2cfb21df124d262941ed8580d7502a0bb8e55bc
          check_file scripts/smoke_browser_boot.js \
            0dbf874d5fe6625a15a3cb976cfe7a5dfc298b7719119c0e29b911cbfb9de6e5
          check_file config/venue_effects.json \
            fb540d312239d7ac2322dae508991d5cbc5d46bb596a31e55a193bad6969f1e9
          check_file docs/model-validation.md \
            10d778acc37f3d3beecd960cb9d9314b8f3674f35b5fec2e75ea38b0e0a8a94c
          check_file tests/test_tournament_classification.py \
            ad3de229aced26f2f6ba49be04394a52388cb5ec2c07a93efb2e94edf8b030a6
          check_file requirements.txt \
            b7755e3cae934f30943760a5403dbe461ec48ccbdba3ac44816698f92a0fad83

          git rev-parse HEAD > "$RUNNER_TEMP/start-sha"
          sha256sum .github/workflows/pages.yml \
            > "$RUNNER_TEMP/pages-before.sha256"

