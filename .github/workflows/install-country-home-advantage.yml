      - name: Build and validate the complete release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js

      - name: Check release metrics and historical guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          summary = json.loads(
              Path("public/data/summary.json").read_text(encoding="utf-8")
          )
          fixtures = json.loads(
              Path("public/data/fixtures.json").read_text(encoding="utf-8")
          )
          research = json.loads(
              Path(
                  "research/home-advantage-2026-07-27/results.json"
              ).read_text(encoding="utf-8")
          )

          assert (
              summary["meta"]["methodology_version"]
              == "2026-07-27-country-home-dependence"
          )
          venue = summary["parameters"]["venue_effects"]
          assert venue["prior_sd"] == 60.0
          assert venue["half_life_years"] == 40.0
          assert venue["home_share"] == 0.5
          assert venue["away_share"] == 0.5
          assert venue["neutral_effect"] == 0.0
          assert venue["predictive_variance_scale"] == 0.0

          study = summary["validation"]["home_advantage_study"]
          assert study["matches"] == 46_801
          assert study["untouched_matches"] == 6_320
          assert study["final_log_loss_improvement"] > 0.001
          assert study["untouched_log_loss_improvement"] > 0.001
          assert study["all_five_time_blocks_improved"] is True

          friendly_era = research["friendly_information_by_era"]
          assert (
              friendly_era["decision"]
              == "retain one 0.78621 ratio in both the main network and "
              "country venue update"
          )
          assert friendly_era["main_network"]["candidate_curves"] == 1_650
          assert (
              friendly_era["main_network"][
                  "all_flexible_family_winners_worse_on_confirmation"
              ]
              is True
          )
          assert (
              friendly_era["country_venue_update"]["candidate_profiles"]
              == 170
          )
          assert (
              friendly_era["country_venue_update"]["interval_includes_zero"]
              is True
          )

          replay = summary["validation"]["retrospective"]
          selected = research["end_to_end"]["selected"]
          baseline = research["end_to_end"]["baseline"]
          assert replay["log_loss"] < baseline["log_loss"]
          assert abs(replay["log_loss"] - selected["log_loss"]) <= 0.000005
          assert (
              abs(
                  replay["network_only_log_loss"]
                  - selected["network_log_loss"]
              )
              <= 0.000005
          )

          current = summary["current"]
          assert [team["nation"] for team in current[:2]] == [
              "Spain",
              "Argentina",
          ]
          england = next(
              team for team in current if team["nation"] == "England"
          )
          assert england["rank"] == 6
          early_british = {
              "England",
              "Scotland",
              "Wales",
              "Northern Ireland",
          }
          assert sum(
              peak["nation"] in early_british
              and peak["date"] < "1914-01-01"
              for peak in summary["peaks"][:20]
          ) <= 1

          for team in summary["teams"]:
              profile = team["venue_effect"]
              for key in (
                  "dependence",
                  "se",
                  "hosting_adjustment",
                  "away_adjustment",
                  "neutral",
                  "reliability",
              ):
                  assert math.isfinite(float(profile[key]))
              assert abs(
                  profile["hosting_adjustment"]
                  + profile["away_adjustment"]
              ) < 1e-7
              assert profile["neutral"] == 0.0
              assert 0.0 <= profile["reliability"] <= 1.0

          for fixture in fixtures["fixtures"]:
              if fixture["home_sign"] == 0:
                  assert fixture["country_home_adjustment"] == 0.0
              assert abs(
                  fixture["total_home_adjustment"]
                  - fixture["global_home_adjustment"]
                  - fixture["country_home_adjustment"]
              ) < 1e-7

          print(
              "Release guardrails passed: "
              f"log loss {replay['log_loss']:.8f}; "
              f"current No. 1 {current[0]['nation']}."
          )
          PY

      - name: Record deterministic build hashes
        shell: bash
        env:
          HASH_FILE: ${{ runner.temp }}/country-venue-build-hashes.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = (
              "public/data/state.json",
              "public/data/summary.json",
              "public/data/fixtures.json",
              "source/prospective_forecasts.jsonl",
          )

          def digest(path_text):
              path = Path(path_text)
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if path_text.endswith("summary.json"):
                      value.get("meta", {}).pop("generated_at", None)
                  payload = json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              else:
                  payload = path.read_bytes()
              return hashlib.sha256(payload).hexdigest()

          hashes = {path: digest(path) for path in paths}
          Path(os.environ["HASH_FILE"]).write_text(
              json.dumps(hashes, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(hashes, indent=2))
          PY

      - name: Prove the release rebuilds identically
        shell: bash
        env:
          HASH_FILE: ${{ runner.temp }}/country-venue-build-hashes.json
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected = json.loads(
              Path(os.environ["HASH_FILE"]).read_text(encoding="utf-8")
          )

          def digest(path_text):
              path = Path(path_text)
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if path_text.endswith("summary.json"):
                      value.get("meta", {}).pop("generated_at", None)
                  payload = json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              else:
                  payload = path.read_bytes()
              return hashlib.sha256(payload).hexdigest()

          actual = {path: digest(path) for path in expected}
          if actual != expected:
              print("First build:", json.dumps(expected, indent=2))
              print("Second build:", json.dumps(actual, indent=2))
              raise SystemExit("The two complete builds were not identical")
          print("Repeatability check passed for every release-state file.")
          PY
          python -m unittest discover \
            --start-directory tests \
            --verbose
          node --check public/assets/app.js
          git diff --check
          sha256sum --check "$RUNNER_TEMP/pages-before.sha256"

      - name: Commit the verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            README.md \
            docs/model-validation.md \
            config/venue_effects.json \
            scripts/model.py \
            scripts/build_site.py \
            scripts/venue_effects.py \
            public \
            tests/test_build.py \
            research/home-advantage-2026-07-27 \
            research/methodology-audit-2026-07-19/network_eval.cpp \
            source/prospective_forecasts.jsonl

          python - <<'PY'
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines()
          allowed_exact = {
              "README.md",
              "docs/model-validation.md",
              "config/venue_effects.json",
              "scripts/model.py",
              "scripts/build_site.py",
              "scripts/venue_effects.py",
              "tests/test_build.py",
              "research/methodology-audit-2026-07-19/network_eval.cpp",
              "source/prospective_forecasts.jsonl",
          }
          allowed_prefixes = (
              "public/",
              "research/home-advantage-2026-07-27/",
          )
          unexpected = [
              path
              for path in paths
              if path not in allowed_exact
              and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(
                  f"Refusing unexpected staged paths: {unexpected}"
              )
          if ".github/workflows/pages.yml" in paths:
              raise SystemExit("The deployment workflow must not be changed")
          print(f"Verified {len(paths)} staged release files.")
          PY

          if git diff --cached --quiet; then
            echo "::error::The audited release produced no changes."
            exit 1
          fi

          starting_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$starting_sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main changed while the release was being checked. Nothing has been pushed; run this installer again so it validates the newest source."
            exit 1
          fi

          git commit -m \
            "feat(model): add country-specific home advantage"
          git push origin HEAD:main

      - name: Installation summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Country-specific venue model installed

          The guarded full replay, 82-test suite, browser-start check,
          historical guardrails, 1,820 friendly-era candidate checks and
          two-build repeatability check all passed.

          The existing `pages.yml` was not changed. Its push trigger will now
          rebuild and deploy the verified model. This one-use installer may be
          deleted after the deployment succeeds.
          SUMMARY
