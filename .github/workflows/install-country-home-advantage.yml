name: Install country-specific venue model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfelo-country-home-advantage-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Verify the expected starting code
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            local path="$1"
            local expected="$2"
            local actual
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Expected file is missing."
              exit 1
            fi
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::This file has changed since the audited release was prepared. No files have been modified; request a refreshed installer."
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          }

          check_file README.md \
            6336928ea7bed48e75e1b45e67bc6e78a5246c69770648eea4c392fc260ffdb0
          check_file docs/model-validation.md \
            81fbaca1da51cd32ed5d0e530ba237af81505a4dd47d2ccd02cc80ccc86df23a
          check_file scripts/model.py \
            d6519dc9990c242e45564fcaf77246dc18c9304021a0f74b108e196139a9d1c1
          check_file scripts/build_site.py \
            12c4d1525ae814bc29a20d0458bc9dbcdd7156c3075e52010c4222e2bb4b2f79
          check_file public/assets/app.js \
            b08e63b6603527e3f7c1def1c4fd3059af326b6c53502b64ebdde04a49e989fe
          check_file public/assets/styles.css \
            0f14a2eb0b7429abf21cf8f8f15fcd430ec6374f6b7a5fc2bacffc1d172912f3
          check_file tests/test_build.py \
            fa66a53a9af3811201f0885039e615f645090c8a56e37a25b1f5b0d865e62e9c
          check_file \
            research/methodology-audit-2026-07-19/network_eval.cpp \
            75f099649290db2fca5a213eee2656239c68f6c679f8ed869faf2ed5177c7397

          for path in \
            config/venue_effects.json \
            scripts/venue_effects.py \
            research/home-advantage-2026-07-27
          do
            if [ -e "$path" ]; then
              echo "::error file=$path::An audited-release path already exists. No files have been modified; do not install over an unknown partial release."
              exit 1
            fi
          done

          sha256sum .github/workflows/pages.yml \
            > "$RUNNER_TEMP/pages-before.sha256"

