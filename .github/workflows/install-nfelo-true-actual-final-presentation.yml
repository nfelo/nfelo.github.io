      - name: Synchronise asset versions across clean routes
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path(".")
          public = root / "public"
          css_hash = hashlib.sha256(
              (public / "assets" / "styles.css").read_bytes()
          ).hexdigest()[:12]
          js_hash = hashlib.sha256(
              (public / "assets" / "app.js").read_bytes()
          ).hexdigest()[:12]

          paths = sorted(public.rglob("index.html"))
          fallback = root / "config" / "404.html"
          if fallback.is_file():
              paths.append(fallback)
          if len(paths) < 250:
              raise SystemExit(
                  f"Expected at least 250 clean-route entries; found {len(paths)}"
              )

          css_pattern = re.compile(
              r"assets/styles\.css\?v=[0-9a-f]+"
          )
          js_pattern = re.compile(
              r"assets/app\.js\?v=[0-9a-f]+"
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              changed = css_pattern.sub(
                  f"assets/styles.css?v={css_hash}",
                  text,
              )
              changed = js_pattern.sub(
                  f"assets/app.js?v={js_hash}",
                  changed,
              )
              if changed != text:
                  path.write_text(changed, encoding="utf-8")

          print(
              f"Synchronised {len(paths)} entries: "
              f"CSS {css_hash}, JS {js_hash}"
          )
          PY

      - name: Run presentation-only checks
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node --check public/assets/app.js
          python -m unittest -v tests.test_actual_final_presentation
          git diff --check

          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          css = Path("public/assets/styles.css").read_text(
              encoding="utf-8"
          )
          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced")

          definitions = set(re.findall(r"--([\w-]+)\s*:", css))
          references = set(re.findall(r"var\(--([\w-]+)", css))
          unresolved = references - definitions
          if unresolved:
              raise SystemExit(
                  f"Unresolved CSS custom properties: {sorted(unresolved)}"
              )
          print("CSS structural checks passed")
          PY

      - name: Confirm model and data are untouched
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "scripts/model.py $(git hash-object scripts/model.py)"
            echo "scripts/build_site.py $(git hash-object scripts/build_site.py)"
            echo "config/elo_matches.json $(git hash-object config/elo_matches.json)"
            echo "config/forecast_layer.json $(git hash-object config/forecast_layer.json)"
            echo "config/venue_effects.json $(git hash-object config/venue_effects.json)"
          } > /tmp/nfelo-protected-after

          diff -u \
            /tmp/nfelo-protected-before \
            /tmp/nfelo-protected-after

          git diff --quiet -- \
            scripts/model.py \
            scripts/build_site.py \
            config/elo_matches.json \
            config/forecast_layer.json \
            config/venue_effects.json \
            source \
            public/data

          python - <<'PY'
          from __future__ import annotations

          import subprocess

          allowed_exact = {
              "public/assets/app.js",
              "public/assets/styles.css",
              "tests/test_actual_final_presentation.py",
              "config/404.html",
              ".github/workflows/install-nfelo-true-actual-final-presentation.yml",
          }
          unexpected = []
          status = subprocess.check_output(
              ["git", "status", "--short"],
              text=True,
          )
          for line in status.splitlines():
              path = line[3:]
              if (
                  path in allowed_exact
                  or (
                      path.startswith("public/")
                      and path.endswith("/index.html")
                  )
                  or path == "public/index.html"
              ):
                  continue
              unexpected.append(line)
          if unexpected:
              raise SystemExit(
                  "Unexpected changed files:\n" + "\n".join(unexpected)
              )
          print("Only presentation files and asset references changed")
          PY

      - name: Remove this one-time installer
        shell: bash
        run: |
          set -euo pipefail
          installer=".github/workflows/install-nfelo-true-actual-final-presentation.yml"
          if [[ ! -f "$installer" ]]; then
            echo "::error::The installer must be saved at $installer"
            exit 1
          fi
          rm "$installer"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && [[ -z "$(git status --short)" ]]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m \
            "Complete the final presentation art direction"
          git push origin HEAD:main

      - name: Start the normal Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
