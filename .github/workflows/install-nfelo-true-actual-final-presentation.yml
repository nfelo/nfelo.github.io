name: Install NFELO true actual final presentation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-nfelo-true-actual-final-presentation
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check repository and compatibility
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "nfelo/nfelo.github.io" ]]; then
            echo "::error::This installer is only for nfelo/nfelo.github.io."
            exit 1
          fi

          needs_apply=0

          check_old_or_new() {
            local path="$1"
            local old_blob="$2"
            local new_blob="$3"
            local actual

            if [[ ! -f "$path" ]]; then
              echo "::error::$path is missing."
              exit 1
            fi
            actual="$(git hash-object "$path")"
            if [[ "$actual" == "$new_blob" ]]; then
              return
            fi
            if [[ "$actual" == "$old_blob" ]]; then
              needs_apply=1
              return
            fi
            echo "::error::$path has unexpected contents ($actual)."
            echo "The installer stopped rather than overwriting a newer edit."
            exit 1
          }

          check_old_or_new \
            public/assets/styles.css \
            c2d0ac5d208f8fb4de87856bf7f5a06a41b98986 \
            ae957092a0311aad42eb43469100107e8f746baf
          check_old_or_new \
            public/assets/app.js \
            da79cc4453e6bccae8e06c1cb2653721ec30132d \
            4813176c0ebc4ff4dc864a004c84fa359170de94

          if [[ -f tests/test_actual_final_presentation.py ]]; then
            actual="$(git hash-object tests/test_actual_final_presentation.py)"
            if [[ "$actual" != "ab7d6f50caee260cbd690a0b7c555a83ae240713" ]]; then
              echo "::error::tests/test_actual_final_presentation.py has unexpected contents ($actual)."
              exit 1
            fi
          else
            needs_apply=1
          fi

          {
            echo "scripts/model.py $(git hash-object scripts/model.py)"
            echo "scripts/build_site.py $(git hash-object scripts/build_site.py)"
            echo "config/elo_matches.json $(git hash-object config/elo_matches.json)"
            echo "config/forecast_layer.json $(git hash-object config/forecast_layer.json)"
            echo "config/venue_effects.json $(git hash-object config/venue_effects.json)"
          } > /tmp/nfelo-protected-before

          if [[ "$needs_apply" -eq 0 ]]; then
            echo "The true final presentation pass is already installed."
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install presentation source files
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode > /tmp/nfelo-true-actual-final-presentation.tar.xz <<'NFELO_ARCHIVE'
