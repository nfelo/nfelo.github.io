name: Install compact title chance and restore Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-compact-title-chance-and-restore-pages
  cancel-in-progress: false

jobs:
  install:
    name: Install the layout and restore the scheduler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decode and apply the focused change
        id: payload
        shell: bash
        env:
          CHANGESET_B64: ""
          CHANGESET_SHA256: "364f91ca4275d390ebe1a64a05bded7ce5bdc64ad62ac945075971ab3be93c16"
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main

          patch_file="$RUNNER_TEMP/compact-title-chance-pages.patch"
          printf '%s' "$CHANGESET_B64"             | base64 --decode             | gzip --decompress > "$patch_file"
          printf '%s  %s\n' "$CHANGESET_SHA256" "$patch_file"             | sha256sum --check

          if git apply --check "$patch_file"; then
            git apply --index --3way "$patch_file"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git apply --reverse --check "$patch_file"; then
            echo "The focused change is already installed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The tested change no longer applies cleanly to current main."
            exit 1
          fi
          git diff --cached --check

      - name: Refresh route asset revisions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path("public")
          assets = root / "assets"
          revisions = {
              "styles.css": hashlib.sha256(
                  (assets / "styles.css").read_bytes()
              ).hexdigest()[:12],
              "app.js": hashlib.sha256(
                  (assets / "app.js").read_bytes()
              ).hexdigest()[:12],
          }
          routes = sorted(root.rglob("index.html"))
          if len(routes) < 250:
              raise AssertionError(
                  f"Expected at least 250 generated routes, found {len(routes)}"
              )

          changed = 0
          for route in routes:
              text = route.read_text(encoding="utf-8")
              updated = re.sub(
                  r"assets/styles\.css\?v=[0-9a-f]{12}",
                  f"assets/styles.css?v={revisions['styles.css']}",
                  text,
              )
              updated = re.sub(
                  r"assets/app\.js\?v=[0-9a-f]{12}",
                  f"assets/app.js?v={revisions['app.js']}",
                  updated,
              )
              if updated != text:
                  route.write_text(updated, encoding="utf-8")
                  changed += 1

              verified = route.read_text(encoding="utf-8")
              if verified.count(
                  f"assets/styles.css?v={revisions['styles.css']}"
              ) != 3:
                  raise AssertionError(
                      f"{route} does not contain all three CSS revisions"
                  )
              if verified.count(
                  f"assets/app.js?v={revisions['app.js']}"
              ) != 1:
                  raise AssertionError(
                      f"{route} does not contain the JavaScript revision"
                  )

          print(
              {
                  "routes": len(routes),
                  "routes_updated": changed,
                  **revisions,
              }
          )
          PY
          git add -- public
          git diff --cached --check

      - name: Run focused permanent regression checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          python -m py_compile             tests/test_tournament_title_chances.py             tests/test_tournament_ui_ci_repair.py
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/pages.yml").read_text(encoding="utf-8")
          required = (
              "name: Validate, refresh and deploy Pages",
              "\n  refresh_source:\n",
              "\n  build:\n",
              "\n  commit_source:\n",
              "\n  deploy:\n",
              "python scripts/validate_live_replay.py",
          )
          for marker in required:
              if text.count(marker) != 1:
                  raise AssertionError(
                      f"Unexpected Pages workflow marker {marker!r}"
                  )
          for forbidden in ("install_repair:", "release_gate:"):
              if forbidden in text:
                  raise AssertionError(
                      f"Temporary installer logic remains: {forbidden}"
                  )
          PY
          python -m unittest -v             tests.test_tournament_ui_ci_repair             tests.test_ribbon_atelier.RibbonAtelierReleaseTests.test_working_type_has_legible_floors             tests.test_couture_alphabet.CoutureAlphabetTests.test_no_information_or_result_semantics_are_hidden_or_recoloured             tests.test_editorial_keepsake.EditorialKeepsakeReleaseTests.test_playful_details_are_css_only_and_preference_safe             tests.test_girlish_heirloom.GirlishHeirloomReleaseTests.test_playful_details_are_css_only_and_preference_safe             tests.test_moonlit_matchbook.MoonlitMatchbookReleaseTests.test_release_is_css_only_and_preference_safe             tests.test_pearl_vanity_finale.PearlVanityFinaleTests.test_release_is_css_only_and_preference_safe
          git diff --cached --check

      - name: Commit the change and retire temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_ref="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_path="${workflow_ref%@*}"

          case "$workflow_path" in
            .github/workflows/*.yml|.github/workflows/*.yaml)
              ;;
            *)
              echo "::error::Unexpected installer path: $workflow_path"
              exit 1
              ;;
          esac
          if [ "$workflow_path" = ".github/workflows/pages.yml" ]; then
            echo "::error::Install this file under its supplied filename, not as pages.yml."
            exit 1
          fi

          git rm --ignore-unmatch --             "$workflow_path"             .github/workflows/repair-tournament-interface-and-pages-v5.yml

          git diff --cached --name-only | while IFS= read -r path; do
            if [ "$path" = "$workflow_path" ]; then
              continue
            fi
            case "$path" in
              .github/workflows/pages.yml|.github/workflows/repair-tournament-interface-and-pages-v5.yml|public/assets/app.js|public/assets/styles.css|public/index.html|public/*/index.html|tests/test_tournament_title_chances.py|tests/test_tournament_ui_ci_repair.py)
                ;;
              *)
                echo "::error::Unexpected staged path: $path"
                exit 1
                ;;
            esac
          done

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: compact title chances and restore Pages [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start the restored Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..18}; do
            if gh workflow run pages.yml               --repo "$GITHUB_REPOSITORY"               --ref main               -f refresh_source=false               -f full_refresh=false; then
              echo "The restored Pages build and deployment has started."
              exit 0
            fi
            echo "::notice::Waiting for GitHub to register pages.yml (attempt $attempt of 18)."
            sleep 5
          done
          echo "::error::The change was installed, but the Pages deployment could not be started."
          exit 1
