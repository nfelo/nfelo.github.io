          NFELO_FILES

      - name: Build and test the complete site
        shell: bash
        run: |
          set -euo pipefail

          node --check public/assets/app.js
          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          root = Path(".")
          app = (
              root / "public/assets/app.js"
          ).read_text(encoding="utf-8")
          css = (
              root / "public/assets/styles.css"
          ).read_text(encoding="utf-8")
          readme = (
              root / "README.md"
          ).read_text(encoding="utf-8")
          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )

          replay = summary["validation"]["retrospective"]
          benchmark = summary["validation"]["nested"]
          if replay["matches"] != 46_801:
              raise SystemExit(
                  f"Unexpected replay size: {replay['matches']}"
              )
          if abs(replay["log_loss"] - 0.87833346) > 0.000005:
              raise SystemExit(
                  f"Current log loss moved: {replay['log_loss']}"
              )
          if (
              abs(replay["accuracy"] - 0.59169676)
              > 2.5 / replay["matches"]
          ):
              raise SystemExit(
                  f"Current accuracy moved: {replay['accuracy']}"
              )
          expected_benchmark = {
              "matches": 46_801,
              "log_loss": 0.8842187104883077,
              "accuracy": 0.59095,
              "best_scalar_elo_log_loss": 0.8929697600474259,
              "best_scalar_elo_accuracy": 0.58527,
              "g_elo_log_loss": 0.895187,
              "g_elo_accuracy": 0.58779,
              "published_wfe_log_loss": 0.9026185159798847,
              "published_wfe_accuracy": 0.58804,
          }
          for key, expected in expected_benchmark.items():
              actual = benchmark[key]
              if isinstance(expected, int):
                  if actual != expected:
                      raise SystemExit(
                          f"Benchmark {key} moved: {actual}"
                      )
              elif abs(actual - expected) > 5e-8:
                  raise SystemExit(
                      f"Benchmark {key} moved: {actual}"
                  )

          home = app.split(
              "async function renderHome()",
              1,
          )[1].split("function renderRankings", 1)[0]
          faq = app.split(
              "function buildFAQItems()",
              1,
          )[1].split("function faqSearchTokens", 1)[0]
          methodology = app.split(
              "function renderMethodology(query",
              1,
          )[1].split("function renderAbout", 1)[0]
          about = app.split(
              "function renderAbout()",
              1,
          )[1].split("function renderNotFound", 1)[0]
          score_panel = app.split(
              'const scorePanel = scoreProfile ? `',
              1,
          )[1].split('` : "";', 1)[0]

          for name, section in (
              ("home", home),
              ("FAQ", faq),
              ("About", about),
          ):
              if (
                  "percent("
                  "summary.validation.retrospective.accuracy)"
                  not in section
              ):
                  raise SystemExit(
                      f"{name} does not use rounded accuracy."
                  )
              if (
                  "summary.validation.retrospective.log_loss"
                  in section
                  or "precisePercent("
                  "summary.validation.retrospective.accuracy)"
                  in section
              ):
                  raise SystemExit(
                      f"{name} exposes excessive technical precision."
                  )

          required_methodology = (
              "Current deployed NFELO formula",
              "Final-formula replay",
              "Earlier NFELO network benchmark",
              "Best tested scalar Elo",
              "G-Elo comparison",
              "Published World Football Elo forecast",
              "Five-block historical holdout",
              "number(replay.log_loss, 6)",
              "precisePercent(replay.accuracy)",
              "number(benchmark.log_loss, 6)",
              "number(benchmark.best_scalar_elo_log_loss, 6)",
              "number(benchmark.g_elo_log_loss, 6)",
              "number(benchmark.published_wfe_log_loss, 6)",
              "should not be read as a clean head-to-head",
          )
          for phrase in required_methodology:
              if phrase not in methodology:
                  raise SystemExit(
                      f"Methodology comparison missing: {phrase}"
                  )

          if faq.count('question: "') != 33:
              raise SystemExit("FAQ question count changed.")
          answers = re.findall(
              r'answer: (?:"([^"]*)"|`([^`]*)`)',
              faq,
          )
          if len(answers) != 33:
              raise SystemExit("Could not inspect every FAQ answer.")
          for first, second in answers:
              answer = re.sub(
                  r"\$\{[^}]+\}",
                  "value",
                  first or second,
              )
              words = re.findall(
                  r"[\w’%-]+",
                  answer,
                  flags=re.UNICODE,
              )
              if len(words) < 34:
                  raise SystemExit(
                      f"FAQ answer is too terse: {answer}"
                  )
          if (
              "summary.validation.retrospective.log_loss"
              in faq
          ):
              raise SystemExit(
                  "FAQ exposes the exact log-loss field."
              )

          required_score = (
              "<b>Attack and defence</b>",
              "Own expected goals",
              "Opponent expected goals",
              "Attack residual",
              "Defence residual",
              "after each completed matchday",
              "How the forecast layer works",
          )
          for phrase in required_score:
              if phrase not in score_panel:
                  raise SystemExit(
                      f"Team forecast panel missing: {phrase}"
                  )
          for repeated_detail in (
              "Last matchday update",
              "Reversion half-life",
          ):
              if repeated_detail in score_panel:
                  raise SystemExit(
                      f"Team forecast panel is overloaded: "
                      f"{repeated_detail}"
                  )
          if score_panel.count("<div><span>") != 4:
              raise SystemExit(
                  "Team forecast panel must contain four metrics."
              )

          for marker in (
              ".score-profile-details .venue-detail-grid",
              "grid-template-columns: repeat(2, minmax(0, 1fr));",
              "@media (max-width: 720px)",
          ):
              if marker not in css:
                  raise SystemExit(
                      f"Responsive score-panel CSS missing: {marker}"
                  )

          normalised_readme = " ".join(readme.split())
          for phrase in (
              "59.2%",
              "methodology validation section",
              "exact unrounded accuracy and log-loss score",
          ):
              if phrase not in normalised_readme.lower():
                  raise SystemExit(
                      f"README summary missing: {phrase}"
                  )
          for excessive in ("59.170%", "0.878333"):
              if excessive in readme:
                  raise SystemExit(
                      f"README exposes excessive precision: {excessive}"
                  )

          if summary["current"][0]["nation"] != "Spain":
              raise SystemExit("Current No. 1 guardrail failed.")
          england_rank = next(
              index
              for index, team in enumerate(
                  summary["current"],
                  start=1,
              )
              if team["nation"] == "England"
          )
          if england_rank != 6:
              raise SystemExit(
                  f"England ranking moved to {england_rank}."
              )
          early_british = {
              "England",
              "Scotland",
              "Wales",
              "Northern Ireland",
          }
          count = sum(
              peak["nation"] in early_british
              and peak["date"] < "1914-01-01"
              for peak in summary["peaks"][:10]
          )
          if count > 1:
              raise SystemExit(
                  "Early British peak guardrail failed."
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Prove a second build is identical
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          hashes = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(
                  root / "public/data/fixtures.json"
              ),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          (
              Path(os.environ["RUNNER_TEMP"])
              / "first-build-hashes.json"
          ).write_text(
              json.dumps(hashes, sort_keys=True),
              encoding="utf-8",
          )
          PY

          python scripts/build_site.py \
            --source source \
            --config config \
            --output public
          node --check public/assets/app.js
          python -m unittest discover \
            --start-directory tests \
            --verbose
          python scripts/audit_site_consistency.py \
            --public public

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(
              (
                  root / "public/data/summary.json"
              ).read_text(encoding="utf-8")
          )
          summary["meta"].pop("generated_at", None)
          actual = {
              "state": digest(root / "public/data/state.json"),
              "summary": hashlib.sha256(
                  json.dumps(
                      summary,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest(),
              "fixtures": digest(
                  root / "public/data/fixtures.json"
              ),
              "prospective": digest(
                  root / "source/prospective_forecasts.jsonl"
              ),
          }
          expected = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "first-build-hashes.json"
              ).read_text(encoding="utf-8")
          )
          if actual != expected:
              raise SystemExit(
                  f"The second build was not deterministic.\n"
                  f"Expected: {expected}\nActual: {actual}"
              )
          PY

          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"

      - name: Commit and publish the verified release
        shell: bash
        run: |
          set -euo pipefail

          git add \
            README.md \
            public \
            source/prospective_forecasts.jsonl \
            tests/test_build.py

          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "::error::The installer produced no staged changes."
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "$path" in
              README.md|public/*|source/prospective_forecasts.jsonl|tests/test_build.py)
                ;;
              *)
                echo "::error file=$path::Unexpected staged path."
                exit 1
                ;;
            esac
          done

          if git diff --cached --name-only \
            | grep -q '^\.github/workflows/pages\.yml$'; then
            echo "::error::.github/workflows/pages.yml must not be changed."
            exit 1
          fi
          sha256sum --check --strict \
            "$RUNNER_TEMP/pages-before.sha256"
          git diff --cached --check

          git fetch origin main
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$start_sha" ]; then
            echo "::error::main changed while the installer was validating. Nothing was pushed; rerun the installer on the new main branch."
            echo "Started at: $start_sha"
            echo "Current:    $remote_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "docs(ui): simplify accuracy and add benchmark context"
          git push origin HEAD:main

      - name: Installation summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Concise accuracy and benchmark update installed"
            echo
            echo "- Homepage, FAQ and About use rounded 59.2% accuracy."
            echo "- Exact accuracy and log loss remain in Methodology."
            echo "- Methodology includes clearly labelled model benchmarks."
            echo "- FAQ explanations are fuller without becoming technical."
            echo "- Team attack/defence details retain four team-specific values."
            echo "- Ratings, model parameters and pages.yml were not changed."
            echo
            echo "The normal Pages workflow should now deploy the verified commit."
            echo "After that succeeds, delete this one-use installer workflow."
          } >> "$GITHUB_STEP_SUMMARY"
