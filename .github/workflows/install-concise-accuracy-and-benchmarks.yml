          ARCHIVE_PATH="$archive" python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          expected = [
              "README.md",
              "public/assets/app.js",
              "public/assets/styles.css",
              "tests/test_build.py",
          ]
          archive = Path(os.environ["ARCHIVE_PATH"])
          with tarfile.open(archive, "r:xz") as handle:
              members = handle.getmembers()
          names = [member.name for member in members]
          if names != expected:
              raise SystemExit(
                  f"Unexpected release archive contents: {names}"
              )
          for member in members:
              path = PurePosixPath(member.name)
              if (
                  path.is_absolute()
                  or ".." in path.parts
                  or not member.isfile()
              ):
                  raise SystemExit(
                      f"Unsafe release archive member: {member.name}"
                  )
          PY

          tar -xJf "$archive"

          sha256sum --check --strict <<'NFELO_FILES'
          6535013260b9915843a10e7412ba3f760c41b2b51bc6e47841e7f3102717b23c  README.md
          9e39877c58545e74ebfebc5f42c728f54c5ca17db7742185b8bc0d0fa5e4708d  public/assets/app.js
          b80c851f98c21452c88c68ea234ebbd5a4ad4b626f93d8604290e8458eed3fc8  public/assets/styles.css
