name: Install multi-team Compare

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-multiteam-compare
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require the intended clean repository
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "nfelo/nfelo.github.io" ]; then
            echo "::error::This installer is only for nfelo/nfelo.github.io."
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The checkout is unexpectedly dirty."
            git status --short
            exit 1
          fi

      - name: Verify the live file versions
        shell: bash
        run: |
          set -euo pipefail
          declare -A baseline=(
            ["public/assets/app.js"]="813615a3484ddbe322279923220b385fa64e2561f2aa6a1bc0cd91b0c9c28806"
            ["public/assets/styles.css"]="cd795106e0dd35acf369b349da7d863df180cdacd012c231c0fbac0cb6625791"
            ["scripts/build_site.py"]="89850fa0aa6bdfa3f08ca2084e04c1d8d57da2840b1528a04dad8c878c61cae9"
            ["tests/test_build.py"]="a5e1d7c252c5ac80c141645017a888396a03c33445601b497e8c61e4ce32e717"
          )
          declare -A target=(
            ["public/assets/app.js"]="6deae1849dee416af36f75d24f4dd02422fcfcee63ca1e103248c64d11b0a9a9"
            ["public/assets/styles.css"]="46817923ce2bbce7ab1510a7cf151e382c174132e94253de64a04300af448907"
            ["scripts/build_site.py"]="ed74f1fe0ca3ab97376ff7ecb00fb8e90598beebb846d7e5db1a9dd8b7157952"
            ["tests/test_build.py"]="3055c721f9f80d6b0f4116b8569ed4112bca648a50e1183d9bf2b13617d8e07c"
          )
          for path in "${!baseline[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Required file is missing."
              exit 1
            fi
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "${baseline[$path]}" ] && [ "$actual" != "${target[$path]}" ]; then
              echo "::error file=$path::The file has changed since this installer was audited. Refusing to overwrite it."
              echo "Expected current ${baseline[$path]} or installed ${target[$path]}, found $actual"
              exit 1
            fi
          done

      - name: Decode and verify the audited release
        shell: bash
        env:
          UPDATE_ARCHIVE: 
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfelo-multiteam-compare-release.tar.xz"
          release="$RUNNER_TEMP/nfelo-multiteam-compare-release"
          printf '%s' "$UPDATE_ARCHIVE" | tr -d '[:space:]' | base64 --decode > "$archive"
          echo "5555eac0729585fe0277f26a8d7399414b59b1d03699bb1ef149b6eb6ef2323b  $archive" | sha256sum --check
          expected="$(
            printf '%s\n' \
              public/assets/app.js \
              public/assets/styles.css \
              scripts/build_site.py \
              tests/test_build.py |
              sort
          )"
          actual="$(tar -tJf "$archive" | sed 's#^\./##' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The release archive contains an unexpected path."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          mkdir -p "$release"
          tar -xJf "$archive" -C "$release"
          (
            cd "$release"
            sha256sum --check <<'CHECKSUMS'
          6deae1849dee416af36f75d24f4dd02422fcfcee63ca1e103248c64d11b0a9a9  public/assets/app.js
          46817923ce2bbce7ab1510a7cf151e382c174132e94253de64a04300af448907  public/assets/styles.css
          ed74f1fe0ca3ab97376ff7ecb00fb8e90598beebb846d7e5db1a9dd8b7157952  scripts/build_site.py
          3055c721f9f80d6b0f4116b8569ed4112bca648a50e1183d9bf2b13617d8e07c  tests/test_build.py
          CHECKSUMS
          )

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the reproducible runtime
        run: python -m pip install --requirement requirements.txt

      - name: Validate the complete release in isolation
        shell: bash
        run: |
          set -euo pipefail
          validation="$RUNNER_TEMP/nfelo-multiteam-compare-validation"
          release="$RUNNER_TEMP/nfelo-multiteam-compare-release"
          mkdir -p "$validation"
          rsync -a --exclude='.git' ./ "$validation/"
          rsync -a --checksum "$release/" "$validation/"
          cd "$validation"
          python scripts/build_site.py --source source --config config --output public
          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js

      - name: Publish the four audited files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/nfelo-multiteam-compare-release"
          rsync -a --checksum "$release/" ./
          git diff --check -- \
            public/assets/app.js \
            public/assets/styles.css \
            scripts/build_site.py \
            tests/test_build.py
          git add -- \
            public/assets/app.js \
            public/assets/styles.css \
            scripts/build_site.py \
            tests/test_build.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The audited multi-team Compare release is already installed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add multi-team historical comparisons"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the normal Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
          echo "The normal Pages workflow has been queued."

      - name: Write installation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Multi-team Compare installer"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Installed and validated the 2–10 team Compare page, historical teams, responsive chart controls and date-correct historical names."
              echo
              echo "The normal Pages rebuild has been queued. This one-time installer workflow can now be deleted."
            else
              echo "The installer stopped before publication or deployment. Read the first failed step; guarded files were not overwritten after a failed validation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
