name: Install NFELO atelier reverie

# Presentation only:
# 1. Ballet-wrap selected navigation and tab states.
# 2. Porcelain cameo settings for headline ratings.
# 3. Micro-embroidered heading and section seams.
# 4. Opal and moonstone chart mats.
# 5. Fine-jewellery tray compartments for metrics.
# 6. Glossed silk data bars with semantic colours preserved.
# 7. Delicate perfume-label microtype.
# 8. Pink-sapphire keyboard focus halos.
# 9. Alternating draped card silhouettes.
# 10. Bridal-stationery double rules on utility panels.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-nfelo-atelier-reverie
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check compatibility
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail

          hash_file() {
            sha256sum "$1" | awk '{print $1}'
          }

          old_styles="05d5b0fb14d3489a606395f487ddf5f43177c736b838aecfc2d6ef66a137f1e3"
          old_404="0fa4aeac6c8ea3945bf0ffb1e699850acbec4109e001d07878df614e46e7800b"
          old_test="deb45442ace7f31b6a99d21128b23dc60f6f62c5348e93bd5492184cdd4758e9"

          new_styles="334d9f1fd15782be7c0a8f38aa9021986b77be9e59304df9eb46dfeae83b9997"
          new_404="1bba4e4ca7416acfb38384a5e4002eae2fcf3b6740f945d9a296e934094cf50d"
          new_test="476bdcc709d885de6bbf7020ddfc007998354f6df0061d7d6f422a134748f393"

          actual_styles="$(hash_file public/assets/styles.css)"
          actual_404="$(hash_file config/404.html)"
          actual_test="$(hash_file tests/test_presentation.py)"

          if [[ "$actual_styles" == "$new_styles" &&
                "$actual_404" == "$new_404" &&
                "$actual_test" == "$new_test" ]]; then
            echo "The atelier reverie layer is already installed."
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$actual_styles" != "$old_styles" ||
                "$actual_404" != "$old_404" ||
                "$actual_test" != "$old_test" ]]; then
            echo "::error::A presentation source file changed after this installer was audited."
            echo "Expected current stylesheet: $old_styles"
            echo "Actual current stylesheet:   $actual_styles"
            echo "Expected current 404:        $old_404"
            echo "Actual current 404:          $actual_404"
            echo "Expected current test:       $old_test"
            echo "Actual current test:         $actual_test"
            exit 1
          fi

          echo "apply=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.compatibility.outputs.apply == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install audited presentation sources
