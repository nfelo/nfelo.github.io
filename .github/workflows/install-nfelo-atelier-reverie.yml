      - name: Rebuild site
        if: steps.compatibility.outputs.apply == 'true'
        run: python scripts/build_site.py --source source --config config --output public

      - name: Run full test suite
        if: steps.compatibility.outputs.apply == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate JavaScript and generated presentation
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check public/assets/app.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          root = Path(".")

          expected = {
              "public/assets/styles.css":
                  "334d9f1fd15782be7c0a8f38aa9021986b77be9e59304df9eb46dfeae83b9997",
              "config/404.html":
                  "1bba4e4ca7416acfb38384a5e4002eae2fcf3b6740f945d9a296e934094cf50d",
              "tests/test_presentation.py":
                  "476bdcc709d885de6bbf7020ddfc007998354f6df0061d7d6f422a134748f393",
          }
          for path, wanted in expected.items():
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(
                      f"{path} changed unexpectedly: {actual} != {wanted}"
                  )

          if (
              (root / "config/404.html").read_bytes()
              != (root / "public/404.html").read_bytes()
          ):
              raise SystemExit("The generated 404 page does not match its source.")

          stylesheet_hash = expected["public/assets/styles.css"][:12]
          routes = sorted((root / "public").glob("**/index.html"))
          if not routes:
              raise SystemExit("No clean-route pages were generated.")

          version_marker = f"assets/styles.css?v={stylesheet_hash}"
          for route in routes:
              if version_marker not in route.read_text(encoding="utf-8"):
                  raise SystemExit(
                      f"{route} does not use stylesheet {stylesheet_hash}."
                  )

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True,
          ).splitlines()
          exact = {
              "config/404.html",
              "public/assets/styles.css",
              "tests/test_presentation.py",
          }
          route_changes = []
          for path in changed:
              if path in exact:
                  continue
              if path == "public/index.html" or (
                  path.startswith("public/")
                  and path.endswith("/index.html")
              ):
                  route_changes.append(path)
                  continue
              raise SystemExit(f"Unexpected changed file: {path}")

          if len(route_changes) != len(routes):
              raise SystemExit(
                  "Not every clean route received the new stylesheet hash: "
                  f"{len(route_changes)} changed for {len(routes)} routes."
              )

          def normalise_hash(value: str) -> str:
              return re.sub(
                  r"assets/styles\.css\?v=[0-9a-f]{12}",
                  "assets/styles.css?v=HASH",
                  value,
              )

          for path in route_changes:
              before = subprocess.check_output(
                  ["git", "show", f"HEAD:{path}"],
                  text=True,
              )
              after = (root / path).read_text(encoding="utf-8")
              if normalise_hash(before) != normalise_hash(after):
                  raise SystemExit(
                      f"{path} changed beyond its stylesheet cache hash."
                  )

          finish = (root / "public/assets/styles.css").read_text(
              encoding="utf-8"
          ).split(
              "Atelier reverie: "
              "ten further feminine refinements",
              1,
          )[1]
          for forbidden in (
              ".svg",
              "url(",
              "-webkit-mask:",
              "mask:",
              "--bow-mask",
              "--blossom-mask",
              "--flower-mask",
              "animation:",
              "--result-win:",
              "--result-loss:",
          ):
              if forbidden in finish:
                  raise SystemExit(
                      f"Forbidden presentation override found: {forbidden}"
                  )

          print(
              "Presentation audit passed: "
              f"{len(routes)} routes, stylesheet {stylesheet_hash}."
          )
          PY

      - name: Commit and publish
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add \
            config/404.html \
            public/assets/styles.css \
            tests/test_presentation.py

          while IFS= read -r -d '' route; do
            git add -- "$route"
          done < <(find public -name index.html -type f -print0)

          if git diff --cached --quiet; then
            echo "No presentation changes remain to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add NFELO atelier reverie presentation layer"
          git push origin HEAD:main

      - name: Already installed
        if: steps.compatibility.outputs.apply == 'false'
        run: echo "No changes were needed."
