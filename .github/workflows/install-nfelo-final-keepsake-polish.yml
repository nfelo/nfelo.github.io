      - name: Rebuild the site
        if: steps.compatibility.outputs.apply == 'true'
        run: python scripts/build_site.py --source source --config config --output public

      - name: Verify every page, theme and breakpoint contract
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover --start-directory tests --verbose
          node --check public/assets/app.js
          python scripts/audit_site_consistency.py --public public
          npx --yes csstree-validator@4.0.1 public/assets/styles.css
          git diff --check

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          public = Path("public")
          routes = sorted(public.rglob("index.html"))
          if len(routes) < 250:
              raise SystemExit(f"Only {len(routes)} generated routes were found")

          css_hash = hashlib.sha256(
              (public / "assets" / "styles.css").read_bytes()
          ).hexdigest()[:12]
          required = (
              "20260728f2",
              f"assets/styles.css?v={css_hash}",
              "favicon-2026.svg?v=20260728f2",
              "apple-touch-icon-2026.png?v=20260728f2",
              "social-card.png?v=20260728f2",
          )
          for route in routes:
              html = route.read_text(encoding="utf-8")
              missing = [marker for marker in required if marker not in html]
              if missing:
                  raise SystemExit(f"{route} is missing {missing}")
              if "20260728f1" in html:
                  raise SystemExit(f"{route} still uses the previous icon release")

          def png_dimensions(path: Path) -> tuple[int, int]:
              payload = path.read_bytes()
              if payload[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path} is not a PNG")
              return (
                  int.from_bytes(payload[16:20], "big"),
                  int.from_bytes(payload[20:24], "big"),
              )

          expected_dimensions = {
              "apple-touch-icon-2026.png": (180, 180),
              "icon-192-2026.png": (192, 192),
              "icon-512-2026.png": (512, 512),
              "social-card.png": (1200, 630),
          }
          for name, dimensions in expected_dimensions.items():
              actual = png_dimensions(public / name)
              if actual != dimensions:
                  raise SystemExit(
                      f"{name}: expected {dimensions}, found {actual}"
                  )

          manifest = json.loads(
              (public / "site.webmanifest").read_text(encoding="utf-8")
          )
          purposes = {
              item.get("purpose")
              for item in manifest.get("icons", [])
          }
          if "any maskable" not in purposes:
              raise SystemExit("The Android manifest lost maskable support")

          print(
              f"Verified {len(routes)} routes, responsive contracts, "
              "both themes and every icon surface."
          )
          PY

      - name: Commit and publish
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            config/404.html \
            public \
            tests/test_build.py \
            tests/test_presentation.py

          if git diff --cached --quiet; then
            echo "No presentation changes remain to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish NFELO keepsake presentation and emblem"
          git push origin HEAD:main

      - name: Already installed
        if: steps.compatibility.outputs.apply != 'true'
        run: echo "Nothing changed; the final keepsake polish is already live."
