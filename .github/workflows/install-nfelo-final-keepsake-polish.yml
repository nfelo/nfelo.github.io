          ee4f8d1823c065e8c329a22bc5a7122c8ebb155a9fba88f7d69c83df1d7d0787  public/icon-512-2026.png
          c083f9bcddc0b2f42a681bede4db76b479e9229cb7b62d1b1bf6aecfcd83ecf6  public/favicon-2026.ico
          c083f9bcddc0b2f42a681bede4db76b479e9229cb7b62d1b1bf6aecfcd83ecf6  public/favicon.ico
          0044ff31daf635a82da762184c956bd67ee221357a80346becc84290c4aa905c  public/social-card.png
