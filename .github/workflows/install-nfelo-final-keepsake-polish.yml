name: Install NFELO final keepsake polish

# Presentation-only release:
# 1. A restrained couture scallop joins the header and footer.
# 2. Selected controls receive a mirror-lacquer finish.
# 3. Form controls read as clear blush-glass vanity drawers.
# 4. Table headings gain a fine pleated-satin rhythm.
# 5. Wide data areas gain visible pearl-finished scrollbars.
# 6. Existing data markers become polished cabochons.
# 7. Disclosure panels open like restrained powder compacts.
# 8. Pagination becomes a compact, touch-friendly vanity tray.
# 9. Selection, link, empty and error states share one rosewater language.
# 10. One pearl-cameo N emblem unifies browser, Apple, Android and sharing art.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-nfelo-final-keepsake-polish
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check compatibility
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail

          needs_apply=0

          check_file() {
            local path="$1"
            local old_blob="$2"
            local new_blob="$3"
            local actual

            if [[ ! -f "$path" ]]; then
              echo "::error::Required file is missing: $path"
              exit 1
            fi

            actual="$(git hash-object "$path")"
            if [[ "$actual" == "$new_blob" ]]; then
              return
            fi
            if [[ "$actual" == "$old_blob" ]]; then
              needs_apply=1
              return
            fi

            echo "::error::$path changed after this installer was audited."
            echo "Expected current blob: $old_blob"
            echo "Expected final blob:   $new_blob"
            echo "Actual blob:           $actual"
            exit 1
          }

          check_file \
            config/404.html \
            daa11b03ccf763bfb509f0580d127d3b99f893b6 \
            6c3af047ac15e1385ef45498757086e9302b6402
          check_file \
            public/assets/styles.css \
            38c091f9f3e6d6d229e2338647654055b73f5456 \
            5c1ee796dd4bb404f4b52cc259febedfb3be6c04
          check_file \
            public/favicon-2026.svg \
            b462b3bc38220fd8b9c7bb15812eca14afffef29 \
            c269fe4ddd6f41a9348ae75c1f303722b8d7dee8
          check_file \
            public/favicon.svg \
            b462b3bc38220fd8b9c7bb15812eca14afffef29 \
            c269fe4ddd6f41a9348ae75c1f303722b8d7dee8
          check_file \
            public/apple-touch-icon-2026.png \
            2eea9ccd5c393c20bc9df36123e234a4969923a8 \
            9765d0b585804d21d0f66a500387d9449f8e3fcb
          check_file \
            public/icon-192-2026.png \
            2e2dfcc338b6664969283b9533b2e5234b9a551d \
            80e47d0ecb2ec7090ca023529e99df2cea74cd3d
          check_file \
            public/icon-512-2026.png \
            b4939a7b2f81917802027b0e4a9fec24a7dcafdb \
            44bb7fdd7c890153e13037d683e26fbecbb98627
          check_file \
            public/favicon-2026.ico \
            ec29876edd3f4b2e5f7e009d72587f1aa39465c1 \
            f567de9ae9f215241d91e6729b17343bd8df0266
          check_file \
            public/favicon.ico \
            ec29876edd3f4b2e5f7e009d72587f1aa39465c1 \
            f567de9ae9f215241d91e6729b17343bd8df0266
          check_file \
            public/social-card.svg \
            eb9f7d01df9e9dc5b8626f8093af155b7d55225f \
            0e33bcefb1f51fb4699b19122b9876fcbe67683c
          check_file \
            public/social-card.png \
            abad4bae4781fc7db4fff7a38ccee460917f3dfa \
            e4cac8269875518fbddce4e3ca21be39cfc34c87
          check_file \
            public/site.webmanifest \
            a3606ccbfed521068e65d1bc61e9533d430c7820 \
            c8737547198ded1af196271b070fdd35f22bf4bd
          check_file \
            public/index.html \
            bab1982ef26e2cb373d84b3e5b96233b8ac76af8 \
            9072c86745efff6b069a17d3b437db38e8637fbd
          check_file \
            tests/test_build.py \
            bafdef73c07c862931a3b30d5cae4194de39b9fb \
            5a480f8bb13757eea3b4fbf38f05fadc75d459e2
          check_file \
            tests/test_presentation.py \
            8c6f8f794f3549c1438066cf26208bd10cfbe1d2 \
            f6cf62bb209e4f9f6fe9a456c0cd4d30d73f7fe5

          if [[ -e public/icon-maskable-2026.svg ]]; then
            maskable_blob="$(git hash-object public/icon-maskable-2026.svg)"
            if [[ "$maskable_blob" != \
                  f422926d32d265168b04f5ac334dc112a09fddeb ]]; then
              echo "::error::public/icon-maskable-2026.svg has unexpected contents."
              exit 1
            fi
          else
            needs_apply=1
          fi

          if [[ "$needs_apply" -eq 0 ]]; then
            if ! grep -q '20260728f2' public/rankings/index.html ||
               grep -q '20260728f1' public/rankings/index.html; then
              needs_apply=1
            fi
          fi

          if [[ "$needs_apply" -eq 0 ]]; then
            echo "The final keepsake polish is already installed."
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: steps.compatibility.outputs.apply == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node
        if: steps.compatibility.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

