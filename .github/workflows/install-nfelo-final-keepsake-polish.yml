      - name: Render unified browser, Apple, Android and sharing art
        if: steps.compatibility.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail

          render_dir="$(mktemp -d)"
          npm install \
            --prefix "$render_dir" \
            --no-audit \
            --no-fund \
            --no-package-lock \
            sharp@0.34.5

          RENDER_DIR="$render_dir" node <<'JS'
          const path = require("node:path");
          const sharp = require(
            path.join(process.env.RENDER_DIR, "node_modules", "sharp")
          );

          async function render() {
            const palette = {
              compressionLevel: 9,
              palette: true,
              quality: 95,
            };

            await sharp("public/favicon-2026.svg")
              .resize(180, 180)
              .png(palette)
              .toFile("public/apple-touch-icon-2026.png");

            for (const size of [192, 512]) {
              await sharp("public/icon-maskable-2026.svg")
                .resize(size, size)
                .png(palette)
                .toFile(`public/icon-${size}-2026.png`);
            }

            await sharp("public/social-card.svg")
              .resize(1200, 630)
              .png({ compressionLevel: 9 })
              .toFile("public/social-card.png");

            for (const size of [16, 32, 48]) {
              await sharp("public/favicon-2026.svg")
                .resize(size, size)
                .png(palette)
                .toFile(`/tmp/nfelo-favicon-${size}.png`);
            }
          }

          render().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          python - <<'PY'
          from pathlib import Path
          import struct

          sizes = (16, 32, 48)
          frames = [
              Path(f"/tmp/nfelo-favicon-{size}.png").read_bytes()
              for size in sizes
          ]
          offset = 6 + (16 * len(frames))
          entries = []
          for size, frame in zip(sizes, frames):
              entries.append(
                  struct.pack(
                      "<BBBBHHII",
                      size,
                      size,
                      0,
                      0,
                      1,
                      32,
                      len(frame),
                      offset,
                  )
              )
              offset += len(frame)

          payload = (
              struct.pack("<HHH", 0, 1, len(frames))
              + b"".join(entries)
              + b"".join(frames)
          )
          Path("public/favicon-2026.ico").write_bytes(payload)
          Path("public/favicon.ico").write_bytes(payload)
          PY

          sha256sum --check --strict <<'SHAS'
