name: Install subtle integrated pastel accents v10
run-name: Install subtle integrated pastel accents v10

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-subtle-integrated-pastel-accents-v10
  cancel-in-progress: false

