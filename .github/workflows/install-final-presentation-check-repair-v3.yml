            "e676dbd5a8dd0f614ac52bd06e507662555ebec8c4b46547be868355d743ff51  $archive" \
            | sha256sum --check -

          tar -xJf "$archive" -C "$repair_dir"
          cp -- \
            "$repair_dir/scripts/smoke_browser_boot.js" \
            scripts/smoke_browser_boot.js
          cp -- \
            "$repair_dir/tests/test_presentation.py" \
            tests/test_presentation.py

          test \
            "$(git hash-object scripts/smoke_browser_boot.js)" \
            = "b8b5ddffd0154967c47108291c0d5b231c668a9f"
          test \
            "$(git hash-object tests/test_presentation.py)" \
            = "c39b78027b29d299de4ec3392f9a04222fe26a5f"

      - name: Verify the two pre-build repairs
        run: |
          set -euo pipefail
          node scripts/smoke_browser_boot.js public
          python -m unittest \
            tests.test_presentation.PresentationReleaseTests.test_atelier_reverie_adds_ten_distinct_accessible_finishes \
            --verbose
          node --check public/assets/app.js
          git diff --check

      - name: Confirm that production files were not changed
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "scripts/smoke_browser_boot.js",
              "tests/test_presentation.py",
          }
          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected production changes: "
                  + ", ".join(sorted(unexpected))
              )
          print(
              "Only the two permitted test files changed"
              if changed
              else "Both test repairs were already present"
          )
          PY

      - name: Commit the validated tests-only repair
        run: |
          set -euo pipefail
          installer=".github/workflows/install-final-presentation-check-repair-v3.yml"
          failed_installer=".github/workflows/install-final-presentation-check-repair-v2.yml"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -- "$installer"
          if [ -f "$failed_installer" ]; then
            rm -- "$failed_installer"
          fi
          git add -- \
            scripts/smoke_browser_boot.js \
            tests/test_presentation.py \
            "$installer"
          if git ls-files --error-unmatch \
            "$failed_installer" >/dev/null 2>&1
          then
            git add --update -- "$failed_installer"
          fi

          git commit -m \
            "fix(ci): align presentation checks with the current interface"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start a clean deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f refresh_source=false \
            -f full_refresh=false
