name: Repair final presentation checks v3

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-final-presentation-check-repair-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm the expected failed release
        shell: bash
        run: |
          set -euo pipefail

          smoke_hash="$(git hash-object scripts/smoke_browser_boot.js)"
          presentation_hash="$(git hash-object tests/test_presentation.py)"

          case "$smoke_hash" in
            aac7a50cd26002cf9ea42e7c2dbbbdcbd929de29|\
            b8b5ddffd0154967c47108291c0d5b231c668a9f)
              ;;
            *)
              echo "::error::scripts/smoke_browser_boot.js is not the failed or repaired version."
              exit 1
              ;;
          esac

          case "$presentation_hash" in
            e4e083ebc96eb97bef03779099f595dbfa2ac9f3|\
            c39b78027b29d299de4ec3392f9a04222fe26a5f)
              ;;
            *)
              echo "::error::tests/test_presentation.py is not the failed or repaired version."
              exit 1
              ;;
          esac

      - name: Install the two tests-only repairs
        shell: bash
        run: |
          set -euo pipefail

          repair_dir="$(mktemp -d)"
          archive="$repair_dir/nfelo-final-presentation-ci-repair.tar.xz"
          trap 'rm -rf -- "$repair_dir"' EXIT

