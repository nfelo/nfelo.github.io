        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/unified-pearl-atelier-release"
          archive="$RUNNER_TEMP/unified-pearl-atelier-release.tar.xz"
          mkdir -p "$release_dir"
          printf '%s' "$RELEASE_ARCHIVE_B64" | base64 --decode > "$archive"
          echo \
            "b76e798e25fd4f2e9db65bdf9b43aeec47e1ac21af39a11f296d5ad69443fd14  $archive" \
            | sha256sum --check

          actual_files="$(tar -tJf "$archive" | LC_ALL=C sort)"
          expected_files="$(
            printf '%s\n' \
              install_release.py \
              test_unified_pearl_atelier.py \
              unified-pearl-atelier.css
          )"
          test "$actual_files" = "$expected_files"

          tar -xJf "$archive" -C "$release_dir"
          python "$release_dir/install_release.py" \
            --repo "$GITHUB_WORKSPACE" \
            --payload "$release_dir"

      - name: Verify layout, accessibility and browser contracts
        shell: bash
        run: |
          set -euo pipefail

          python tests/test_unified_pearl_atelier.py -v
          python tests/test_girlish_heirloom.py -v
          python tests/test_editorial_keepsake.py -v
          python tests/test_ribbon_atelier.py -v
          python tests/test_presentation.py -v
          python tests/test_luminous_fairytale_redesign.py -v
          python tests/test_couture_alphabet.py -v
          python tests/test_actual_final_presentation.py -v
          node --check public/assets/app.js
          node scripts/smoke_browser_boot.js public
          git diff --check

          test "$(sha256sum public/assets/styles.css | cut -d' ' -f1)" = \
            "1eac4bad1b9f5af6af03a2ce6c3dd60ddef6eae30d4b03feaf43b11d7c07c8e0"
          test "$(sha256sum config/404.html | cut -d' ' -f1)" = \
            "a794d697aa56974775cd1acc9b31bd0ce930540e9799d7abe119979d2466439b"

          sha256sum --check <<'SHA256'
