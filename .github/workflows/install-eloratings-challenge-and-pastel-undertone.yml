name: "Install Eloratings challenge fallback and pastel undertone"
run-name: "Install Eloratings challenge fallback and pastel undertone · #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eloratings-challenge-pastel-undertone
  cancel-in-progress: false

jobs:
  install:
    name: "Install, verify and deploy the repair"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "Check out the repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

