name: Repair centred editorial geometry deployment v13.1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nfelo-centred-editorial-geometry-v13-1
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

